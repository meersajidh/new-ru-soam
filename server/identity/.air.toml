#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/identity"
  cmd = "go build -o ./tmp/identity ./cmd"
  delay = 1000
  exclude_dir = ["tmp", "testdata"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  log = "build-errors.log"
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
