<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Sessions — Needs Linking</title>
    <style>

      /* ── Reset ───────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Design tokens (defaults — host overrides via postMessage) ─────── */
      :root {
        color-scheme: light dark;

        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;

        /* Surface */
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        /* Foreground */
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        /* Borders */
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        /* Accent */
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        --color-accent-hover:   #6bd46b;
        --color-accent-pressed: #4ab44a;
        /* Semantic */
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;

        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Root layout ─────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Bridge wait ─────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Header row ──────────────────────────────────── */
      #panel-header {
        display: flex;
        align-items: center;
        height: 35px;
        padding: 0 12px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--color-border);
      }

      #panel-title {
        font-family: var(--font-sans);
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-fg-muted);
        user-select: none;
        line-height: 1;
        flex: 1 1 auto;
      }

      /* ── Refresh button ──────────────────────────────── */
      #refresh-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        font-family: var(--font-sans);
        font-size: 10.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        flex-shrink: 0;
        user-select: none;
        outline: none;
      }
      #refresh-btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-fg-muted) 10%, transparent);
        color: var(--color-fg-primary);
      }
      #refresh-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ── Summary line ────────────────────────────────── */
      #sync-summary {
        font-size: 10.5px;
        padding: 4px 12px;
        color: var(--color-fg-muted);
        flex-shrink: 0;
        display: none;
        border-bottom: 1px solid var(--color-border);
        line-height: 1.4;
      }
      #sync-summary.visible { display: block; }

      /* ── Status message ──────────────────────────────── */
      #status-msg {
        font-size: 11px;
        padding: 5px 10px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 25%, transparent);
      }
      #status-msg.visible { display: block; }

      /* ── Scroll body ─────────────────────────────────── */
      #nl-body {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
        padding-bottom: 8px;
      }

      /* ── Locked / empty ──────────────────────────────── */
      #nl-locked {
        padding: 16px;
        text-align: center;
        display: none;
      }
      #nl-locked.visible { display: block; }
      #nl-locked p {
        font-size: 11.5px;
        line-height: 1.55;
        color: var(--color-error);
        opacity: 0.8;
        font-weight: 500;
      }

      #nl-empty {
        padding: 28px 16px 20px;
        text-align: center;
        display: none;
      }
      #nl-empty.visible { display: block; }

      .empty-graphic {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--color-fg-muted) 10%, transparent);
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #nl-empty strong {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--color-fg-secondary);
        margin-bottom: 5px;
      }
      #nl-empty p {
        font-size: 11.5px;
        line-height: 1.55;
        color: var(--color-fg-muted);
        max-width: 210px;
        margin: 0 auto;
        font-style: italic;
      }

      /* ── Content list ────────────────────────────────── */
      #nl-content { display: none; }
      #nl-content.visible { display: block; }

      /* ── Flat event list ─────────────────────────────── */
      .event-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      /* ── Event row wrapper (li) ──────────────────────── */
      /* Each li = one event. Contains a .event-row + optional .picker-panel. */
      .event-item {
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
      }
      .event-item:last-child {
        border-bottom: none;
      }

      /* ── Flat event row ──────────────────────────────── */
      .event-row {
        display: flex;
        align-items: center;
        gap: 0;
        padding: 10px 12px;
        min-height: 44px;
      }

      /* ── Status dot ──────────────────────────────────── */
      .event-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-right: 10px;
        margin-top: 4px;
        align-self: flex-start;
      }
      .event-dot.candidate { background: var(--color-warning); }
      .event-dot.none      { background: var(--color-fg-muted); }

      /* ── Date/time column ────────────────────────────── */
      .event-datetime {
        flex-shrink: 0;
        min-width: 72px;
        margin-right: 12px;
        align-self: flex-start;
        padding-top: 1px;
      }
      .event-when {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--color-fg-muted);
        white-space: nowrap;
        font-family: var(--font-mono);
        line-height: 1.35;
      }

      /* ── Event body ──────────────────────────────────── */
      .event-body {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-right: 10px;
      }
      .event-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }
      .event-subline {
        font-size: 11px;
        color: var(--color-fg-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }

      /* ── Row actions ─────────────────────────────────── */
      .event-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      /* ── Action buttons ──────────────────────────────── */
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        font-family: var(--font-sans);
        font-size: 10.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        user-select: none;
        outline: none;
        white-space: nowrap;
      }
      .action-btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-fg-muted) 10%, transparent);
        color: var(--color-fg-primary);
      }
      .action-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .action-btn.primary {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-fg);
      }
      .action-btn.primary:hover:not(:disabled) {
        background: var(--color-accent-hover);
        border-color: var(--color-accent-hover);
        color: var(--color-accent-fg);
      }
      .action-btn.danger {
        border-color: color-mix(in srgb, var(--color-error) 35%, transparent);
        color: var(--color-error);
      }
      .action-btn.danger:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-error) 10%, transparent);
      }

      /* ── Inline picker panel ─────────────────────────── */
      .picker-panel {
        display: none;
        padding: 8px 12px 10px 101px; /* left-indent aligns with event body */
        border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        background: color-mix(in srgb, var(--color-surface-elevated) 40%, transparent);
      }
      .picker-panel.open { display: block; }

      .picker-search {
        width: 100%;
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 11.5px;
        outline: none;
        transition: border-color var(--transition);
        margin-bottom: 5px;
      }
      .picker-search::placeholder { color: var(--color-fg-muted); }
      .picker-search:focus { border-color: var(--color-border-focus); }

      .picker-list {
        list-style: none;
        max-height: 160px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 30%, transparent) transparent;
        margin-bottom: 7px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-surface-base);
      }
      .picker-list:empty::after {
        content: 'No clients match';
        display: block;
        padding: 8px 10px;
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
      }

      .picker-item {
        padding: 6px 10px;
        font-size: 12px;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
      }
      .picker-item:last-child { border-bottom: none; }
      .picker-item:hover {
        background: color-mix(in srgb, var(--color-accent) 8%, transparent);
        color: var(--color-fg-primary);
      }

      /* ── Picker "New client" footer ──────────────────── */
      .picker-footer {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .picker-name-input {
        flex: 1 1 auto;
        padding: 3px 7px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 11.5px;
        outline: none;
        transition: border-color var(--transition);
        min-width: 0;
      }
      .picker-name-input::placeholder { color: var(--color-fg-muted); }
      .picker-name-input:focus { border-color: var(--color-border-focus); }

    </style>
  </head>
  <body>
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display:none">

      <!-- Header -->
      <div id="panel-header">
        <span id="panel-title">Needs Linking</span>
        <button id="refresh-btn" type="button" title="Refresh — re-run calendar sync">
          <span data-codicon="sync" data-size="11"></span>
          Refresh
        </button>
      </div>

      <!-- Summary -->
      <div id="sync-summary"></div>

      <!-- Status / error banner -->
      <div id="status-msg" role="alert"></div>

      <!-- Scroll body -->
      <div id="nl-body">

        <!-- Locked -->
        <div id="nl-locked">
          <p>Workspace locked — unlock to review unlinked events.</p>
        </div>

        <!-- Empty -->
        <div id="nl-empty">
          <div class="empty-graphic">
            <span data-codicon="check" data-size="18"></span>
          </div>
          <strong>Nothing to link</strong>
          <p>All calendar events are matched to clients.</p>
        </div>

        <!-- Live content -->
        <div id="nl-content"></div>

      </div><!-- #nl-body -->

    </div><!-- #root -->

    <script>
      (function () {
        'use strict';

        /* ── State ───────────────────────────────────────── */
        var _sessionsMeeting = null;  // sessions.meeting command proxy
        var _recordPatient   = null;  // record.patient command proxy
        var _patientQuery    = null;  // record.patient.query proxy
        var _clientMap       = {};    // id → displayName
        var _roster          = [];    // [{id, name}] for picker
        var _queue           = [];    // current needsLinking[] from last sync
        var _syncInFlight    = false;
        var _openPickerId    = null;  // providerEventId of currently open picker

        /* ── Element refs ────────────────────────────────── */
        var elBridgeWait  = document.getElementById('bridge-wait');
        var elRoot        = document.getElementById('root');
        var elStatusMsg   = document.getElementById('status-msg');
        var elNlContent   = document.getElementById('nl-content');
        var elNlEmpty     = document.getElementById('nl-empty');
        var elNlLocked    = document.getElementById('nl-locked');
        var elRefreshBtn  = document.getElementById('refresh-btn');
        var elSyncSummary = document.getElementById('sync-summary');

        /* ── Helpers ─────────────────────────────────────── */
        function isLockedError(err) {
          return window.__viewBoot.isLockedError(err);
        }

        function showStatus(msg) {
          elStatusMsg.textContent = msg;
          elStatusMsg.classList.add('visible');
        }
        function clearStatus() {
          elStatusMsg.classList.remove('visible');
          elStatusMsg.textContent = '';
        }

        function showLocked() {
          elNlContent.classList.remove('visible');
          elNlContent.innerHTML = '';
          elNlEmpty.classList.remove('visible');
          elNlLocked.classList.add('visible');
          elSyncSummary.classList.remove('visible');
        }

        /* ── Date/time formatting ────────────────────────── */
        // Format: "Tue 16 · 3" or "Wed 17 · 5:30" — no AM/PM, drop :00
        var WEEKDAY_FMT = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
        var DAY_FMT     = new Intl.DateTimeFormat(undefined, { day: 'numeric' });

        function fmtWhen(iso) {
          try {
            var d = new Date(iso);
            var weekday = WEEKDAY_FMT.format(d);
            var day     = DAY_FMT.format(d);
            var h       = d.getHours();
            var m       = d.getMinutes();
            var hour    = h % 12 || 12;
            var timePart = m > 0 ? (hour + ':' + (m < 10 ? '0' + m : m)) : String(hour);
            return weekday + ' ' + day + ' · ' + timePart;
          } catch (e) { return '—'; }
        }

        /* ── Pick representative participant ─────────────── */
        // 1. first with outcome==='candidates'
        // 2. else first with outcome==='none'
        // ignore 'suppressed' and 'match'
        function pickRep(participants) {
          var fallback = null;
          for (var i = 0; i < participants.length; i++) {
            var p = participants[i];
            if (p.outcome === 'candidates') return p;
            if (p.outcome === 'none' && !fallback) fallback = p;
          }
          return fallback; // may be null
        }

        /* ── Build event object for linkProviderEvent ────── */
        function buildEventObj(entry) {
          return {
            providerEventId: entry.providerEventId,
            start:           entry.start,
            end:             entry.end,
            calendarId:      entry.calendarId,
            meetingLink:     entry.meetingLink || null,
          };
        }

        /* ── Disable / enable all buttons in a row li ────── */
        function disableRow(liEl) {
          var btns = liEl.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
          var inputs = liEl.querySelectorAll('input');
          for (var j = 0; j < inputs.length; j++) inputs[j].disabled = true;
        }
        function enableRow(liEl) {
          var btns = liEl.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
          var inputs = liEl.querySelectorAll('input');
          for (var j = 0; j < inputs.length; j++) inputs[j].disabled = false;
        }

        /* ── Remove resolved entry + re-render ──────────── */
        function removeCard(entry) {
          _queue = _queue.filter(function (e) {
            return e.providerEventId !== entry.providerEventId;
          });
          _openPickerId = null;
          clearStatus();
          renderQueue();
          /* A triage action (confirm / promote / exclude) just mutated roster, alias,
           * suppression, or link state — all classification inputs for Schedule. Bump
           * calRev so an open schedule calendar + aux event-detail re-classify. */
          if (window.soamView && typeof window.soamView.bumpScheduleData === 'function') {
            try { window.soamView.bumpScheduleData(); } catch (e) { /* non-fatal */ }
          }
        }

        /* ── Close any open picker ───────────────────────── */
        function closeAllPickers() {
          var panels = elNlContent.querySelectorAll('.picker-panel.open');
          for (var i = 0; i < panels.length; i++) {
            panels[i].classList.remove('open');
          }
          _openPickerId = null;
        }

        /* ── Link action (shared by confirm + picker) ────── */
        function linkClient(entry, rep, clientId, liEl) {
          disableRow(liEl);
          var eventObj = buildEventObj(entry);
          var addAliasP = (rep.email && _recordPatient)
            ? _recordPatient.call('addAlias', clientId, { email: rep.email })
            : Promise.resolve();
          addAliasP
            .catch(function () { /* non-fatal — dedup / cap unavailable */ })
            .then(function () {
              return _sessionsMeeting.call('linkProviderEvent', eventObj, clientId);
            })
            .then(function () {
              removeCard(entry);
            })
            .catch(function (err) {
              enableRow(liEl);
              if (isLockedError(err)) { showLocked(); } else { showStatus('Link failed: ' + (err && err.message)); }
            });
        }

        /* ── Build picker panel ──────────────────────────── */
        function buildPickerPanel(entry, rep, liEl) {
          var panel = document.createElement('div');
          panel.className = 'picker-panel';

          // Search input
          var searchInput = document.createElement('input');
          searchInput.type = 'text';
          searchInput.className = 'picker-search';
          searchInput.placeholder = 'Search roster…';
          panel.appendChild(searchInput);

          // Roster list
          var listEl = document.createElement('ul');
          listEl.className = 'picker-list';
          panel.appendChild(listEl);

          function renderRoster(filter) {
            listEl.innerHTML = '';
            var q = (filter || '').toLowerCase();
            var shown = 0;
            for (var i = 0; i < _roster.length; i++) {
              var client = _roster[i];
              if (q && client.name.toLowerCase().indexOf(q) === -1) continue;
              shown++;
              (function (cid, cname) {
                var item = document.createElement('li');
                item.className = 'picker-item';
                item.textContent = cname; // PHI-safe: textContent
                item.addEventListener('click', function () {
                  linkClient(entry, rep, cid, liEl);
                });
                listEl.appendChild(item);
              })(client.id, client.name);
            }
            // Show empty hint via CSS :empty::after when no items
            if (shown === 0) {
              listEl.innerHTML = ''; // already cleared
            }
          }

          renderRoster('');

          searchInput.addEventListener('input', function () {
            renderRoster(searchInput.value);
          });

          // Esc closes picker
          searchInput.addEventListener('keydown', function (ev) {
            if (ev.key === 'Escape') { closeAllPickers(); }
          });

          // New client footer
          var footer = document.createElement('div');
          footer.className = 'picker-footer';

          var nameInput = document.createElement('input');
          nameInput.type = 'text';
          nameInput.className = 'picker-name-input';
          nameInput.placeholder = 'New client name…';
          if (rep.name) nameInput.value = rep.name; // prefill PHI-safe: value assignment (not innerHTML)
          footer.appendChild(nameInput);

          var createBtn = document.createElement('button');
          createBtn.type = 'button';
          createBtn.className = 'action-btn primary';
          createBtn.textContent = 'Create & link';
          createBtn.addEventListener('click', function () {
            var rawName = nameInput.value.trim();
            if (!rawName) { nameInput.focus(); return; }
            if (!_recordPatient) { showStatus('record.patient cap unavailable'); return; }
            disableRow(liEl);
            var createInput = { givenName: rawName };
            if (rep.email) createInput.contactEmail = rep.email;
            _recordPatient.call('create', createInput)
              .then(function (created) {
                var newId = created.id;
                var eventObj = buildEventObj(entry);
                return _sessionsMeeting.call('linkProviderEvent', eventObj, newId, { kind: 'intake' })
                  .then(function () {
                    return _recordPatient.call('setStage', newId, 'intake', 'Intake scheduled from calendar');
                  });
              })
              .then(function () {
                removeCard(entry);
              })
              .catch(function (err) {
                enableRow(liEl);
                if (isLockedError(err)) { showLocked(); } else { showStatus('Create failed: ' + (err && err.message)); }
              });
          });
          footer.appendChild(createBtn);

          panel.appendChild(footer);
          return panel;
        }

        /* ── Build one flat event row (li) ───────────────── */
        function buildEventRow(entry) {
          var participants = entry.participants || [];
          var rep = pickRep(participants);
          if (!rep) return null; // skip — all suppressed/matched

          var li = document.createElement('li');
          li.className = 'event-item';
          li.setAttribute('role', 'listitem');

          // ── Flat row ──
          var row = document.createElement('div');
          row.className = 'event-row';

          // Status dot
          var dot = document.createElement('span');
          dot.className = 'event-dot ' + (rep.outcome === 'candidates' ? 'candidate' : 'none');
          row.appendChild(dot);

          // Date/time column
          var dtEl = document.createElement('div');
          dtEl.className = 'event-datetime';
          var whenEl = document.createElement('div');
          whenEl.className = 'event-when';
          whenEl.textContent = fmtWhen(entry.start);
          dtEl.appendChild(whenEl);
          row.appendChild(dtEl);

          // Event body: title + subline
          var body = document.createElement('div');
          body.className = 'event-body';

          var titleEl = document.createElement('div');
          titleEl.className = 'event-title';
          titleEl.textContent = entry.title || '(untitled)'; // PHI-safe
          body.appendChild(titleEl);

          var sublineEl = document.createElement('div');
          sublineEl.className = 'event-subline';
          row.appendChild(body);

          // Determine subline text and primary action
          var isSingleCandidate = (
            rep.outcome === 'candidates' &&
            Array.isArray(rep.candidates) &&
            rep.candidates.length === 1
          );
          var isMultiCandidate = (
            rep.outcome === 'candidates' &&
            Array.isArray(rep.candidates) &&
            rep.candidates.length > 1
          );

          if (isSingleCandidate) {
            var clientName = _clientMap[rep.candidates[0]] || rep.candidates[0];
            sublineEl.textContent = 'Name matches “' + clientName + '” in roster'; // PHI-safe
          } else if (isMultiCandidate) {
            sublineEl.textContent = 'Multiple roster matches';
          } else {
            sublineEl.textContent = 'No roster match — likely personal';
          }
          body.appendChild(sublineEl);

          // ── Actions ──
          var actions = document.createElement('div');
          actions.className = 'event-actions';

          // Primary button
          var primaryBtn = document.createElement('button');
          primaryBtn.type = 'button';
          primaryBtn.className = 'action-btn primary';

          if (isSingleCandidate) {
            var candidateId = rep.candidates[0];
            var firstName = (_clientMap[candidateId] || '').split(/\s+/)[0] || 'Client';
            primaryBtn.textContent = 'Confirm ' + firstName; // PHI-safe: textContent
            primaryBtn.addEventListener('click', function () {
              linkClient(entry, rep, candidateId, li);
            });
          } else {
            // Multi-candidate or no-match → open picker
            primaryBtn.textContent = 'Link to client';
            primaryBtn.addEventListener('click', function () {
              var alreadyOpen = (_openPickerId === entry.providerEventId);
              closeAllPickers();
              if (!alreadyOpen) {
                pickerPanel.classList.add('open');
                _openPickerId = entry.providerEventId;
                var si = pickerPanel.querySelector('.picker-search');
                if (si) { si.value = ''; si.focus(); }
                // Re-render roster in case it changed since last open
                var listInPanel = pickerPanel.querySelector('.picker-list');
                if (listInPanel) {
                  listInPanel.innerHTML = '';
                  for (var i = 0; i < _roster.length; i++) {
                    (function (cid, cname) {
                      var item = document.createElement('li');
                      item.className = 'picker-item';
                      item.textContent = cname; // PHI-safe
                      item.addEventListener('click', function () {
                        linkClient(entry, rep, cid, li);
                      });
                      listInPanel.appendChild(item);
                    })(_roster[i].id, _roster[i].name);
                  }
                }
              }
            });
          }

          actions.appendChild(primaryBtn);

          // "Not a client" — only when rep has email or phone
          if (rep.email || rep.phone) {
            var excludeBtn = document.createElement('button');
            excludeBtn.type = 'button';
            excludeBtn.className = 'action-btn';
            excludeBtn.textContent = 'Not a client';
            excludeBtn.addEventListener('click', function () {
              if (!_recordPatient) { showStatus('record.patient cap unavailable'); return; }
              disableRow(li);
              var suppressInput = {};
              if (rep.email) suppressInput.email = rep.email;
              if (rep.phone) suppressInput.phone = rep.phone;
              suppressInput.calendarId = entry.calendarId || '';
              _recordPatient.call('suppressParticipant', suppressInput)
                .then(function () {
                  removeCard(entry);
                })
                .catch(function (err) {
                  enableRow(li);
                  if (isLockedError(err)) { showLocked(); } else { showStatus('Exclude failed: ' + (err && err.message)); }
                });
            });
            actions.appendChild(excludeBtn);
          }

          row.appendChild(actions);
          li.appendChild(row);

          // Picker panel (only for multi/no-match rows — single-candidate gets one-click confirm)
          var pickerPanel = null;
          if (!isSingleCandidate) {
            pickerPanel = buildPickerPanel(entry, rep, li);
            li.appendChild(pickerPanel);
          }

          return li;
        }

        /* ── Render queue ────────────────────────────────── */
        function renderQueue() {
          elNlLocked.classList.remove('visible');
          elNlContent.classList.remove('visible');
          elNlContent.innerHTML = '';
          elNlEmpty.classList.remove('visible');

          // Filter queue to only entries that have a renderable rep
          var renderable = _queue.filter(function (entry) {
            return pickRep(entry.participants || []) !== null;
          });
          var count = renderable.length;

          if (count === 0) {
            elSyncSummary.textContent = 'Events that look like client appointments but aren’t linked to a client yet.';
            elSyncSummary.classList.add('visible');
            elNlEmpty.classList.add('visible');
            return;
          }

          elSyncSummary.textContent = 'Events that look like client appointments but aren’t linked to a client yet. ' +
            count + (count === 1 ? ' event needs' : ' events need') + ' linking.';
          elSyncSummary.classList.add('visible');
          elNlContent.classList.add('visible');

          var ul = document.createElement('ul');
          ul.className = 'event-list';
          ul.setAttribute('role', 'list');

          _queue.forEach(function (entry) {
            var li = buildEventRow(entry);
            if (li) ul.appendChild(li);
          });

          elNlContent.appendChild(ul);
        }

        /* ── Run sync + render results ───────────────────── */
        function runSync() {
          if (_syncInFlight || !_sessionsMeeting) return;
          _syncInFlight = true;
          elRefreshBtn.disabled = true;
          elSyncSummary.classList.remove('visible');
          clearStatus();

          _sessionsMeeting.call('sync')
            .then(function (report) {
              _queue = Array.isArray(report.needsLinking) ? report.needsLinking : [];
              renderQueue();
            })
            .catch(function (err) {
              if (isLockedError(err)) {
                showLocked();
              } else {
                showStatus('Sync failed: ' + (err && err.message));
              }
            })
            .finally(function () {
              _syncInFlight = false;
              elRefreshBtn.disabled = false;
            });
        }

        /* ── Load client map + roster ────────────────────── */
        function loadClientMap() {
          if (!_patientQuery) return Promise.resolve();
          return _patientQuery.call('list')
            .then(function (patients) {
              _clientMap = {};
              _roster = [];
              (patients || []).forEach(function (p) {
                var name = p.displayName || p.id;
                _clientMap[p.id] = name;
                _roster.push({ id: p.id, name: name });
              });
            })
            .catch(function () { /* name resolution is best-effort */ });
        }

        /* ── Bridge ──────────────────────────────────────── */
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.__soamView !== true) return;
          window.__viewBoot.applyTheme(d);
        });

        window.__viewBoot.awaitBridge().then(function (soamView) {
          elBridgeWait.style.display = 'none';
          elRoot.style.display = '';

          elRefreshBtn.addEventListener('click', function () {
            loadClientMap().then(function () { runSync(); });
          });

          soamView.events.onActivate(function () {
            if (_sessionsMeeting) {
              // Already bound — just re-sync.
              loadClientMap().then(function () { runSync(); });
              return;
            }

            // Bind all three caps; patient caps are best-effort.
            var sessionsCmdP = soamView.bindCommand('sessions.meeting', '1.0');
            var recordCmdP   = soamView.bindCommand('record.patient',   '1.0')
              .catch(function () { return null; });
            var patientQP    = soamView.bindQuery('record.patient.query', '1.0')
              .catch(function () { return null; });

            Promise.all([sessionsCmdP, recordCmdP, patientQP])
              .then(function (proxies) {
                _sessionsMeeting = proxies[0];
                _recordPatient   = proxies[1];
                _patientQuery    = proxies[2];
                loadClientMap().then(function () { runSync(); });
              })
              .catch(function (err) {
                if (isLockedError(err)) {
                  showLocked();
                } else {
                  showStatus('Bridge error: ' + (err && err.message));
                }
              });
          });
        });

      })();
    </script>
  </body>
</html>
