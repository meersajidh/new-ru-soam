                );
                pill.dataset.evId = ev.id;
                /* Calendar-color: thick left border + low-alpha background tint. */
                if (ev.calendarColor) {
                  pill.style.setProperty('--ev-border-color', ev.calendarColor);
                  pill.style.backgroundColor =
                    'color-mix(in srgb, ' + ev.calendarColor + ' 14%, transparent)';
                }
                pill.addEventListener('click', function (e) {
                  e.stopPropagation();
                  setSelection(ev.id);
                  if (_auxVisible) {
                    if (_soamView) _soamView.setActiveEvent(ev);
                  } else {
                    openPopover(ev, pill);
                  }
                });
                adCol.appendChild(pill);
              });
            alldayCols.appendChild(adCol);
          });
          alldayRow.appendChild(alldayCols);
          // Only show strip if it has content (or always show for clean layout).
          root.appendChild(alldayRow);

          /* ── Scrollable grid ── */
          var scroll = el('div', 'tg-scroll');
          var grid = el('div', 'tg-grid');

          // Gutter with hour labels 1–23 (label appears at top of each hour row).
          var gutter = el('div', 'tg-gutter');
          for (var h = 0; h <= 23; h++) {
            if (h === 0) continue; // skip midnight label at very top
            var labelEl = txt(
              'div',
              'tg-hour-label',
              h < 12 ? h + ' AM' : h === 12 ? '12 PM' : h - 12 + ' PM',
            );
            labelEl.style.top = h * HOUR_H + 'px';
            gutter.appendChild(labelEl);
          }
          grid.appendChild(gutter);

          /* ── Day columns ── */
          var colsWrap = el('div', 'tg-cols');
          var nowLineEl = null;
          var nowGutterLineEl = null;

          dayDates.forEach(function (d, colIdx) {
            var colEl = el('div', 'tg-day-col' + (isToday(d) ? ' is-today' : ''));
            var dayEvs = eventsForDay(d);
            var timedEvs = dayEvs.filter(function (ev) {
              return !ev.allDay && ev.start && ev.start.length > 10;
            });
            buildTimedEvents(timedEvs, colEl, d);

            // Now-line: draw in today's column only.
            if (isToday(d)) {
              var now = new Date();
              var nowMin = now.getHours() * 60 + now.getMinutes();
              var nowTop = (nowMin / 60) * HOUR_H;
              var nl = el('div', 'tg-now-line');
              nl.style.top = nowTop + 'px';
              colEl.appendChild(nl);
              nowLineEl = nl;

              // Also track top for gutter line.
              nowGutterLineEl = { top: nowTop };
            }

            colsWrap.appendChild(colEl);
          });
          grid.appendChild(colsWrap);
          scroll.appendChild(grid);

          // Now-line dot in gutter.
          if (nowGutterLineEl) {
            var gutterNow = el('div', 'tg-now-gutter-line');
            gutterNow.style.top = nowGutterLineEl.top + 'px';
            gutter.appendChild(gutterNow);
          }

          root.appendChild(scroll);

          // Scroll to 7 AM on mount (after appended to DOM).
          // Use requestAnimationFrame so layout is computed first.
          requestAnimationFrame(function () {
            scroll.scrollTop = SCROLL_TO_HOUR * HOUR_H - 24; // offset slightly so the 7am line is visible
          });

          return root;
        }

        /* ── View: Day ───────────────────────────────────────────────── */
        function renderDay(range) {
          var shell = el('div', 'day-card-shell');
          shell.appendChild(buildTimeGrid([range.from], true));
          return shell;
        }

        /* ── View: Week ──────────────────────────────────────────────── */
        function renderWeek(range) {
          var days = [];
          var cur = new Date(range.from);
          while (cur < range.to) {
            days.push(new Date(cur));
            cur = addDays(cur, 1);
          }
          return buildTimeGrid(days, false);
        }

        /* ── View: Month ─────────────────────────────────────────────── */
        function renderMonth(range) {
          var wrap = el('div', 'month-view-wrap');

          // Weekday labels (Mon–Sun)
          var wdRow = el('div', 'month-weekday-row');
          ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (wd) {
            wdRow.appendChild(txt('div', 'month-weekday-label', wd));
          });
          wrap.appendChild(wdRow);

          var grid = el('div', 'month-grid');

          // Grid starts on Monday of the week containing day 1 of the month.
          var monthStart = startOfMonth(range.from);
          var gridStart = startOfWeek(monthStart);
          var monthEnd = endOfMonth(range.from);
          // Sunday of the week containing the last day of the month — stop here so
          // we render whole weeks through month-end without a stray extra week.
          var gridEnd = addDays(startOfWeek(monthEnd), 6);

          var cur = new Date(gridStart);
          while (cur <= gridEnd) {
            var d = new Date(cur);
            var outside = d.getMonth() !== monthStart.getMonth();
            var cell = el('div', 'month-cell' + (outside ? ' is-outside' : ''));

            var dateEl = txt(
              'div',
              'month-cell-date' + (isToday(d) ? ' is-today' : ''),
              d.getDate().toString(),
            );
            cell.appendChild(dateEl);

            var dayEvs = eventsForDay(d);
            var maxPills = 5;
            dayEvs.slice(0, maxPills).forEach(function (ev) {
              var pill = txt(
                'div',
                'month-event-pill ' + classClass(ev) + (ev.id === selectedId ? ' is-selected' : ''),
                ev.title || '(No title)',
              );
              pill.dataset.evId = ev.id;
              /* Calendar-color: dot (::before via --cal-color) + low-alpha background tint. */
              if (ev.calendarColor) {
                pill.style.setProperty('--cal-color', ev.calendarColor);
                pill.style.backgroundColor =
                  'color-mix(in srgb, ' + ev.calendarColor + ' 14%, transparent)';
              }
              pill.addEventListener('click', function (e) {
                e.stopPropagation();
                setSelection(ev.id);
                if (_auxVisible) {
                  if (_soamView) _soamView.setActiveEvent(ev);
                } else {
                  openPopover(ev, pill);
                }
              });
              cell.appendChild(pill);
            });
            if (dayEvs.length > maxPills) {
              cell.appendChild(
                txt('div', 'month-overflow', '+' + (dayEvs.length - maxPills) + ' more'),
              );
            }
            grid.appendChild(cell);
            cur = addDays(cur, 1);
          }
          wrap.appendChild(grid);
          return wrap;
        }

        /* ── Selection ───────────────────────────────────────────────── */
        // Update selection highlight by toggling classes on existing event nodes.
        // NEVER rebuild the grid for selection — a rebuild re-runs buildTimeGrid's
        // rAF scroll-to-7AM, which jumps the scroll position on every event click.
        function setSelection(id) {
          selectedId = id;
          var nodes = elCalArea.querySelectorAll('[data-ev-id]');
          Array.prototype.forEach.call(nodes, function (n) {
            n.classList.toggle('is-selected', n.dataset.evId === id);
          });
        }

        /* ── Render dispatch ──────────────────────────────────────────── */
        function renderCalArea() {
          // Update view-switcher active tab.
          Array.prototype.forEach.call(elViewSwitch.querySelectorAll('.view-tab'), function (tab) {
            tab.classList.toggle('is-active', tab.dataset.view === view);
          });

          if (!connected) {
            // Disconnected state — show connect prompt.
            var disc = el('div', 'state-panel');
            var ico = el('div', 'state-icon');
            ico.innerHTML = icon('calendar-x', 20);
            disc.appendChild(ico);
            disc.appendChild(txt('div', 'state-title', 'Connect your calendar'));
            disc.appendChild(
              txt(
                'div',
                'state-desc',
                'Link Google Calendar to see your schedule. Your credential never leaves this device.',
              ),
            );
            var connectBtn = el('button', 'btn btn-accent');
            connectBtn.type = 'button';
            connectBtn.textContent = 'Connect Google Calendar';
            connectBtn.addEventListener('click', function () {
              if (_soamView && _soamView.openInEditor) {
                _soamView.openInEditor('calendar-setup', {
                  query: 'mode=add',
                  title: 'Add calendar',
                  entityId: 'calendar-setup',
                });
              }
            });
            disc.appendChild(connectBtn);
            elCalArea.innerHTML = '';
            elCalArea.appendChild(disc);
            return;
          }

          if (loadError) {
            var errPanel = el('div', 'state-panel');
            var eIco = el('div', 'state-icon');
            eIco.innerHTML = icon('alert-circle', 20);
            errPanel.appendChild(eIco);
            errPanel.appendChild(txt('div', 'state-title', 'Failed to load events'));
            errPanel.appendChild(txt('div', 'state-error-msg', loadError));
            var retryBtn = el('button', 'btn btn-ghost');
            retryBtn.type = 'button';
            retryBtn.textContent = 'Retry';
            retryBtn.addEventListener('click', loadEvents);
            errPanel.appendChild(retryBtn);
            elCalArea.innerHTML = '';
            elCalArea.appendChild(errPanel);
            return;
          }

          var range = rangeForView();

          // Range label. Agenda uses its own label from rangeForView() directly.
          elRangeLabel.textContent = range.label;

          // Tab descriptor — updates on every render (updateTab is no-op when unchanged).
          if (window.soamView && window.soamView.setTabDescription) {
            var tabDesc;
            if (view === 'agenda') {
              // "Next 7 days" at offset 0; otherwise date range start
              tabDesc =
                offset === 0
                  ? 'Next 7 days'
                  : range.from.getDate() + ' ' + MONTH_NAMES_SHORT[range.from.getMonth()];
            } else if (view === 'week') {
              // "Wk of Jun 15"
              tabDesc =
                'Wk of ' + MONTH_NAMES_SHORT[range.from.getMonth()] + ' ' + range.from.getDate();
            } else if (view === 'day') {
              // "17 Jun"
              tabDesc = range.from.getDate() + ' ' + MONTH_NAMES_SHORT[range.from.getMonth()];
            } else {
              // "Jun 2026"
              tabDesc = MONTH_NAMES_SHORT[range.from.getMonth()] + ' ' + range.from.getFullYear();
            }
            window.soamView.setTabDescription(tabDesc);
          }

          var body;
          if (view === 'agenda') {
            body = renderAgenda(range);
          } else if (view === 'day') {
            body = renderDay(range);
          } else if (view === 'week') {
            body = renderWeek(range);
          } else {
            body = renderMonth(range);
          }

          elCalArea.innerHTML = '';
          elCalArea.appendChild(body);
        }

        function showLoading() {
          elCalArea.innerHTML = '';
          var row = el('div', 'loading-row');
          row.innerHTML = '<span class="spinner"></span> Loading events…';
          elCalArea.appendChild(row);
        }

        /* ── Run SD-11 classify pass on a freshly-fetched event array ──── */
        /* Separated so it can be called from the __viewQuery subscriber without
         * re-fetching events from the cap (data already in hand). */
        function runClassifyPass(evs, range, classifySeq) {
          /* Step 2: if either classify cap missing, stop (already painted unclassified). */
          if (!sessionsQuery || !recordQuery) return;
          runClassifyPassInner(evs, range, classifySeq);
        }

        /* Inner classify pass. */
        function runClassifyPassInner(evs, range, classifySeq) {
          /* Step 3: batch-fetch linked rows for this window (best-effort). */
          var fromMs = range.from.getTime();
          var toMs = range.to.getTime();
          sessionsQuery
            .call('listLinkedProvider', { providerId: 'google-calendar', from: fromMs, to: toMs })
            .catch(function () {
              /* listLinkedProvider failed — proceed with empty linkedSet so resolver still runs. */
              return [];
            })
            .then(function (rows) {
              if (classifySeq !== _loadSeq) return; // stale guard
              rows = rows || [];
              var linkedSet = {};
              rows.forEach(function (r) {
                linkedSet[r.provider_event_id] = true;
              });

              /* Step 4: per-event resolve. */
              /* Build linked rows map for match enrichment. */
              var linkedRowMap = {};
              rows.forEach(function (r) {
                linkedRowMap[r.provider_event_id] = r;
              });

              /* Build array of promises — one per event. */
              var classifyPromises = evs.map(function (ev) {
                /* Already linked? Instant client_session — enrich with linked clientId. */
                if (linkedSet[ev.id]) {
                  var linkedRow = linkedRowMap[ev.id];
                  ev._match =
                    linkedRow && linkedRow.patient_id
                      ? { matchClientId: linkedRow.patient_id, source: 'linked' }
                      : { source: 'linked' };
                  return Promise.resolve({ ev: ev, cls: 'client_session' });
                }

                /* Gather participants: non-self attendees + organizer (if email, non-self). */
                var participants = [];
                if (ev.attendees) {
                  ev.attendees.forEach(function (a) {
                    if (!a.self && (a.email || a.name)) {
                      participants.push({ email: a.email || null, name: a.name || null });
                    }
                  });
                }
                if (ev.organizer && ev.organizer.email && !ev.organizer.self) {
                  /* Include organizer only when external (organizer.self !== true). */
                  var orgEmail = ev.organizer.email.toLowerCase();
                  var alreadySelf =
                    ev.attendees &&
                    ev.attendees.some(function (a) {
                      return a.self && (a.email || '').toLowerCase() === orgEmail;
                    });
                  if (!alreadySelf) {
                    /* Check not already added via attendees */
                    var alreadyAdded = participants.some(function (p) {
                      return p.email && p.email.toLowerCase() === orgEmail;
                    });
                    if (!alreadyAdded) {
                      participants.push({
                        email: ev.organizer.email,
                        name: ev.organizer.displayName || null,
                      });
                    }
                  }
                }

                if (participants.length === 0) {
                  return Promise.resolve({ ev: ev, cls: 'personal' });
                }

                /* Resolve participants sequentially; short-circuit on first match. */
                /* Precedence: match > suppressed > none (candidates maps to unclassified
                 * for grid display but still captures enrichment for aux event-detail). */
                var PREC = {
                  client_session: 2,
                  not_client_session: 1,
                  unclassified: 0,
                };
                /* _bestMatch carries enrichment data for the winning classification.
                 * For candidates outcome: class = unclassified but _match.candidates preserved
                 * so aux event-detail can still offer candidate-resolution actions. */
                var _bestMatch = null;

                function resolveNext(idx, best) {
                  if (best === 'client_session') {
                    /* Highest precedence — short-circuit. */
                    return Promise.resolve({ ev: ev, cls: 'client_session' });
                  }
                  if (idx >= participants.length) {
                    return Promise.resolve({ ev: ev, cls: best });
                  }
                  var p = participants[idx];
                  var query = {};
                  if (p.email) query.email = p.email;
                  if (p.name) query.name = p.name;
                  return recordQuery
                    .call('resolveParticipant', query)
                    .then(function (result) {
                      var outcome = (result && result.outcome) || 'none';
                      var cls;
                      if (outcome === 'match') cls = 'client_session';
                      else if (outcome === 'suppressed') cls = 'not_client_session';
                      else cls = 'unclassified'; // candidates + none both map to unclassified grid class
                      /* Capture match enrichment. A non-match outcome (suppressed/none) may
                       * raise the grid class via PREC, but must NOT clear an already-captured
                       * candidates enrichment — so we only ever SET _bestMatch on match here,
                       * never null it. (_bestMatch starts null; match overrides candidates via
                       * the candidates guard below.) */
                      if (PREC[cls] > PREC[best] && outcome === 'match' && result.clientId) {
                        _bestMatch = { matchClientId: result.clientId, source: 'resolver' };
                      }
                      /* Candidates: always capture enrichment regardless of precedence so
                       * aux event-detail can offer disambiguation — but only if no better
                       * match (client_session) has already been captured. */
                      if (outcome === 'candidates' && result.candidates && best !== 'client_session' && (!_bestMatch || !_bestMatch.matchClientId)) {
                        _bestMatch = { candidates: result.candidates, source: 'resolver' };
                      }
                      var next = PREC[cls] > PREC[best] ? cls : best;
                      return resolveNext(idx + 1, next);
                    })
                    .catch(function () {
                      /* Resolver error → treat as unclassified for this participant. */
                      return resolveNext(idx + 1, best);
                    });
                }

                return resolveNext(0, 'unclassified').then(function (r) {
                  /* Attach enrichment to event (null-safe: only set when present). */
                  if (_bestMatch !== null) {
                    r.ev._match = _bestMatch;
                  }
                  return r;
                });
              });

              /* Wait for all events to classify, then repaint + publish counts. */
              Promise.all(classifyPromises)
                .then(function (results) {
                  if (classifySeq !== _loadSeq) return; // stale guard
                  results.forEach(function (r) {
                    r.ev.classification = r.cls;
                  });
                  renderCalArea();
                  publishCounts(); // final publish — classifications fully resolved
                })
                .catch(function () {
                  /* If bulk Promise.all fails somehow, leave unclassified — already painted. */
                });
            });
        }

        /* ── Tear down active events observer ───────────────────────── */
        function destroyEventsObserver() {
          if (_eventsObserver) {
            _eventsObserver.destroy();
            _eventsObserver = null;
          }
          _eventsDataUpdatedAt = 0;
          _currentWindowKey = '';
        }

        /* ── Compute month-grid window enclosing the current anchor ──── */
        /* Returns { from, to, key } where:
         *   from = startOfWeek(startOfMonth(anchor))   — Mon of the week that starts the grid
         *   to   = startOfWeek(endOfMonth(anchor)) + 7 days  — Mon after the last grid week + 7
         * This 6-week-ish window covers every Day/Week/Agenda range in the same month
         * (including cross-month week edges). View-switches at offset 0 share the same
         * window → same queryKey → single fetch, no re-fetch on view-switch.            */
        function fetchWindow() {
          var base = new Date();
          /* anchor: for week/agenda/day views use the week/day anchor; for month use month. */
          var anchor;
          if (view === 'month') {
            anchor = new Date(base);
            anchor.setMonth(anchor.getMonth() + offset);
          } else if (view === 'day') {
            anchor = new Date(base);
            anchor.setDate(anchor.getDate() + offset);
          } else {
            /* week / agenda */
            anchor = new Date(base);
            anchor.setDate(anchor.getDate() + offset * 7);
          }
          /* Month-grid window: Mon of first-grid-week → Mon after last-grid-week + 7 */
          var winFrom = startOfWeek(startOfMonth(anchor));
          var winTo = addDays(startOfWeek(endOfMonth(anchor)), 7);
          var fromISO = winFrom.toISOString();
          var toISO = winTo.toISOString();
          return {
            from: winFrom,
            to: winTo,
            fromISO: fromISO,
            toISO: toISO,
            key: fromISO + '|' + toISO,
          };
        }

        /* ── Refresh _calVisibility + _addedCalIds from listAddedCalendars ─ */
        /* Returns a Promise<{ visibilityChanged, addedSetChanged }>.           *
         * visibilityChanged = at least one calendar's selected flag differed.  *
         * addedSetChanged   = set of calendarIds itself changed (add/remove).  */
        function refreshCalVisibility() {
          if (!queryCap)
            return Promise.resolve({ visibilityChanged: false, addedSetChanged: false });
          return queryCap
            .call('listAddedCalendars')
            .then(function (cals) {
              cals = cals || [];
              var newVisibility = {};
              var newIds = cals
                .map(function (c) {
                  return c.id;
                })
                .sort()
                .join(',');
              cals.forEach(function (c) {
                newVisibility[c.id] = !!c.selected;
              });
              var addedSetChanged = newIds !== _addedCalIds;
              /* Visibility changed if any key/value differs. */
              var visibilityChanged = addedSetChanged; // set change implies visibility change
              if (!visibilityChanged) {
                var oldKeys = Object.keys(_calVisibility).sort();
                var newKeys = Object.keys(newVisibility).sort();
                if (oldKeys.length !== newKeys.length) {
                  visibilityChanged = true;
                } else {
                  for (var i = 0; i < oldKeys.length; i++) {
                    if (_calVisibility[oldKeys[i]] !== newVisibility[oldKeys[i]]) {
                      visibilityChanged = true;
                      break;
                    }
                  }
                }
              }
              _calVisibility = newVisibility;
              _addedCalIds = newIds;
              return { visibilityChanged: visibilityChanged, addedSetChanged: addedSetChanged };
            })
            .catch(function () {
              return { visibilityChanged: false, addedSetChanged: false };
            });
        }

        /* ── Load events + SD-11 classify pass ───────────────────────── */
        /* Window-cache strategy:
         *   - Computes a 6-week month-grid window from the current anchor.
         *   - If window key matches _currentWindowKey → view-switch within same window:
         *     just re-render + re-publish counts (NO fetch, NO spinner, NO classify).
         *   - Else → new window: destroy old observer, show spinner, create new observer
         *     for listWindowEvents (ALL added calendars), classify once on arrival.
         *
         * Calendar visibility: _calVisibility holds per-cal bool. eventsForDay() and
         * publishCounts() both respect it. Toggling a calendar = client-side update only
         * (handled in applyScheduleViewState revChanged branch).
         *
         * Scroll-jump-safe: renderCalArea() (rAF scroll-to-7AM) only called when data
         * actually changed (dataUpdatedAt gate) or on explicit view/visibility change.
         * setSelection() class-toggle never calls renderCalArea() — no scroll jump. */
        function loadEvents() {
          if (!queryCap || !connected) return;
          loadError = null;

          var range = rangeForView();
          var win = fetchWindow();

          /* Always update the range label (cheap, no fetch). */
          elRangeLabel.textContent = range.label;

          /* Same window: view-switch within current month — skip fetch entirely. */
          if (win.key === _currentWindowKey && _eventsObserver !== null) {
            renderCalArea();
            publishCounts();
            return;
          }

          /* New window: tear down old observer and start fresh. */
          destroyEventsObserver();
          _currentWindowKey = win.key;

          showLoading();

          /* Create observer keyed by window bounds (not view/offset bounds).
           * staleTime=5min: cached result serves all view-switches within this window
           * without re-fetch. Events refetch only when the window changes (month nav). */
          var obs = window.__viewQuery.observeQuery({
            queryKey: ['schedule.calendar', 'windowEvents', win.fromISO, win.toISO],
            queryFn: function () {
              return queryCap.call('listWindowEvents', win.fromISO, win.toISO);
            },
            staleTime: 5 * 60 * 1000,
          });
          _eventsObserver = obs;

          obs.subscribe(function (result) {
            if (result.status === 'error') {
              var err = result.error;
              var msg = err && err.message ? err.message : String(err);
              if (
                msg.indexOf('calendar.not_connected') !== -1 ||
                msg.indexOf('not connected') !== -1
              ) {
                connected = false;
              } else {
                loadError = msg;
              }
              renderCalArea();
              return;
            }

            if (result.status === 'success') {
              /* Gate on dataUpdatedAt: only repaint when data actually changed.
               * Prevents renderCalArea() (which includes rAF scroll-to-7AM) from
               * firing on status-only observer ticks — preserves scroll position. */
              if (result.dataUpdatedAt <= _eventsDataUpdatedAt) return;
              _eventsDataUpdatedAt = result.dataUpdatedAt;

              /* Increment classify-sequence token (stale guard for classify pass). */
              var classifySeq = ++_loadSeq;

              var evs = result.data || [];

              /* Step 1: default all to unclassified; paint immediately. */
              evs.forEach(function (ev) {
                ev.classification = 'unclassified';
              });
              events = evs;
              renderCalArea();
              publishCounts(); // initial publish — all 'unclassified'

              /* Step 2–4: async classify pass on whole window (mutates ev.classification).
               * Classification cached on event objects; reused across view-switches in window. */
              runClassifyPass(evs, win, classifySeq);
            }
          });
        }

        /* ── Refresh settings + poller ──────────────────────────────────── */
        function applyRefreshSettings(s) {
          if (!s || typeof s.mode !== 'string' || typeof s.intervalMin !== 'number') return;
          _refreshMode = s.mode === 'auto' || s.mode === 'manual' ? s.mode : 'manual';
          _refreshIntervalMin = s.intervalMin >= 1 ? Math.floor(s.intervalMin) : 15;
          // Clear any running timer.
          if (_refreshTimer !== null) {
            clearInterval(_refreshTimer);
            _refreshTimer = null;
          }
          // Start auto-poller only when view is active. A settings push that arrives
          // while the tab is deactivated only updates mode/interval; the next
          // onActivate starts the timer.
          if (_refreshMode === 'auto' && _viewActive) {
            _refreshTimer = setInterval(function () {
              triggerBackgroundSync();
            }, _refreshIntervalMin * 60000);
          }
        }

        /* ── Event popover ───────────────────────────────────────────────── */
        /* Clipboard fallback via hidden textarea + execCommand (must run in click handler) */
        function fallbackCopy(text, onSuccess) {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok && onSuccess) onSuccess();
          } catch (err) {
            /* silently ignore */
          }
        }

        function openPopover(ev, anchorEl) {
          var rect = anchorEl.getBoundingClientRect();
          setSelection(ev.id); // highlight in place — no grid rebuild, no scroll jump

          elPopStrip.className = 'popover-kind-strip ' + classClass(ev);
          elPopClsBadge.textContent = classLabel(ev);
          elPopClsBadge.className = 'event-kind-badge ' + classClass(ev);

          elPopClose.innerHTML = icon('x', 14);

          elPopBody.innerHTML = '';

          var timeIco = el('span', 'popover-row-icon');

            timeTxt.textContent = 'All day';

            if (ev.start && ev.end && ev.start.length > 10 && ev.end.length > 10) {
              var startMs = new Date(ev.start).getTime();
              var endMs = new Date(ev.end).getTime();

          timeRow.appendChild(timeIco);
          timeRow.appendChild(timeTxt);
          elPopBody.appendChild(timeRow);

          // Calendar row

            var calIco = el('span', 'popover-row-icon');

            locRow.appendChild(locTxt);

          // Meeting link row — Join (openExternal) + selectable URL + copy.
          if (ev.meetingLink) {
            var joinRow = el('div', 'popover-row');
            var joinIco = el('span', 'popover-row-icon');
            joinIco.innerHTML = icon('globe', 13);
            var joinTxt = el('div', 'popover-row-text');
            joinTxt.appendChild(txt('div', 'popover-join-label', 'Meeting link'));

            joinUrlRow.style.alignItems = 'center';
            joinUrlRow.style.gap = '6px';
            joinUrlRow.style.flexWrap = 'wrap';

            var joinUrl = txt('span', 'popover-join-url', ev.meetingLink);
            joinUrlRow.appendChild(joinUrl);

            /* Join button — launches via shell.openExternal (sandboxed iframe can't navigate) */
            if (_soamView) {
              var joinBtn = el('div', 'popover-link-btn');
              joinBtn.type = 'div';

                e.stopPropagation();

            /* Copy button */

            copyBtn.addEventListener('click', function (e) {

            joinRow.appendChild(joinIco);
            joinRow.appendChild(joinTxt);
            elPopBody.appendChild(joinRow);

          // Participants section
          var hasAttendees = ev.attendees && ev.attendees.length > 0;
          var hasOrganizerOnly =
            !hasAttendees && ev.organizer && (ev.organizer.email || ev.organizer.displayName);
          if (hasAttendees || hasOrganizerOnly) {
            elPopBody.appendChild(el('div', 'popover-divider'));

            var secLabel = el('div', 'popover-section-label');
            secLabel.innerHTML = icon('person', 11) + ' Participants';
            elPopBody.appendChild(secLabel);

            var participantsList = el('div', 'popover-participants');
            var orgEmail =
              ev.organizer && ev.organizer.email ? ev.organizer.email.toLowerCase() : null;
            function isOrganiser(a) {
              return (
                a.organizer === true || (orgEmail && (a.email || '').toLowerCase() === orgEmail)
              );
            }

            if (hasAttendees) {
              var maxShown = 8;
              ev.attendees.slice(0, maxShown).forEach(function (a) {
                var nameStr = a.name || a.displayName || a.email || '?';
                var initials = nameStr
                  .split(/\s+/)
                  .slice(0, 2)
                  .map(function (w) {
                    return w.charAt(0);
                  })
                  .join('');
                var pRow = el('div', 'popover-participant');
                pRow.appendChild(txt('div', 'popover-avatar', initials || '?'));
                pRow.appendChild(
                  txt(
                    'div',
                    'popover-participant-name',
                    a.name || a.displayName || a.email || 'Unknown',
                  ),
                );
                if (a.self) pRow.appendChild(txt('span', 'popover-participant-role', 'you'));
                if (isOrganiser(a))
                  pRow.appendChild(txt('span', 'popover-participant-role', 'organiser'));
                participantsList.appendChild(pRow);
              });
              if (ev.attendees.length > maxShown) {
                var moreEl = txt(
                  'div',
                  'popover-row-text',
                  '+' + (ev.attendees.length - maxShown) + ' more',
                );
                moreEl.style.fontSize = '11px';
                moreEl.style.paddingLeft = '30px';
                moreEl.style.color = 'var(--color-fg-muted)';
                participantsList.appendChild(moreEl);
              }
            } else {
              var org = ev.organizer;
              var orgName = org.displayName || org.email || '?';
              var orgInitials = orgName
                .split(/\s+/)
                .slice(0, 2)
                .map(function (w) {
                  return w.charAt(0);
                })
                .join('');
              var orgRow = el('div', 'popover-participant');
              orgRow.appendChild(txt('div', 'popover-avatar', orgInitials || '?'));
              orgRow.appendChild(txt('div', 'popover-participant-name', orgName));
              orgRow.appendChild(txt('span', 'popover-participant-role', 'organiser'));
              participantsList.appendChild(orgRow);
            }
            elPopBody.appendChild(participantsList);
          }

          // Footer — Open in side panel (escape to the aux event-detail view)
          if (_soamView) {
            var footer = el('div', 'popover-footer');
            var sideBtn = el('button', 'popover-side-btn');
            sideBtn.type = 'button';
            sideBtn.innerHTML = icon('open-in-window', 12) + 'Open in side panel';
            sideBtn.addEventListener('click', function () {
              if (_soamView) _soamView.setActiveEvent(ev);
              closePopover();
            });
            footer.appendChild(sideBtn);
            elPopBody.appendChild(footer);
          }

          // Position near anchor, clamped within iframe viewport. Backdrop first.
          elBackdrop.classList.remove('hidden');
          var pop = elPopover;
          pop.classList.remove('hidden');
          pop.style.top = '';
          pop.style.left = '';
          pop.style.right = '';

          var popW = pop.offsetWidth || 380;
          var popH = pop.offsetHeight || 320;
          var vw = window.innerWidth,
            vh = window.innerHeight,
            margin = 8;

          var left = rect.right + margin;
          if (left + popW > vw - margin) left = rect.left - popW - margin;
          left = Math.max(margin, Math.min(left, vw - popW - margin));

          var top = rect.top;
          if (top + popH > vh - margin) top = rect.bottom - popH;
          top = Math.max(margin, Math.min(top, vh - popH - margin));

          pop.style.left = left + 'px';
          pop.style.top = top + 'px';
          pop.focus({ preventScroll: true });
        }

        function closePopover() {
          if (elPopover.classList.contains('hidden')) return;
          elPopover.classList.add('hidden');
          elBackdrop.classList.add('hidden');
          _popoverEv = null;
          setSelection(null); // clear highlight in place — no rebuild/scroll jump
        }

        // Popover listeners (registered once over the static markup).
        elPopClose.addEventListener('click', closePopover);
        elPopover.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closePopover();
        });
        elBackdrop.addEventListener('click', closePopover);
        elPopover.addEventListener('click', function (e) {
          e.stopPropagation();
        });
        // Sandboxed iframe swallows parent mousedown — a click outside the iframe blurs
        // the window; dismiss the popover then (Dev Gotcha: popovers must close on blur).
        window.addEventListener('blur', function () {
          if (!elPopover.classList.contains('hidden')) closePopover();
        });

        /* ── Background sync (slice 6) ──────────────────────────────────── */
        /* Fire syncEvents non-blocking after first paint from cache.
         * If sync produces changes (upserts or deletions > 0), invalidate the
         * window-events cache so the view refetches and repaints from the updated DB.
         * Safe to call multiple times — each call is independent; stale calls ignored. */
        function triggerBackgroundSync() {
          if (!cmdCap) return Promise.resolve();
          return cmdCap
            .call('syncEvents', [])
            .then(function (result) {
              if (!result) return;
              var changed = result.upserts > 0 || result.deletions > 0;
              if (changed && window.__viewQuery) {
                window.__viewQuery.invalidate(['schedule.calendar', 'windowEvents']);
              }
              // Part C3: if any accounts were disconnected due to auth failure,
              // bump calRev so nav.html refreshes the account list.
              if (result.disconnectedAccounts && result.disconnectedAccounts.length > 0) {
                if (_soamView && _soamView.bumpScheduleData) _soamView.bumpScheduleData();
              }
            })
            .catch(function () {
              /* Sync failure is non-fatal — cached events remain visible. */
            });
        }

        /* ── Date nav ─────────────────────────────────────────────────── */
        function updateRangeLabel() {
          var range = rangeForView();
          elRangeLabel.textContent = range.label;
        }

        elBtnPrev.addEventListener('click', function () {
          offset--;
          if (connected) loadEvents();
          else updateRangeLabel();
        });
        elBtnNext.addEventListener('click', function () {
          offset++;
          if (connected) loadEvents();
          else updateRangeLabel();
        });
        elBtnToday.addEventListener('click', function () {
          offset = 0;
          if (connected) loadEvents();
          else updateRangeLabel();
        });

        // Refresh button — codicon glyph + spin while a manual sync is in flight.
        elBtnRefresh.innerHTML = icon('refresh', 15);
        elBtnRefresh.addEventListener('click', function () {
          if (elBtnRefresh.classList.contains('spinning')) return;
          elBtnRefresh.classList.add('spinning');
          var started = Date.now();
          Promise.resolve(triggerBackgroundSync()).then(function () {
            // Keep the spin visible for at least one rotation so it doesn't flicker.
            var elapsed = Date.now() - started;
            setTimeout(
              function () {
                elBtnRefresh.classList.remove('spinning');
              },
              Math.max(0, 700 - elapsed),
            );
          });
        });

        /* ── View switcher ───────────────────────────────────────────── */
        /* Clicks round-trip through ScheduleViewStateService (P-B channel).         *
         * Do NOT mutate `view` here — the inbound scheduleViewState push drives      *
         * the actual view change to avoid double-render (O455 mirror pattern).       *
         * Preserve _lastCalRev when writing; never reset it (would trigger spurious  *
         * refetch / fight with nav.html's authoritative calRev counter).             */
        Array.prototype.forEach.call(elViewSwitch.querySelectorAll('.view-tab'), function (tab) {
          tab.addEventListener('click', function () {
            var v = tab.dataset.view;
            if (view === v) return;
            if (window.soamView && window.soamView.setScheduleViewState) {
              window.soamView.setScheduleViewState({
                view: v,
                calRev: _lastCalRev,
                classFilter: _lastClassFilter,
              });
            } else {
              /* Fallback if bridge verb unavailable: apply locally (graceful degradation). */
              view = v;
              offset = 0;
              selectedId = null;
              if (connected) loadEvents();
              else renderCalArea();
            }
          });
        });

        /* ── Apply inbound scheduleViewState ────────────────────────── */
        /* Called on init, context, and dedicated scheduleViewState pushes.          *
         * Drives the active view; triggers listAggregatedEvents refetch on calRev   *
         * change (nav.html bumps calRev on any account/calendar mutation).           *
         * A view change resets offset+selection to avoid stale grid state.           */
        function applyScheduleViewState(state) {
          if (!state || typeof state.view !== 'string') return;
          var newView = state.view;
          var newRev = typeof state.calRev === 'number' ? state.calRev : 0;
          /* classFilter: new shape = string | null (focusedClass). Back-compat: old
           * Record<string,boolean> shape (from stale localStorage) → treat as null. */
          var newFilter =
            typeof state.classFilter === 'string' && state.classFilter.length > 0
              ? state.classFilter
              : null;
          var viewChanged = newView !== view;
          var revChanged = newRev !== _lastCalRev;
          var filterChanged = newFilter !== _classFilter;
          if (!viewChanged && !revChanged && !filterChanged) return; // no-op on equal state
          _lastCalRev = newRev;
          _classFilter = newFilter;
          _lastClassFilter = newFilter;
          if (viewChanged) {
            view = newView;
            offset = 0;
            selectedId = null;
            /* view change: loadEvents handles same-window fast-path or new window fetch. */
            if (connected) loadEvents();
            else renderCalArea();
          } else if (revChanged) {
            /* calRev changed — determine if calendar SET changed (add/remove account or
             * calendar) vs only visibility (selected toggle).
             *   - Set changed  → window cache is stale (missing added cal's events) →
             *     invalidate window key, reload.
             *   - Visibility only → update _calVisibility client-side, re-render — NO fetch. */
            if (connected) {
              refreshCalVisibility().then(function (diff) {
                if (diff.addedSetChanged) {
                  /* Added/removed a calendar — the window cache no longer covers the new
                   * calendar set. INVALIDATE (not destroy+reload): the live observer
                   * refetches the same window key with the updated calendar.list. A plain
                   * destroy+loadEvents would re-subscribe to the still-fresh cached query
                   * and miss the new calendar's events until staleTime expired.
                   * Slice 6: also trigger a background sync so the newly-added calendar's
                   * events are populated into the event cache; invalidate again on completion. */
                  window.__viewQuery.invalidate(['schedule.calendar', 'windowEvents']);
                  triggerBackgroundSync();
                } else if (diff.visibilityChanged) {
                  /* Selected flags changed only — instant client-side re-render, then
                   * re-run classify pass so PHI-read toggle / roster changes take effect. */
                  renderCalArea();
                  publishCounts();
                  runClassifyPass(events, fetchWindow(), ++_loadSeq);
                } else {
                  /* calRev bump with calendar SET and visibility-flags unchanged.
                   * Two causes converge here:
                   *   (a) a classification input changed (PHI-read toggle, roster
                   *       mutation, triage) — needs a re-classify; AND
                   *   (b) a calendar METADATA edit (color / name) — that metadata is
                   *       baked onto the cached event objects at fetch time (JOIN in
                   *       listWindowEvents), so reclassifying the in-memory events would
                   *       repaint the STALE color. It must be re-fetched.
                   * Invalidate the window cache so events refetch with fresh calendar
                   * metadata; the observer's onData handler then re-runs the classify
                   * pass. The refetch reads the local event cache (no Google call) — cheap,
                   * and covers (a) too (onData re-classifies). */
                  window.__viewQuery.invalidate(['schedule.calendar', 'windowEvents']);
                }
              });
            } else {
              /* Not yet connected — a calRev bump may mean a calendar was just added
               * (e.g. via the Add-calendar wizard). Re-check: if calendars now exist,
               * transition to connected and load. */
              refreshCalVisibility().then(function () {
                if (_addedCalIds.length > 0) {
                  connected = true;
                  loadEvents();
                  triggerBackgroundSync();
                } else {
                  renderCalArea();
                }
              });
            }
          } else {
            /* classFilter changed only — re-render in place, no network fetch. */
            renderCalArea();
          }
        }

        /* ── Bootstrap ───────────────────────────────────────────────── */
        var boot = window.__viewBoot;

        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.__soamView !== true) return;
          boot.applyTheme(d);
          /* Consume scheduleViewState from init + context messages. */
          if ((d.kind === 'init' || d.kind === 'context') && d.scheduleViewState) {
            applyScheduleViewState(d.scheduleViewState);
          }
          /* Dedicated push from onDidChange. */
          if (d.kind === 'scheduleViewState' && d.state) {
            applyScheduleViewState(d.state);
          }
          /* Refresh settings: init/context + dedicated push. */
          if ((d.kind === 'init' || d.kind === 'context') && d.scheduleRefreshSettings) {
            applyRefreshSettings(d.scheduleRefreshSettings);
          }
          if (d.kind === 'scheduleRefreshSettings' && d.settings) {
            applyRefreshSettings(d.settings);
          }
          /* Aux sidebar visibility: init/context + dedicated push. */
          if ((d.kind === 'init' || d.kind === 'context') && typeof d.auxVisible === 'boolean') {
            _auxVisible = d.auxVisible;
          }
          if (d.kind === 'auxVisible' && typeof d.visible === 'boolean') {
            _auxVisible = d.visible;
            /* When aux closes while a popover is open, re-open the popover for the selected event.
             * When aux opens, close any open popover (aux takes over the detail role). */
            if (_auxVisible && _popoverEv) closePopover();
          }
        });

        boot
          .awaitBridge()
          .then(function (soamView) {
            _soamView = soamView;
            window.soamView = soamView;

            elBridgeWait.classList.add('hidden');
            elRoot.style.display = '';

            boot.applyCodicons();

            // Render initial state (disconnected).
            updateRangeLabel();
            renderCalArea();

            // Bind CQRS-split caps:
            //   schedule.calendar.query@1.0  (kind:query)   → listAddedCalendars, listWindowEvents, …
            //   schedule.calendar@1.0        (kind:command)  → syncEvents
            // Optional cross-bundle classify caps (SD-11) — bind failures are swallowed;
            // view-bridge bindQuery is NOT gated by manifest dep list so no cycle risk.
            //   sessions.meeting.query@1.0   (kind:query)   → listLinkedProvider
            //   record.patient.query@1.0     (kind:query)   → resolveParticipant
            Promise.all([
              soamView.bindQuery('schedule.calendar.query', '1.0'),
              soamView.bindCommand('schedule.calendar', '1.0'),
              soamView.bindQuery('sessions.meeting.query', '1.0').catch(function () {
                return null;
              }),
              soamView.bindQuery('record.patient.query', '1.0').catch(function () {
                return null;
              }),
            ])
              .then(function (caps) {
                queryCap = caps[0];
                cmdCap = caps[1];
                sessionsQuery = caps[2]; // null if not available
                recordQuery = caps[3]; // null if not available

                /* Seed _calVisibility before first loadEvents so eventsForDay/publishCounts
                 * have correct visibility state on the initial render pass. */
                refreshCalVisibility();

                /* Read persisted refresh settings from cap (source of truth on cold load;
                 * BundleViewIframe also pushes them via init/context but cap-read is the
                 * canonical first-load value before any push arrives). */
                queryCap
                  .call('getRefreshSettings', [])
                  .then(function (s) {
                    if (s) applyRefreshSettings(s);
                  })
                  .catch(function () {
                    /* non-fatal; defaults remain */
                  });

                soamView.events.onActivate(function () {
                  _viewActive = true;
                  /* Start auto-poller on activate (only if mode=auto; clears previous timer). */
                  if (_refreshTimer !== null) {
                    clearInterval(_refreshTimer);
                    _refreshTimer = null;
                  }
                  if (_refreshMode === 'auto') {
                    _refreshTimer = setInterval(function () {
                      triggerBackgroundSync();
                    }, _refreshIntervalMin * 60000);
                  }

                  refreshCalVisibility()
                    .then(function () {
                      connected = _addedCalIds.length > 0;
                      if (connected) {
                        loadEvents();
                        triggerBackgroundSync();
                      } else {
                        renderCalArea();
                      }
                    })
                    .catch(function () {
                      connected = false;
                      renderCalArea();
                    });
                });

                soamView.events.onDeactivate(function () {
                  _viewActive = false;
                  /* Stop poller when view is deactivated (tab switch, lock). */
                  if (_refreshTimer !== null) {
                    clearInterval(_refreshTimer);
                    _refreshTimer = null;
                  }
                });
              })
              .catch(function (err) {
                loadError = 'Capability error: ' + ((err && err.message) || String(err));
                renderCalArea();
              });
          })
          .catch(function (err) {
            elBridgeWait.textContent =
              'Bridge error: ' + (err && err.message ? err.message : String(err));
          });
      })();
    </script>
  </body>
</html>
