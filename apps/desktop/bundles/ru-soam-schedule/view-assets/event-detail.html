<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Event</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }

      /* ── Design tokens (defaults — injected via postMessage from host) ─ */
      :root {
        color-scheme: light dark;

        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;

        /* Surface */
        --color-surface-base: #161618;
        --color-surface-panel: #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active: #2a2d26;
        /* Foreground */
        --color-fg-primary: #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted: #636366;
        /* Borders */
        --color-border: #3a3a3c;
        --color-border-focus: #5ac85a;
        /* Accent */
        --color-accent: #5ac85a;
        --color-accent-fg: #1c1c1e;
        /* Semantic */
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error: #e05252;
        --color-info: #5ac0de;

        --radius-sm: 4px;
        --radius-md: 7px;
        --radius-card: 10px;

        --transition: 130ms ease;

        /* Classification colors */
        --cls-client-color: #5ac85a;
        --cls-probable-color: #f4a623;
        --cls-not-color: #636366;
        --cls-personal-color: #5ac0de;
        --cls-unclassified-color: #636366;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Bridge wait ────────────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 12px;
        color: var(--color-fg-muted);
      }
      #bridge-wait.hidden {
        display: none;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Root ──────────────────────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Empty / no-event state ─────────────────────────────────── */
      #empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        color: var(--color-fg-muted);
        font-size: 13px;
        padding: 24px;
        text-align: center;
      }
      #empty-state.hidden {
        display: none;
      }

      /* ── Detail scroll container ─────────────────────────────────── */
      #detail-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }
      #detail-scroll.hidden {
        display: none;
      }

      /* ── HEADER ──────────────────────────────────────────────────── */
      .det-header {
        padding: 18px 16px 14px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .det-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--color-fg-primary);
        word-break: break-word;
      }
      .det-meta {
        font-size: 12px;
        color: var(--color-fg-muted);
        line-height: 1.4;
      }

      /* ── STATUS BAR (replaces det-cls-banner) ───────────────────── */
      .det-status-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 30%, transparent);
      }
      .det-cls-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .det-cls-human {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }
      .det-cls-badge {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        border-radius: 3px;
        padding: 2px 6px;
        flex-shrink: 0;
        border: 1px solid transparent;
      }

      /* Classification color variants */
      .cls-client {
        --cls-color: var(--cls-client-color);
      }
      .cls-probable {
        --cls-color: var(--cls-probable-color);
      }
      .cls-not {
        --cls-color: var(--cls-not-color);
      }
      .cls-personal {
        --cls-color: var(--cls-personal-color);
      }
      .cls-unclassified {
        --cls-color: var(--cls-unclassified-color);
      }

      .det-status-bar.cls-client {
        background: color-mix(in srgb, var(--cls-client-color) 10%, transparent);
      }
      .det-status-bar.cls-probable {
        background: color-mix(in srgb, var(--cls-probable-color) 10%, transparent);
      }
      .det-status-bar.cls-not {
        background: color-mix(in srgb, var(--cls-not-color) 8%, transparent);
      }
      .det-status-bar.cls-personal {
        background: color-mix(in srgb, var(--cls-personal-color) 8%, transparent);
      }
      .det-status-bar.cls-unclassified {
        background: transparent;
      }

      .det-cls-dot.cls-client {
        background: var(--cls-client-color);
      }
      .det-cls-dot.cls-probable {
        background: var(--cls-probable-color);
      }
      .det-cls-dot.cls-not {
        background: var(--cls-not-color);
      }
      .det-cls-dot.cls-personal {
        background: var(--cls-personal-color);
      }
      .det-cls-dot.cls-unclassified {
        background: var(--cls-unclassified-color);
      }

      .det-cls-badge.cls-client {
        color: var(--cls-client-color);
        border-color: color-mix(in srgb, var(--cls-client-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-client-color) 10%, transparent);
      }
      .det-cls-badge.cls-probable {
        color: var(--cls-probable-color);
        border-color: color-mix(in srgb, var(--cls-probable-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-probable-color) 10%, transparent);
        border-style: dashed;
      }
      .det-cls-badge.cls-not {
        color: var(--cls-not-color);
        border-color: color-mix(in srgb, var(--cls-not-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-not-color) 10%, transparent);
      }
      .det-cls-badge.cls-personal {
        color: var(--cls-personal-color);
        border-color: color-mix(in srgb, var(--cls-personal-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-personal-color) 10%, transparent);
      }
      .det-cls-badge.cls-unclassified {
        color: var(--cls-unclassified-color);
        border-color: color-mix(in srgb, var(--cls-unclassified-color) 30%, transparent);
        background: transparent;
      }

      /* ── SECTION layout ──────────────────────────────────────────── */
      .det-section {
        display: flex;
        flex-direction: column;
        padding: 16px 16px 4px;
        gap: 10px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 35%, transparent);
      }
      .det-section:last-child {
        border-bottom: none;
      }

      .det-section-hdr {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--color-fg-muted);
        padding-bottom: 2px;
      }
      .det-section-hdr-icon {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
        color: var(--color-fg-muted);
      }

      /* ── KV rows (label → value) ─────────────────────────────────── */
      .det-kv {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 8px;
      }
      .det-kv-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        font-size: 13px;
        min-height: 20px;
      }
      .det-kv-label {
        width: 72px;
        flex-shrink: 0;
        color: var(--color-fg-muted);
        font-size: 12px;
        text-align: right;
      }
      .det-kv-value {
        flex: 1;
        min-width: 0;
        color: var(--color-fg-primary);
        font-weight: 500;
        line-height: 1.4;
        word-break: break-word;
      }

      /* Calendar dot inline in KV value */
      .det-cal-dot-inline {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
        flex-shrink: 0;
      }

      /* Raw-title italic style */
      .det-raw-title-value {
        font-style: italic;
        font-weight: 400;
        color: var(--color-fg-secondary);
      }

      /* ── Honesty note ────────────────────────────────────────────── */
      .det-honesty {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 11px;
        color: var(--color-fg-muted);
        line-height: 1.5;
        padding-bottom: 8px;
      }
      .det-honesty-icon {
        flex-shrink: 0;
        margin-top: 1px;
        color: var(--color-fg-muted);
        opacity: 0.7;
      }

      /* ── Join button (full-width) ────────────────────────────────── */
      .det-join-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 9px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background var(--transition),
          border-color var(--transition);
        user-select: none;
        white-space: nowrap;
        margin-bottom: 4px;
      }
      .det-join-btn:hover {
        background: color-mix(in srgb, var(--color-accent) 85%, white);
        border-color: color-mix(in srgb, var(--color-accent) 85%, white);
      }
      .det-join-btn:focus-visible {
        outline: 2px solid var(--color-border-focus);
        outline-offset: 1px;
      }

      /* ── Meeting link URL + copy ─────────────────────────────────── */
      .det-join-url-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .det-join-url {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        color: var(--color-accent);
        user-select: text;
        cursor: text;
        word-break: break-all;
        flex: 1;
        min-width: 0;
      }
      .det-copy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: var(--radius-sm);
        color: var(--color-fg-muted);
        flex-shrink: 0;
        transition:
          background var(--transition),
          color var(--transition);
        cursor: pointer;
        border: none;
        background: none;
        font: inherit;
        vertical-align: middle;
      }
      .det-copy-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
      }
      .det-copy-btn:focus-visible {
        outline: 2px solid var(--color-border-focus);
        outline-offset: 1px;
      }
      .det-copy-btn.copied {
        color: var(--color-success);
      }
      .det-copy-confirm {
        font-size: 11px;
        color: var(--color-success);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .det-copy-confirm.show {
        opacity: 1;
      }

      /* ── Re-scan meeting link ────────────────────────────────────── */
      .det-rescan-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      .det-rescan-btn {
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        color: var(--color-fg-muted);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent);
        transition: color var(--transition);
        white-space: nowrap;
      }
      .det-rescan-btn:hover:not(:disabled) {
        color: var(--color-fg-secondary);
      }
      .det-rescan-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .det-rescan-status {
        font-size: 11px;
        color: var(--color-fg-muted);
        line-height: 1.4;
      }
      .det-rescan-status.err {
        color: var(--color-error);
      }
      .det-no-meet-msg {
        font-size: 12px;
        color: var(--color-fg-muted);
        margin-bottom: 6px;
      }

      /* ── Participants ─────────────────────────────────────────────── */
      .det-participants {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-bottom: 8px;
      }
      .det-participant-class {
        font-size: 11px;
        font-weight: 500;
        color: var(--color-fg-muted);
        margin-top: -8px; /* pull close to section header despite flex gap */
      }
      .det-participant {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .det-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--color-accent) 20%, var(--color-surface-base) 80%);
        border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
        color: var(--color-accent);
        font-size: 10px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        margin-top: 2px;
      }
      .det-participant-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
        flex: 1;
      }
      .det-participant-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1.4;
      }
      .det-participant-role-line {
        font-size: 11px;
        color: var(--color-fg-muted);
        line-height: 1.3;
      }
      .det-participants-more {
        font-size: 12px;
        color: var(--color-fg-muted);
        padding-left: 38px;
      }

      /* ── Client-link action block ────────────────────────────────── */
      .det-link-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-bottom: 8px;
      }
      .det-link-desc {
        font-size: 13px;
        color: var(--color-fg-secondary);
        line-height: 1.5;
      }
      .det-link-desc strong {
        color: var(--color-fg-primary);
        font-weight: 600;
      }
      .det-link-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      /* Primary action takes its own row; secondary actions share the next row
       * (two per row) — mirrors the prototype's stacked layout. */
      .det-link-actions > .det-act-btn.primary,
      .det-link-actions > .det-act-btn.primary-solid {
        flex: 1 0 100%;
      }
      .det-link-actions > .det-act-btn:not(.primary):not(.primary-solid) {
        flex: 1 1 calc(50% - 3px);
      }
      .det-link-inline-msg {
        font-size: 12px;
        color: var(--color-fg-muted);
        font-style: italic;
      }
      .det-link-inline-msg.err {
        color: var(--color-error);
        font-style: normal;
        font-weight: 500;
      }
      .det-link-inline-msg.ok {
        color: var(--color-success);
        font-style: normal;
        font-weight: 500;
      }

      /* Linked client card inside link block */
      .det-linked-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--color-surface-elevated) 70%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
      }
      .det-linked-card-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .det-linked-card-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .det-linked-card-sub {
        font-size: 11px;
        color: var(--color-success);
        font-weight: 500;
      }

      /* Action buttons */
      .det-act-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
        white-space: nowrap;
        justify-content: center;
      }
      .det-act-btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-fg-muted) 10%, transparent);
        color: var(--color-fg-primary);
      }
      .det-act-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .det-act-btn.primary {
        border-color: var(--color-accent);
        background: color-mix(in srgb, var(--color-accent) 15%, transparent);
        color: var(--color-accent);
        font-weight: 600;
      }
      .det-act-btn.primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-accent) 22%, transparent);
        border-color: var(--color-accent);
      }
      .det-act-btn.primary-solid {
        width: 100%;
        justify-content: center;
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-weight: 700;
        font-size: 13px;
        padding: 9px 14px;
        border-radius: var(--radius-md);
      }
      .det-act-btn.primary-solid:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-accent) 85%, white);
        border-color: color-mix(in srgb, var(--color-accent) 85%, white);
      }

      /* Inline picker inside link block */
      .det-picker-wrap {
        display: none;
        flex-direction: column;
        gap: 5px;
      }
      .det-picker-wrap.open {
        display: flex;
      }
      .det-picker-search {
        width: 100%;
        padding: 5px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 12px;
        outline: none;
        transition: border-color var(--transition);
      }
      .det-picker-search::placeholder {
        color: var(--color-fg-muted);
      }
      .det-picker-search:focus {
        border-color: var(--color-border-focus);
      }
      .det-picker-list {
        list-style: none;
        max-height: 140px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 30%, transparent) transparent;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-surface-base);
      }
      .det-picker-list:empty::after {
        content: 'No clients match';
        display: block;
        padding: 8px 10px;
        font-size: 12px;
        color: var(--color-fg-muted);
        font-style: italic;
      }
      .det-picker-item {
        padding: 6px 10px;
        font-size: 13px;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition:
          background var(--transition),
          color var(--transition);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
      }
      .det-picker-item:last-child {
        border-bottom: none;
      }
      .det-picker-item:hover {
        background: color-mix(in srgb, var(--color-accent) 8%, transparent);
        color: var(--color-fg-primary);
      }

      /* New-intake inline form */
      .det-intake-form {
        display: none;
        flex-direction: column;
        gap: 6px;
      }
      .det-intake-form.open {
        display: flex;
      }
      .det-intake-input {
        padding: 5px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 12px;
        outline: none;
        transition: border-color var(--transition);
      }
      .det-intake-input::placeholder {
        color: var(--color-fg-muted);
      }
      .det-intake-input:focus {
        border-color: var(--color-border-focus);
      }
    </style>
  </head>
  <body>
    <div id="bridge-wait"><span class="spinner"></span> Connecting…</div>
    <div id="root" style="display: none">
      <div id="empty-state">
        <div style="color: var(--color-fg-muted); opacity: 0.5" id="empty-icon"></div>
        <div>Select an event to see details</div>
      </div>
      <div id="detail-scroll" class="hidden"></div>
    </div>

    <script>
      (function () {
        'use strict';

        /* ── Icon helper ─────────────────────────────────────────────── */
        var ICON_MAP = {
          clock: 'clockface',
          calendar: 'calendar',
          location: 'location',
          globe: 'globe',
          person: 'account',
          copy: 'copy',
          check: 'check',
          layers: 'layers',
          link: 'link',
          warning: 'warning',
        };
        function icon(name, size) {
          var n = ICON_MAP[name] || name;
          return window.codicon ? window.codicon(n, size || 13) : '';
        }

        /* ── el / txt DOM helpers ────────────────────────────────────── */
        function el(tag, cls) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          return e;
        }
        function txt(tag, cls, text) {
          var e = el(tag, cls);
          e.textContent = text;
          return e;
        }

        /* ── Clipboard fallback ──────────────────────────────────────── */
        function fallbackCopy(text, onSuccess) {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok && onSuccess) onSuccess();
          } catch (err) {
            /* silently ignore */
          }
        }

        /* ── Date / time utilities ───────────────────────────────────── */
        var MONTH_NAMES = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ];
        var DAY_NAMES = [
          'Sunday',
          'Monday',
          'Tuesday',
          'Wednesday',
          'Thursday',
          'Friday',
          'Saturday',
        ];

        function fmtTime(isoStr) {
          if (!isoStr || isoStr.length <= 10) return 'All day';
          try {
            return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          } catch (e) {
            return isoStr;
          }
        }

        function fmtDateLong(isoStr) {
          if (!isoStr) return '';
          try {
            var d = new Date(isoStr.length <= 10 ? isoStr + 'T00:00:00' : isoStr);
            return (
              DAY_NAMES[d.getDay()] +
              ', ' +
              d.getDate() +
              ' ' +
              MONTH_NAMES[d.getMonth()] +
              ' ' +
              d.getFullYear()
            );
          } catch (e) {
            return isoStr;
          }
        }

        function fmtDuration(minutes) {
          if (minutes <= 0) return '';
          var h = Math.floor(minutes / 60);
          var m = minutes % 60;
          if (h > 0 && m > 0) return h + ' hr ' + m + ' min';
          if (h > 0) return h === 1 ? '1 hr' : h + ' hr';
          return m + ' min';
        }

        /* ── Classification maps ─────────────────────────────────────── */
        var CLS_CLASS = {
          client_session: 'cls-client',
          not_client_session: 'cls-not',
          personal: 'cls-personal',
          unclassified: 'cls-unclassified',
        };
        var CLS_LABEL = {
          client_session: 'CLIENT',
          not_client_session: 'EXCLUDED',
          personal: 'PERSONAL',
          unclassified: 'UNCLASSIFIED',
        };
        var CLS_HUMAN = {
          client_session: 'Client session',
          not_client_session: 'Not a client',
          personal: 'Personal · admin',
          unclassified: 'Unrecognised',
        };
        function clsClass(ev) {
          var c = (ev && ev.classification) || 'unclassified';
          return CLS_CLASS[c] || 'cls-unclassified';
        }
        function clsLabel(ev) {
          var c = (ev && ev.classification) || 'unclassified';
          return CLS_LABEL[c] || 'UNCLASSIFIED';
        }
        function clsHuman(ev) {
          var c = (ev && ev.classification) || 'unclassified';
          return CLS_HUMAN[c] || 'Unrecognised';
        }

        /* Count-based participant-class hint — PHI-free count only.
         * Excludes self (you) and declined attendees from the "others" count.
         * 0 others → ''; 1 other → 'N participants'; 2+ others → 'Group · N participants'. */
        function participantClassHint(ev) {
          if (!ev.attendees || ev.attendees.length === 0) return '';
          var active = ev.attendees.filter(function (a) {
            return a.responseStatus !== 'declined';
          });
          var others = active.filter(function (a) { return !a.self; });
          var otherCount = others.length;
          if (otherCount === 0) return '';
          var hasSelf = active.some(function (a) { return a.self; });
          var total = otherCount + (hasSelf ? 1 : 0);
          var noun = total === 1 ? 'participant' : 'participants';
          if (otherCount === 1) return total + ' ' + noun;
          return 'Group · ' + total + ' ' + noun;
        }

        /* ── State ───────────────────────────────────────────────────── */
        var _currentEv = null;
        var _renderToken = 0; // increments each applyActiveEvent; guards stale async lookups
        var _lastCalRev = -1; // tracks last-seen calRev for re-classify on change
        var _lastSvsView = 'week'; // scheduleViewState.view — needed to bump calRev
        var _lastSvsFilter = {}; // scheduleViewState.classFilter — needed to bump calRev

        /* ── Bump calRev via request.setScheduleViewState ─────────────── */
        /* Called after a classification-mutating action (link, suppress, create+link).
         * Uses the existing view-bridge verb — no new channel field. The renderer
         * increments calRev on the ScheduleViewStateService, which broadcasts to all
         * iframes (including schedule.html) to re-classify. */
        function bumpCalRev() {
          if (_lastCalRev < 0) return; // not yet initialised
          window.parent.postMessage(
            {
              __soamView: true,
              kind: 'request.setScheduleViewState',
              state: { view: _lastSvsView, calRev: _lastCalRev + 1, classFilter: _lastSvsFilter },
            },
            '*',
          );
        }

        /* ── Cap proxies (bound lazily after bridge resolves) ────────── */
        var _soamView = null;
        var _sessionsCmd = null;
        var _sessionsMeetingQuery = null;
        var _recordCmd = null;
        var _recordQuery = null;
        var _scheduleCmd = null;

        /* ── DOM refs ─────────────────────────────────────────────────── */
        var elBridgeWait = document.getElementById('bridge-wait');
        var elRoot = document.getElementById('root');
        var elEmpty = document.getElementById('empty-state');
        var elEmptyIcon = document.getElementById('empty-icon');
        var elScroll = document.getElementById('detail-scroll');

        /* ── Representative attendee helper ──────────────────────────── */
        function pickRepEmail(ev) {
          var atts = (ev && ev.attendees) || [];
          var best = null;
          for (var i = 0; i < atts.length; i++) {
            var a = atts[i];
            if (a.self) continue;
            if (!a.email) continue;
            if (a.organizer) {
              if (!best) best = a;
              continue;
            }
            return a; // first non-self, non-organiser with email
          }
          return best; // fallback: organiser-with-email
        }

        /* ── Build event obj for linkProviderEvent (O493 triple) ─────── */
        function buildEventObj(ev) {
          return {
            providerEventId: ev.providerEventId || ev.id,
            id: ev.id,
            start: ev.start,
            end: ev.end,
            calendarId: ev.calendarId,
            meetingLink: ev.meetingLink || null,
            externalAccountId: ev.externalAccountId != null ? ev.externalAccountId : null,
            providerCalendarId: ev.providerCalendarId != null ? ev.providerCalendarId : null,
          };
        }

        /* ── Inline msg helper inside link block ─────────────────────── */
        function setBlockMsg(msgEl, text, kind) {
          msgEl.textContent = text;
          msgEl.className = 'det-link-inline-msg' + (kind ? ' ' + kind : '');
          msgEl.style.display = text ? '' : 'none';
        }

        /* ── Disable/enable buttons in a container ───────────────────── */
        function disableBlock(containerEl) {
          var btns = containerEl.querySelectorAll('button,input');
          for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
        }
        function enableBlock(containerEl) {
          var btns = containerEl.querySelectorAll('button,input');
          for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
        }

        /* ── Build inline roster picker ──────────────────────────────── */
        function buildPickerWrap(onSelect) {
          var wrap = el('div', 'det-picker-wrap');

          var search = el('input', 'det-picker-search');
          search.type = 'text';
          search.placeholder = 'Search roster…';
          wrap.appendChild(search);

          var list = el('ul', 'det-picker-list');
          wrap.appendChild(list);

          function renderRoster(filter) {
            list.innerHTML = '';
            var q = (filter || '').toLowerCase();
            for (var i = 0; i < _roster.length; i++) {
              var c = _roster[i];
              if (q && c.name.toLowerCase().indexOf(q) === -1) continue;
              (function (cid, cname) {
                var item = el('li', 'det-picker-item');
                item.textContent = cname; // PHI-safe textContent
                item.addEventListener('click', function () {
                  onSelect(cid, cname);
                });
                list.appendChild(item);
              })(c.id, c.name);
            }
          }

          renderRoster('');
          search.addEventListener('input', function () {
            renderRoster(search.value);
          });
          search.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
              wrap.classList.remove('open');
            }
          });

          wrap._open = function () {
            renderRoster(search.value);
            wrap.classList.add('open');
            search.focus();
          };
          wrap._close = function () {
            wrap.classList.remove('open');
          };

          return wrap;
        }

        /* ── Roster cache (loaded once per bridge mount) ─────────────── */
        var _roster = []; // [{id, name}]

        function loadRoster() {
          if (!_recordQuery) return Promise.resolve();
          return _recordQuery
            .call('list')
            .then(function (patients) {
              _roster = [];
              (patients || []).forEach(function (p) {
                _roster.push({ id: p.id, name: p.displayName || p.id });
              });
            })
            .catch(function () {
              /* best-effort */
            });
        }

        /* ── Build client-link action block ──────────────────────────── */
        function buildLinkBlock(ev, titleEl) {
          var cls = (ev && ev.classification) || 'unclassified';
          var match = ev && ev._match;
          var matchClientId = match && match.matchClientId ? match.matchClientId : null;
          var candidates = match && Array.isArray(match.candidates) ? match.candidates : [];
          var linkedMeetingId = match && match.linkedMeetingId ? match.linkedMeetingId : null;

          var block = el('div', 'det-link-block');
          var desc = el('div', 'det-link-desc');
          var acts = el('div', 'det-link-actions');
          var msgEl = el('div', 'det-link-inline-msg');
          msgEl.style.display = 'none';

          var repAtt = pickRepEmail(ev);
          var repEmail = repAtt ? repAtt.email : null;
          var repName = repAtt ? repAtt.name || repAtt.email || null : null;

          // ── "Open in Sessions" shared action ──
          // For a linked event (client_session + matchClientId present), attempts to
          // resolve the client_meeting id and open the record tab directly.
          // Falls back to the activity-switch if lookup fails or no meeting found.
          function makeOpenSessionsBtn(label, solidStyle) {
            var btnCls = solidStyle ? 'det-act-btn primary-solid' : 'det-act-btn';
            var btn = el('button', btnCls);
            btn.type = 'button';
            btn.textContent = label || 'Open in Sessions';
            btn.addEventListener('click', function () {
              if (!_soamView) return;
              // Only attempt direct record-tab open when linked + query cap available
              if (matchClientId && _sessionsMeetingQuery) {
                var clickEv = ev; // capture current event for the async lookup
                _sessionsMeetingQuery
                  .call('listForPatient', matchClientId)
                  .then(function (list) {
                    var rows = Array.isArray(list) ? list : [];
                    // O493 triple match: prefer full (externalAccountId + providerCalendarId)
                    var found = null;
                    if (clickEv && clickEv.providerEventId) {
                      for (var i = 0; i < rows.length; i++) {
                        var r = rows[i];
                        if (r.providerEventId !== clickEv.providerEventId) continue;
                        // Full triple match preferred
                        if (
                          clickEv.externalAccountId &&
                          clickEv.providerCalendarId &&
                          r.externalAccountId === clickEv.externalAccountId &&
                          r.providerCalendarId === clickEv.providerCalendarId
                        ) {
                          found = r;
                          break;
                        }
                        // Fallback: bare event id match (legacy rows)
                        if (!found) found = r;
                      }
                    }
                    if (found) {
                      var clientName = null;
                      // Name may be in strong el from the rendered block — best-effort textContent
                      _soamView.openInEditor('meeting-record', {
                        bundleId: 'ru-soam-sessions',
                        query: 'id=' + encodeURIComponent(found.id),
                        title: clientName || 'Client Meeting',
                        entityId: found.id,
                      });
                    } else {
                      // No linked meeting row — fall back to activity switch
                      _soamView.openActivity('ru-soam-sessions.container');
                    }
                  })
                  .catch(function () {
                    // Query unavailable or threw — fall back gracefully
                    _soamView.openActivity('ru-soam-sessions.container');
                  });
              } else {
                _soamView.openActivity('ru-soam-sessions.container');
              }
            });
            return btn;
          }

          // ── Link action (shared by confirm + picker select) ──
          function doLink(clientId, clientName) {
            disableBlock(block);
            setBlockMsg(msgEl, '', '');
            var evObj = buildEventObj(ev);
            var aliasP =
              repEmail && _recordCmd
                ? _recordCmd.call('addAlias', clientId, { email: repEmail }).catch(function () {
                    /* non-fatal */
                  })
                : Promise.resolve();
            aliasP
              .then(function () {
                return _sessionsCmd
                  ? _sessionsCmd.call('linkProviderEvent', evObj, clientId)
                  : Promise.reject(new Error('sessions cap unavailable'));
              })
              .then(function () {
                // Linked — show success state (card + full-width "Open in Sessions")
                block.innerHTML = '';

                var card = el('div', 'det-linked-card');
                var cardAvatar = el('div', 'det-avatar');
                var cardName = clientName || clientId;
                cardAvatar.textContent =
                  String(cardName)
                    .split(/\s+/)
                    .slice(0, 2)
                    .map(function (w) {
                      return w.charAt(0);
                    })
                    .join('') || '?';
                card.appendChild(cardAvatar);
                var cardInfo = el('div', 'det-linked-card-info');
                var cardNameEl = txt('div', 'det-linked-card-name', cardName);
                var cardSub = txt('div', 'det-linked-card-sub', 'Linked from roster ✓');
                cardInfo.appendChild(cardNameEl);
                cardInfo.appendChild(cardSub);
                card.appendChild(cardInfo);
                block.appendChild(card);

                block.appendChild(makeOpenSessionsBtn('Open in Sessions', true));
                // Update header title to roster name if we have one
                if (clientName && titleEl) titleEl.textContent = clientName;
                // Bump calRev so schedule.html re-classifies this event immediately.
                bumpCalRev();
              })
              .catch(function (err) {
                enableBlock(block);
                if (window.__viewBoot.isLockedError(err)) {
                  setBlockMsg(msgEl, 'Workspace locked — unlock to link.', 'err');
                } else {
                  setBlockMsg(
                    msgEl,
                    'Link failed: ' + (err && err.message ? err.message : String(err)),
                    'err',
                  );
                }
              });
          }

          // ── State: CLIENT (linked) ──
          // Covers both a roster-linked client (matchClientId present) and a linked
          // meeting with no roster client yet (matchClientId null). Both show the
          // linked card + "Open in Sessions" + a "Not a client" (unlink) action.
          if (cls === 'client_session') {
            var clientName = null;
            // Build linked card. With a roster client, name resolves async (placeholder
            // until then); without one, fall back to the participant name.
            var card = el('div', 'det-linked-card');
            var cardAvatar = el('div', 'det-avatar');
            var fallbackName = repName || 'Linked meeting';
            cardAvatar.textContent = matchClientId
              ? '?'
              : String(fallbackName)
                  .split(/\s+/)
                  .slice(0, 2)
                  .map(function (w) {
                    return w.charAt(0);
                  })
                  .join('') || '?';
            card.appendChild(cardAvatar);
            var cardInfo = el('div', 'det-linked-card-info');
            var cardNameEl = txt('div', 'det-linked-card-name', matchClientId ? '…' : fallbackName);
            var cardSub = txt(
              'div',
              'det-linked-card-sub',
              matchClientId ? 'Linked from roster ✓' : 'Linked ✓',
            );
            cardInfo.appendChild(cardNameEl);
            cardInfo.appendChild(cardSub);
            card.appendChild(cardInfo);
            block.appendChild(card);

            block.appendChild(makeOpenSessionsBtn('Open in Sessions', true));

            // "Not a client" — unlink the meeting (if linked) and suppress the
            // participant so a future sync doesn't re-link it.
            if (linkedMeetingId || repEmail) {
              var notBtnL = el('button', 'det-act-btn');
              notBtnL.type = 'button';
              notBtnL.textContent = 'Not a client';
              notBtnL.addEventListener('click', function () {
                disableBlock(block);
                setBlockMsg(msgEl, '', '');
                var unlinkP =
                  linkedMeetingId && _sessionsCmd
                    ? _sessionsCmd.call('delete', linkedMeetingId)
                    : Promise.resolve();
                unlinkP
                  .then(function () {
                    return repEmail && _recordCmd
                      ? _recordCmd.call('suppressParticipant', { email: repEmail, calendarId: ev.calendarId || '' })
                      : Promise.resolve();
                  })
                  .then(function () {
                    block.innerHTML = '';
                    block.appendChild(txt('div', 'det-link-desc', 'Marked as not a client.'));
                    bumpCalRev();
                  })
                  .catch(function (err) {
                    enableBlock(block);
                    if (window.__viewBoot.isLockedError(err)) {
                      setBlockMsg(msgEl, 'Workspace locked.', 'err');
                    } else {
                      setBlockMsg(
                        msgEl,
                        'Failed: ' + (err && err.message ? err.message : String(err)),
                        'err',
                      );
                    }
                  });
              });
              acts.appendChild(notBtnL);
              block.appendChild(acts);
              block.appendChild(msgEl);
            }

            // Async name lookup
            if (_recordQuery && matchClientId) {
              (function (token, clientId, nameEl, avatarEl, titleElRef) {
                _recordQuery
                  .call('get', clientId)
                  .then(function (rec) {
                    if (_renderToken !== token) return; // stale
                    var name = rec && rec.displayName ? rec.displayName : null;
                    if (name) {
                      nameEl.textContent = name;
                      avatarEl.textContent =
                        String(name)
                          .split(/\s+/)
                          .slice(0, 2)
                          .map(function (w) {
                            return w.charAt(0);
                          })
                          .join('') || '?';
                      if (titleElRef) titleElRef.textContent = name;
                    } else {
                      nameEl.textContent = clientId;
                      avatarEl.textContent = '?';
                    }
                  })
                  .catch(function () {
                    nameEl.textContent = clientId;
                    avatarEl.textContent = '?';
                  });
              })(_renderToken, matchClientId, cardNameEl, cardAvatar, titleEl);
            }

            // ── State: ambiguous candidates (unclassified + _match.candidates present) ──
            // Applies when resolver found multiple possible roster matches for a participant.
            // Classification is 'unclassified' (no "probable" class); candidate data lives on _match.candidates.
          } else if (cls === 'unclassified' && candidates.length > 0) {
            desc.textContent =
              candidates.length === 1
                ? 'Possible roster match — confirm to link.'
                : 'Multiple roster matches.';
            block.appendChild(desc);

            var pickerC = buildPickerWrap(function (cid, cname) {
              pickerC._close();
              doLink(cid, cname);
            });

            var linkCandBtn = el('button', 'det-act-btn primary');
            linkCandBtn.type = 'button';
            linkCandBtn.textContent = 'Link to client';
            linkCandBtn.addEventListener('click', function () {
              loadRoster().then(function () {
                pickerC._open();
              });
            });
            acts.appendChild(linkCandBtn);

            if (repEmail) {
              var notBtnC = el('button', 'det-act-btn');
              notBtnC.type = 'button';
              notBtnC.textContent = 'Not a client';
              notBtnC.addEventListener('click', function () {
                if (!_recordCmd) {
                  setBlockMsg(msgEl, 'record.patient cap unavailable', 'err');
                  return;
                }
                disableBlock(block);
                _recordCmd
                  .call('suppressParticipant', { email: repEmail, calendarId: ev.calendarId || '' })
                  .then(function () {
                    block.innerHTML = '';
                    block.appendChild(txt('div', 'det-link-desc', 'Marked as not a client.'));
                    bumpCalRev();
                  })
                  .catch(function (err) {
                    enableBlock(block);
                    if (window.__viewBoot.isLockedError(err)) {
                      setBlockMsg(msgEl, 'Workspace locked.', 'err');
                    } else {
                      setBlockMsg(
                        msgEl,
                        'Failed: ' + (err && err.message ? err.message : String(err)),
                        'err',
                      );
                    }
                  });
              });
              acts.appendChild(notBtnC);
            }

            block.appendChild(acts);
            block.appendChild(pickerC);
            block.appendChild(msgEl);

            // ── State: EXCLUDED ──
          } else if (cls === 'not_client_session') {
            desc.textContent = 'Marked as not a client.';
            block.appendChild(desc);

            var addAsClientBtn = el('button', 'det-act-btn primary');
            addAsClientBtn.type = 'button';
            addAsClientBtn.textContent = 'Add as a client';
            addAsClientBtn.addEventListener('click', function () {
              if (!_recordCmd) {
                setBlockMsg(msgEl, 'record.patient cap unavailable', 'err');
                return;
              }
              disableBlock(block);
              var unsuppressStep = repEmail
                ? _recordCmd.call('unsuppressParticipant', { email: repEmail })
                : Promise.resolve();
              unsuppressStep
                .then(function () {
                  var createInput = { givenName: repName || repEmail };
                  if (repEmail) createInput.contactEmail = repEmail;
                  return _recordCmd.call('create', createInput);
                })
                .then(function (created) {
                  var newId = created && created.id ? created.id : null;
                  if (!newId) return Promise.reject(new Error('create returned no id'));
                  var evObj = buildEventObj(ev);
                  return (
                    _sessionsCmd
                      ? _sessionsCmd.call('linkProviderEvent', evObj, newId, { kind: 'intake' })
                      : Promise.reject(new Error('sessions cap unavailable'))
                  )
                    .then(function () {
                      return _recordCmd.call(
                        'setStage',
                        newId,
                        'intake',
                        'Intake scheduled from calendar',
                      );
                    })
                    .then(function () {
                      return { id: newId, name: repName || repEmail || '?' };
                    });
                })
                .then(function (result) {
                  block.innerHTML = '';

                  var cardExc = el('div', 'det-linked-card');
                  var avExc = el('div', 'det-avatar');
                  avExc.textContent =
                    String(result.name)
                      .split(/\s+/)
                      .slice(0, 2)
                      .map(function (w) {
                        return w.charAt(0);
                      })
                      .join('') || '?';
                  cardExc.appendChild(avExc);
                  var infoExc = el('div', 'det-linked-card-info');
                  infoExc.appendChild(txt('div', 'det-linked-card-name', result.name));
                  infoExc.appendChild(txt('div', 'det-linked-card-sub', 'Intake scheduled ✓'));
                  cardExc.appendChild(infoExc);
                  block.appendChild(cardExc);

                  block.appendChild(makeOpenSessionsBtn('Open in Sessions', true));
                  if (titleEl) titleEl.textContent = result.name;
                  bumpCalRev();
                })
                .catch(function (err) {
                  enableBlock(block);
                  if (window.__viewBoot.isLockedError(err)) {
                    setBlockMsg(msgEl, 'Workspace locked.', 'err');
                  } else {
                    setBlockMsg(
                      msgEl,
                      'Failed: ' + (err && err.message ? err.message : String(err)),
                      'err',
                    );
                  }
                });
            });
            acts.appendChild(addAsClientBtn);
            block.appendChild(acts);
            block.appendChild(msgEl);

            // ── State: PERSONAL ──
          } else if (cls === 'personal') {
            desc.textContent = 'Marked as personal / admin.';
            block.appendChild(desc);

            var picker3 = buildPickerWrap(function (cid, cname) {
              picker3._close();
              doLink(cid, cname);
            });

            var linkPersBtn = el('button', 'det-act-btn');
            linkPersBtn.type = 'button';
            linkPersBtn.textContent = 'Link to a client';
            linkPersBtn.addEventListener('click', function () {
              loadRoster().then(function () {
                picker3._open();
              });
            });
            acts.appendChild(linkPersBtn);
            block.appendChild(acts);
            block.appendChild(picker3);
            block.appendChild(msgEl);

            // ── State: NEW / UNCLASSIFIED ──
          } else {
            desc.textContent = 'Not recognised from your roster.';
            block.appendChild(desc);

            // "New intake client" inline form
            var intakeForm = el('div', 'det-intake-form');
            var nameInput = el('input', 'det-intake-input');
            nameInput.type = 'text';
            nameInput.placeholder = 'Client name…';
            if (repName) nameInput.value = repName; // PHI-safe: value assignment
            var createBtn = el('button', 'det-act-btn primary');
            createBtn.type = 'button';
            createBtn.textContent = 'Create & link';
            createBtn.addEventListener('click', function () {
              var rawName = nameInput.value.trim();
              if (!rawName) {
                nameInput.focus();
                return;
              }
              if (!_recordCmd) {
                setBlockMsg(msgEl, 'record.patient cap unavailable', 'err');
                return;
              }
              disableBlock(block);
              var createInput = { givenName: rawName };
              if (repEmail) createInput.contactEmail = repEmail;
              _recordCmd
                .call('create', createInput)
                .then(function (created) {
                  var newId = created && created.id ? created.id : null;
                  if (!newId) return Promise.reject(new Error('create returned no id'));
                  var evObj = buildEventObj(ev);
                  return (
                    _sessionsCmd
                      ? _sessionsCmd.call('linkProviderEvent', evObj, newId, { kind: 'intake' })
                      : Promise.reject(new Error('sessions cap unavailable'))
                  )
                    .then(function () {
                      return _recordCmd.call(
                        'setStage',
                        newId,
                        'intake',
                        'Intake scheduled from calendar',
                      );
                    })
                    .then(function () {
                      return { id: newId, name: rawName };
                    });
                })
                .then(function (result) {
                  block.innerHTML = '';

                  var card2 = el('div', 'det-linked-card');
                  var av2 = el('div', 'det-avatar');
                  av2.textContent =
                    String(result.name)
                      .split(/\s+/)
                      .slice(0, 2)
                      .map(function (w) {
                        return w.charAt(0);
                      })
                      .join('') || '?';
                  card2.appendChild(av2);
                  var info2 = el('div', 'det-linked-card-info');
                  info2.appendChild(txt('div', 'det-linked-card-name', result.name));
                  info2.appendChild(txt('div', 'det-linked-card-sub', 'Intake scheduled ✓'));
                  card2.appendChild(info2);
                  block.appendChild(card2);

                  block.appendChild(makeOpenSessionsBtn('Open in Sessions', true));
                  if (titleEl) titleEl.textContent = result.name;
                  // Bump calRev so schedule.html re-classifies this event immediately.
                  bumpCalRev();
                })
                .catch(function (err) {
                  enableBlock(block);
                  if (window.__viewBoot.isLockedError(err)) {
                    setBlockMsg(msgEl, 'Workspace locked.', 'err');
                  } else {
                    setBlockMsg(
                      msgEl,
                      'Create failed: ' + (err && err.message ? err.message : String(err)),
                      'err',
                    );
                  }
                });
            });
            intakeForm.appendChild(nameInput);
            intakeForm.appendChild(createBtn);

            // Picker for "Link to existing"
            var picker4 = buildPickerWrap(function (cid, cname) {
              picker4._close();
              doLink(cid, cname);
            });

            var newIntakeBtn = el('button', 'det-act-btn primary');
            newIntakeBtn.type = 'button';
            newIntakeBtn.textContent = 'New intake client';
            newIntakeBtn.addEventListener('click', function () {
              var isOpen = intakeForm.classList.contains('open');
              intakeForm.classList.toggle('open', !isOpen);
              picker4._close();
              if (!isOpen) nameInput.focus();
            });

            var linkExistBtn = el('button', 'det-act-btn');
            linkExistBtn.type = 'button';
            linkExistBtn.textContent = 'Link to existing';
            linkExistBtn.addEventListener('click', function () {
              intakeForm.classList.remove('open');
              loadRoster().then(function () {
                picker4._open();
              });
            });

            acts.appendChild(newIntakeBtn);
            acts.appendChild(linkExistBtn);

            if (repEmail) {
              var notBtn3 = el('button', 'det-act-btn');
              notBtn3.type = 'button';
              notBtn3.textContent = 'Not a client';
              notBtn3.addEventListener('click', function () {
                if (!_recordCmd) {
                  setBlockMsg(msgEl, 'record.patient cap unavailable', 'err');
                  return;
                }
                disableBlock(block);
                _recordCmd
                  .call('suppressParticipant', { email: repEmail, calendarId: ev.calendarId || '' })
                  .then(function () {
                    block.innerHTML = '';
                    block.appendChild(txt('div', 'det-link-desc', 'Marked as not a client.'));
                    bumpCalRev();
                  })
                  .catch(function (err) {
                    enableBlock(block);
                    if (window.__viewBoot.isLockedError(err)) {
                      setBlockMsg(msgEl, 'Workspace locked.', 'err');
                    } else {
                      setBlockMsg(
                        msgEl,
                        'Failed: ' + (err && err.message ? err.message : String(err)),
                        'err',
                      );
                    }
                  });
              });
              acts.appendChild(notBtn3);
            }

            block.appendChild(acts);
            block.appendChild(intakeForm);
            block.appendChild(picker4);
            block.appendChild(msgEl);
          }

          return block;
        }

        /* ── Join label from meeting URL + optional provider name ───── */
        /* providerName (from ev.meetingProvider) takes precedence over URL heuristics.
         * Fallback heuristics handle legacy cached rows that predate meeting_provider. */
        function joinLabel(url, providerName) {
          if (providerName) return 'Join ' + providerName;
          if (!url) return 'Join meeting';
          if (url.indexOf('zoom.us') !== -1) return 'Join Zoom';
          if (url.indexOf('meet.google.com') !== -1) return 'Join Google Meet';
          if (url.indexOf('teams.microsoft.com') !== -1 || url.indexOf('teams.live.com') !== -1)
            return 'Join Teams';
          return 'Join meeting';
        }

        /* ── Section builder helper ──────────────────────────────────── */
        function makeSection(iconName, labelText) {
          var sec = el('div', 'det-section');
          var hdr = el('div', 'det-section-hdr');
          var hdrIcon = el('span', 'det-section-hdr-icon');
          hdrIcon.innerHTML = icon(iconName, 12);
          hdr.appendChild(hdrIcon);
          hdr.appendChild(document.createTextNode(labelText));
          sec.appendChild(hdr);
          return sec;
        }

        /* ── KV row builder helper ───────────────────────────────────── */
        function makeKvRow(labelText, valueEl) {
          var row = el('div', 'det-kv-row');
          row.appendChild(txt('div', 'det-kv-label', labelText));
          row.appendChild(valueEl);
          return row;
        }

        /* ── Render ───────────────────────────────────────────────────── */
        /* ── O509: on-demand meeting-link re-scan ───────────────────── */
        /* Re-fetches the single event from Google, runs detectMeetingLink with the
         * current provider list, patches the cache row, and re-renders this view.
         * If a link is found: re-renders (join button appears) + bumps calRev so
         * schedule.html re-fetches the window-events cache and refreshes chips.
         * If no link found: shows inline status message, no re-render. */
        function doRescanEvent(ev, btn, statusEl, origBtnText) {
          if (!_scheduleCmd) {
            statusEl.textContent = 'Schedule command cap unavailable.';
            statusEl.className = 'det-rescan-status err';
            statusEl.style.display = '';
            return;
          }
          var extAcctId = ev.externalAccountId || null;
          var provCalId = ev.providerCalendarId || null;
          var provEvId  = ev.id                || null;
          if (!extAcctId || !provCalId || !provEvId) {
            statusEl.textContent = 'Event identity missing. Try a full re-sync first.';
            statusEl.className = 'det-rescan-status err';
            statusEl.style.display = '';
            return;
          }
          btn.disabled = true;
          btn.textContent = 'Scanning…';
          statusEl.textContent = '';
          statusEl.style.display = 'none';
          _scheduleCmd
            .call('rescanEvent', { externalAccountId: extAcctId, providerCalendarId: provCalId, providerEventId: provEvId })
            .then(function (result) {
              if (result && result.updated && result.meetingLink) {
                /* Link found: update in-memory event + re-render + bump grid calRev. */
                var updated = {};
                for (var k in _currentEv) {
                  if (Object.prototype.hasOwnProperty.call(_currentEv, k)) updated[k] = _currentEv[k];
                }
                updated.meetingLink     = result.meetingLink;
                updated.meetingProvider = result.meetingProvider || null;
                if (result.location) updated.location = result.location;
                _currentEv = updated;
                renderDetail(_currentEv);
                if (_soamView && _soamView.bumpScheduleData) _soamView.bumpScheduleData();
              } else {
                btn.disabled = false;
                btn.textContent = origBtnText;
                statusEl.textContent = 'No meeting link found.';
                statusEl.className = 'det-rescan-status';
                statusEl.style.display = '';
              }
            })
            .catch(function (err) {
              btn.disabled = false;
              btn.textContent = origBtnText;
              statusEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
              statusEl.className = 'det-rescan-status err';
              statusEl.style.display = '';
            });
        }

        function renderDetail(ev) {
          elScroll.innerHTML = '';

          if (!ev) {
            elEmpty.classList.remove('hidden');
            elScroll.classList.add('hidden');
            return;
          }

          elEmpty.classList.add('hidden');
          elScroll.classList.remove('hidden');

          var clsCls = clsClass(ev);

          /* ── 1. HEADER ── */
          var hdr = el('div', 'det-header');
          var titleStr = typeof ev.title === 'string' && ev.title.trim() ? ev.title : '(No title)';
          var titleEl = txt('div', 'det-title', titleStr);
          hdr.appendChild(titleEl);

          var dateStr = ev.start ? fmtDateLong(ev.start) : '';
          var timeStr = ev.allDay ? 'All day' : fmtTime(ev.start);
          if (dateStr || timeStr) {
            var metaStr = dateStr ? dateStr + (timeStr ? '  ·  ' + timeStr : '') : timeStr;
            hdr.appendChild(txt('div', 'det-meta', metaStr));
          }
          elScroll.appendChild(hdr);

          /* ── 2. STATUS BAR ── */
          var statusBar = el('div', 'det-status-bar ' + clsCls);
          var dot = el('div', 'det-cls-dot ' + clsCls);
          statusBar.appendChild(dot);
          statusBar.appendChild(txt('div', 'det-cls-human', clsHuman(ev)));
          statusBar.appendChild(txt('div', 'det-cls-badge ' + clsCls, clsLabel(ev)));
          elScroll.appendChild(statusBar);

          /* ── 3. TIME section ── */
          var timeSec = makeSection('clock', 'Time');
          var kvTime = el('div', 'det-kv');

          if (ev.allDay) {
            var allDayVal = txt('div', 'det-kv-value', 'All day');
            kvTime.appendChild(makeKvRow('When', allDayVal));
          } else {
            var t1 = fmtTime(ev.start);
            var t2 = ev.end ? fmtTime(ev.end) : '';
            /* Safe innerHTML — fmtTime returns only formatted time strings, no user data */
            var whenVal = el('div', 'det-kv-value');
            whenVal.innerHTML = '<strong>' + t1 + (t2 ? ' – ' + t2 : '') + '</strong>';
            kvTime.appendChild(makeKvRow('When', whenVal));

            if (ev.start && ev.end && String(ev.start).length > 10 && String(ev.end).length > 10) {
              var startMs = new Date(ev.start).getTime();
              var endMs = new Date(ev.end).getTime();
              var durMin = Math.round((endMs - startMs) / 60000);
              if (durMin > 0) {
                kvTime.appendChild(
                  makeKvRow('Duration', txt('div', 'det-kv-value', fmtDuration(durMin))),
                );
              }
            }
          }

          if (ev.location && typeof ev.location === 'string') {
            kvTime.appendChild(makeKvRow('Location', txt('div', 'det-kv-value', ev.location)));
          }

          timeSec.appendChild(kvTime);
          elScroll.appendChild(timeSec);

          /* ── 4. ONLINE MEETING section ── */
          if (ev.meetingLink && typeof ev.meetingLink === 'string') {
            var meetSec = makeSection('globe', 'Online meeting');

            var joinBtn = el('button', 'det-join-btn');
            joinBtn.type = 'button';
            joinBtn.textContent = joinLabel(ev.meetingLink, ev.meetingProvider);
            (function (url) {
              joinBtn.addEventListener('click', function () {
                if (_soamView) _soamView.openExternal(url);
              });
            })(ev.meetingLink);
            meetSec.appendChild(joinBtn);

            /* URL + copy row */
            var urlRow = el('div', 'det-join-url-row');
            urlRow.appendChild(txt('span', 'det-join-url', ev.meetingLink));

            var copyBtn = el('button', 'det-copy-btn');
            copyBtn.type = 'button';
            copyBtn.title = 'Copy link';
            copyBtn.innerHTML = icon('copy', 13);
            var copyConfirm = txt('span', 'det-copy-confirm', 'Copied');
            var copyTimer = null;

            (function (url) {
              copyBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                function showCopied() {
                  copyBtn.innerHTML = icon('check', 13);
                  copyBtn.classList.add('copied');
                  copyConfirm.classList.add('show');
                  if (copyTimer) clearTimeout(copyTimer);
                  copyTimer = setTimeout(function () {
                    copyBtn.innerHTML = icon('copy', 13);
                    copyBtn.classList.remove('copied');
                    copyConfirm.classList.remove('show');
                  }, 1200);
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard
                    .writeText(url)
                    .then(showCopied)
                    .catch(function () {
                      fallbackCopy(url, showCopied);
                    });
                } else {
                  fallbackCopy(url, showCopied);
                }
              });
            })(ev.meetingLink);

            urlRow.appendChild(copyBtn);
            urlRow.appendChild(copyConfirm);
            meetSec.appendChild(urlRow);

            /* Re-scan row (link present — subtle underline button to refresh) */
            var rsRowPresent = el('div', 'det-rescan-row');
            var rsBtnPresent = el('button', 'det-rescan-btn');
            rsBtnPresent.type = 'button';
            rsBtnPresent.textContent = 'Re-scan';
            rsBtnPresent.title = 'Re-fetch from Google to refresh the meeting link';
            var rsStatusPresent = txt('span', 'det-rescan-status', '');
            rsStatusPresent.style.display = 'none';
            (function (btn, statusEl) {
              btn.addEventListener('click', function () {
                doRescanEvent(ev, btn, statusEl, 'Re-scan');
              });
            })(rsBtnPresent, rsStatusPresent);
            rsRowPresent.appendChild(rsBtnPresent);
            rsRowPresent.appendChild(rsStatusPresent);
            meetSec.appendChild(rsRowPresent);

            elScroll.appendChild(meetSec);
          } else {
            /* No meeting link detected — show section with re-scan action. */
            var noMeetSec = makeSection('globe', 'Online meeting');
            noMeetSec.appendChild(txt('div', 'det-no-meet-msg', 'No meeting link detected.'));
            var rsBtnAbsent = el('button', 'det-act-btn');
            rsBtnAbsent.type = 'button';
            rsBtnAbsent.textContent = 'Re-scan for meeting link';
            var rsStatusAbsent = txt('div', 'det-rescan-status', '');
            rsStatusAbsent.style.display = 'none';
            (function (btn, statusEl) {
              btn.addEventListener('click', function () {
                doRescanEvent(ev, btn, statusEl, 'Re-scan for meeting link');
              });
            })(rsBtnAbsent, rsStatusAbsent);
            noMeetSec.appendChild(rsBtnAbsent);
            noMeetSec.appendChild(rsStatusAbsent);
            elScroll.appendChild(noMeetSec);
          }

          /* ── 5. PARTICIPANTS section ── */
          var hasAttendees = ev.attendees && ev.attendees.length > 0;
          var hasOrganizerOnly =
            !hasAttendees && ev.organizer && (ev.organizer.email || ev.organizer.displayName);

          if (hasAttendees || hasOrganizerOnly) {
            var partSec = makeSection('person', 'Participants');
            var pList = el('div', 'det-participants');

            /* Representative attendee email — used to identify the matched-client row
             * for roster-name substitution. */
            var _repAtt = pickRepEmail(ev);
            var _repEmail = _repAtt ? (_repAtt.email ? _repAtt.email.toLowerCase() : null) : null;

            var orgEmail =
              ev.organizer && ev.organizer.email ? String(ev.organizer.email).toLowerCase() : null;
            function isOrganiser(a) {
              return (
                a.organizer === true ||
                (orgEmail && String(a.email || '').toLowerCase() === orgEmail)
              );
            }

            function buildParticipantRow(
              nameStr,
              emailStr,
              isSelf,
              isOrg,
              isMatchedClient,
              resolvedClientName,
            ) {
              var displayName = resolvedClientName || nameStr;
              var initials = String(displayName)
                .split(/\s+/)
                .slice(0, 2)
                .map(function (w) {
                  return w.charAt(0);
                })
                .join('');

              var pRow = el('div', 'det-participant');
              var avatar = txt('div', 'det-avatar', initials || '?');
              pRow.appendChild(avatar);

              var info = el('div', 'det-participant-info');
              var nameEl = txt('div', 'det-participant-name', displayName);
              info.appendChild(nameEl);

              var roleParts = [];
              if (isSelf) roleParts.push('You');
              if (isOrg) roleParts.push('Organiser');
              if (isMatchedClient) roleParts.push('Client');
              var roleLine = txt('div', 'det-participant-role-line', roleParts.join(' · ') || '');
              info.appendChild(roleLine);

              pRow.appendChild(info);
              return { row: pRow, nameEl: nameEl, avatarEl: avatar };
            }

            if (hasAttendees) {
              var maxShown = 8;
              var attendees = ev.attendees;
              var shown = attendees.slice(0, maxShown);

              var matchClientId2 =
                ev._match && ev._match.matchClientId ? ev._match.matchClientId : null;

              shown.forEach(function (a) {
                var nameStr = a.name || a.email || '?';
                var aEmail = a.email ? a.email.toLowerCase() : null;
                var isMatchedParticipant = matchClientId2 && _repEmail && aEmail === _repEmail;
                var built = buildParticipantRow(
                  nameStr,
                  a.email,
                  !!a.self,
                  isOrganiser(a),
                  isMatchedParticipant,
                  null,
                );
                pList.appendChild(built.row);

                /* Async roster name override for matched participant */
                if (isMatchedParticipant && _recordQuery && matchClientId2) {
                  (function (token, cid, nameEl2, avatarEl2) {
                    _recordQuery
                      .call('get', cid)
                      .then(function (rec) {
                        if (_renderToken !== token) return;
                        var rname = rec && rec.displayName ? rec.displayName : null;
                        if (rname) {
                          nameEl2.textContent = rname;
                          avatarEl2.textContent =
                            String(rname)
                              .split(/\s+/)
                              .slice(0, 2)
                              .map(function (w) {
                                return w.charAt(0);
                              })
                              .join('') || '?';
                        }
                      })
                      .catch(function () {
                        /* best-effort */
                      });
                  })(_renderToken, matchClientId2, built.nameEl, built.avatarEl);
                }
              });

              if (attendees.length > maxShown) {
                pList.appendChild(
                  txt(
                    'div',
                    'det-participants-more',
                    '+' + (attendees.length - maxShown) + ' more',
                  ),
                );
              }
            } else {
              var org = ev.organizer;
              var orgName = org.displayName || org.email || '?';
              var built2 = buildParticipantRow(orgName, org.email, false, true, false, null);
              pList.appendChild(built2.row);
            }

            var detPcHint = participantClassHint(ev);
            if (detPcHint) partSec.appendChild(txt('div', 'det-participant-class', detPcHint));
            partSec.appendChild(pList);
            elScroll.appendChild(partSec);
          }

          /* ── 6. CLIENT LINK section ── */
          if (_sessionsCmd || _recordCmd || _recordQuery) {
            var linkSec = makeSection('link', 'Client link');
            var linkBlock = buildLinkBlock(ev, titleEl);
            linkSec.appendChild(linkBlock);
            elScroll.appendChild(linkSec);
          }

          /* ── 7. SOURCE section ── */
          var srcSec = makeSection('layers', 'Source');
          var kvSrc = el('div', 'det-kv');

          if (ev.calendarName && typeof ev.calendarName === 'string') {
            var calVal = el('div', 'det-kv-value');
            var calDotEl = el('span', 'det-cal-dot-inline');
            if (ev.calendarColor && typeof ev.calendarColor === 'string') {
              calDotEl.style.background = ev.calendarColor;
            } else {
              calDotEl.style.background = 'var(--color-fg-muted)';
              calDotEl.style.opacity = '0.5';
            }
            calVal.appendChild(calDotEl);
            calVal.appendChild(document.createTextNode(ev.calendarName)); // PHI-safe textContent equivalent
            kvSrc.appendChild(makeKvRow('Calendar', calVal));
          }

          if (ev.title && typeof ev.title === 'string') {
            kvSrc.appendChild(
              makeKvRow('Raw title', txt('div', 'det-kv-value det-raw-title-value', ev.title)),
            );
          }

          srcSec.appendChild(kvSrc);

          var honestyEl = el('div', 'det-honesty');
          var honestyIcon = el('span', 'det-honesty-icon');
          honestyIcon.innerHTML = icon('warning', 12);
          honestyEl.appendChild(honestyIcon);
          honestyEl.appendChild(
            document.createTextNode(
              "This title rides on Google. The client's identity shown above comes from your roster, not the raw title.",
            ),
          );
          srcSec.appendChild(honestyEl);

          elScroll.appendChild(srcSec);
        }

        /* ── Re-classify current event on calRev change ─────────────── */
        /* Called when scheduleViewState.calRev changes (roster mutation, calendar/account
         * change). Re-derives classification + _match from caps WITHOUT needing
         * schedule.html to push a new setActiveEvent. */
        function reclassifyAndRender() {
          if (!_currentEv) return; // no event selected — nothing to do

          var ev = _currentEv;
          var token = _renderToken; // capture before any async

          if (!_recordQuery) {
            /* Record query unavailable — re-render with existing classification as-is. */
            renderDetail(_currentEv);
            return;
          }

          /* Build participant list from current event (same logic as schedule.html). */
          var participants = [];
          if (ev.attendees) {
            ev.attendees.forEach(function (a) {
              if (!a.self && (a.email || a.name)) {
                participants.push({ email: a.email || null, name: a.name || null });
              }
            });
          }
