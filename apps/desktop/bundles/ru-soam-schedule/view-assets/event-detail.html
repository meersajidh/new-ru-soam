<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Event</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

      /* ── Design tokens (defaults — injected via postMessage from host) ─ */
      :root {
        color-scheme: light dark;

        --font-sans:    'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono:    ui-monospace, Consolas, 'Courier New', monospace;

        /* Surface */
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        /* Foreground */
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        /* Borders */
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        /* Accent */
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        /* Semantic */
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --color-info:    #5ac0de;

        --radius-sm:   4px;
        --radius-md:   7px;
        --radius-card: 10px;

        --transition: 130ms ease;

        /* Classification colors */
        --cls-client-color:      #5ac85a;
        --cls-probable-color:    #f4a623;
        --cls-not-color:         #636366;
        --cls-personal-color:    #5ac0de;
        --cls-unclassified-color: #636366;
      }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Bridge wait ────────────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      #bridge-wait.hidden { display: none; }
      .spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Root ──────────────────────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Empty / no-event state ─────────────────────────────────── */
      #empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        color: var(--color-fg-muted);
        font-size: 12px;
        padding: 24px;
        text-align: center;
      }
      #empty-state.hidden { display: none; }

      /* ── Detail scroll container ─────────────────────────────────── */
      #detail-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }
      #detail-scroll.hidden { display: none; }

      /* ── Header ──────────────────────────────────────────────────── */
      .det-header {
        padding: 14px 14px 10px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .det-header-top {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .det-title {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--color-fg-primary);
        word-break: break-word;
      }
      .det-meta {
        font-size: 11px;
        color: var(--color-fg-muted);
        line-height: 1.4;
      }

      /* ── Classification banner ───────────────────────────────────── */
      .det-cls-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        font-size: 12px;
      }
      .det-cls-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .det-cls-label {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }
      .det-cls-badge {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        border-radius: 3px;
        padding: 1px 5px;
        flex-shrink: 0;
        border: 1px solid transparent;
      }

      /* Classification color variants */
      .cls-client    { --cls-color: var(--cls-client-color); }
      .cls-probable  { --cls-color: var(--cls-probable-color); }
      .cls-not       { --cls-color: var(--cls-not-color); }
      .cls-personal  { --cls-color: var(--cls-personal-color); }
      .cls-unclassified { --cls-color: var(--cls-unclassified-color); }

      .det-cls-dot.cls-client      { background: var(--cls-client-color); }
      .det-cls-dot.cls-probable    { background: var(--cls-probable-color); }
      .det-cls-dot.cls-not         { background: var(--cls-not-color); }
      .det-cls-dot.cls-personal    { background: var(--cls-personal-color); }
      .det-cls-dot.cls-unclassified { background: var(--cls-unclassified-color); }

      .det-cls-badge.cls-client {
        color: var(--cls-client-color);
        border-color: color-mix(in srgb, var(--cls-client-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-client-color) 10%, transparent);
      }
      .det-cls-badge.cls-probable {
        color: var(--cls-probable-color);
        border-color: color-mix(in srgb, var(--cls-probable-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-probable-color) 10%, transparent);
        border-style: dashed;
      }
      .det-cls-badge.cls-not {
        color: var(--cls-not-color);
        border-color: color-mix(in srgb, var(--cls-not-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-not-color) 10%, transparent);
      }
      .det-cls-badge.cls-personal {
        color: var(--cls-personal-color);
        border-color: color-mix(in srgb, var(--cls-personal-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-personal-color) 10%, transparent);
      }
      .det-cls-badge.cls-unclassified {
        color: var(--cls-unclassified-color);
        border-color: color-mix(in srgb, var(--cls-unclassified-color) 30%, transparent);
        background: transparent;
      }

      /* ── Detail body ─────────────────────────────────────────────── */
      .det-body {
        padding: 10px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .det-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        min-height: 20px;
      }
      .det-row-icon {
        color: var(--color-fg-muted);
        flex-shrink: 0;
        margin-top: 1px;
        display: inline-flex;
        align-items: center;
        min-width: 14px;
      }
      .det-row-text {
        color: var(--color-fg-secondary);
        line-height: 1.4;
        flex: 1;
        min-width: 0;
        word-break: break-word;
      }
      .det-row-text strong {
        color: var(--color-fg-primary);
        font-weight: 500;
      }
      .det-duration-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        color: var(--color-fg-secondary);
        background: var(--color-surface-base);
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        border-radius: 3px;
        padding: 1px 5px;
        margin-left: 6px;
      }

      /* ── Join row ────────────────────────────────────────────────── */
      .det-join-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--color-fg-secondary);
        margin-bottom: 2px;
      }
      .det-join-url {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        color: var(--color-accent);
        user-select: text;
        cursor: text;
        word-break: break-all;
      }
      .det-copy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: var(--radius-sm);
        color: var(--color-fg-muted);
        flex-shrink: 0;
        transition: background var(--transition), color var(--transition);
        cursor: pointer;
        border: none;
        background: none;
        font: inherit;
        margin-left: 4px;
        vertical-align: middle;
      }
      .det-copy-btn:hover { background: var(--color-surface-active); color: var(--color-fg-primary); }
      .det-copy-btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 1px; }
      .det-copy-btn.copied { color: var(--color-success); }
      .det-copy-confirm {
        font-size: 10px;
        color: var(--color-success);
        margin-left: 4px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .det-copy-confirm.show { opacity: 1; }

      /* ── Divider ─────────────────────────────────────────────────── */
      .det-divider {
        height: 1px;
        background: color-mix(in srgb, var(--color-border) 50%, transparent);
        margin: 4px 0 2px;
      }

      /* ── Section label ───────────────────────────────────────────── */
      .det-section-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--color-fg-muted);
        margin-bottom: 4px;
        padding-left: 23px;
      }

      /* ── Participants ─────────────────────────────────────────────── */
      .det-participants {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .det-participant {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
      }
      .det-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--color-accent) 20%, var(--color-surface-base) 80%);
        border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
        color: var(--color-accent);
        font-size: 9px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      .det-participant-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--color-fg-secondary);
      }
      .det-participant-role {
        font-size: 10px;
        font-weight: 500;
        color: var(--color-fg-muted);
        background: color-mix(in srgb, var(--color-surface-base) 80%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
        border-radius: 3px;
        padding: 0 4px;
        flex-shrink: 0;
        line-height: 1.6;
      }

      /* ── Source block ─────────────────────────────────────────────── */
      .det-source {
        margin: 4px 14px 16px;
        background: color-mix(in srgb, var(--color-surface-base) 60%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .det-source-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
      }
      .det-source-cal-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .det-source-cal-name {
        color: var(--color-fg-secondary);
        font-weight: 500;
      }
      .det-raw-title-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--color-fg-muted);
      }
      .det-raw-title {
        font-size: 12px;
        color: var(--color-fg-secondary);
        word-break: break-word;
        font-style: italic;
      }
      .det-honesty {
        font-size: 10.5px;
        color: var(--color-fg-muted);
        line-height: 1.5;
        border-top: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        padding-top: 6px;
      }

      /* ── Calendar badge ──────────────────────────────────────────── */
      .det-cal-badge {
        font-size: 11px;
        color: var(--color-fg-muted);
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        border-radius: 3px;
        padding: 1px 5px;
      }

      /* ── Join button ─────────────────────────────────────────────── */
      .det-join-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-family: var(--font-sans);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition), border-color var(--transition);
        user-select: none;
        white-space: nowrap;
        margin-bottom: 4px;
      }
      .det-join-btn:hover {
        background: color-mix(in srgb, var(--color-accent) 85%, white);
        border-color: color-mix(in srgb, var(--color-accent) 85%, white);
      }
      .det-join-btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 1px; }

      /* ── Client-link action block ────────────────────────────────── */
      .det-link-block {
        margin: 2px 14px 4px;
        background: color-mix(in srgb, var(--color-surface-elevated) 60%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .det-link-desc {
        font-size: 11.5px;
        color: var(--color-fg-secondary);
        line-height: 1.5;
      }
      .det-link-desc strong {
        color: var(--color-fg-primary);
        font-weight: 600;
      }
      .det-link-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .det-link-inline-msg {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
      }
      .det-link-inline-msg.err { color: var(--color-error); font-style: normal; font-weight: 500; }
      .det-link-inline-msg.ok  { color: var(--color-success); font-style: normal; font-weight: 500; }

      /* Action buttons inside link block */
      .det-act-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        user-select: none;
        white-space: nowrap;
      }
      .det-act-btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-fg-muted) 10%, transparent);
        color: var(--color-fg-primary);
      }
      .det-act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .det-act-btn.primary {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-weight: 600;
      }
      .det-act-btn.primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-accent) 85%, white);
        border-color: color-mix(in srgb, var(--color-accent) 85%, white);
      }

      /* Inline picker inside link block */
      .det-picker-wrap {
        display: none;
        flex-direction: column;
        gap: 5px;
      }
      .det-picker-wrap.open { display: flex; }
      .det-picker-search {
        width: 100%;
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 11.5px;
        outline: none;
        transition: border-color var(--transition);
      }
      .det-picker-search::placeholder { color: var(--color-fg-muted); }
      .det-picker-search:focus { border-color: var(--color-border-focus); }
      .det-picker-list {
        list-style: none;
        max-height: 140px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 30%, transparent) transparent;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-surface-base);
      }
      .det-picker-list:empty::after {
        content: 'No clients match';
        display: block;
        padding: 7px 10px;
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
      }
      .det-picker-item {
        padding: 5px 10px;
        font-size: 12px;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
      }
      .det-picker-item:last-child { border-bottom: none; }
      .det-picker-item:hover {
        background: color-mix(in srgb, var(--color-accent) 8%, transparent);
        color: var(--color-fg-primary);
      }

      /* New-intake inline form */
      .det-intake-form {
        display: none;
        flex-direction: column;
        gap: 5px;
      }
      .det-intake-form.open { display: flex; }
      .det-intake-input {
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        font-family: var(--font-sans);
        font-size: 11.5px;
        outline: none;
        transition: border-color var(--transition);
      }
      .det-intake-input::placeholder { color: var(--color-fg-muted); }
      .det-intake-input:focus { border-color: var(--color-border-focus); }

    </style>
  </head>
  <body>
    <div id="bridge-wait"><span class="spinner"></span> Connecting…</div>
    <div id="root" style="display:none">
      <div id="empty-state">
        <div style="color:var(--color-fg-muted);opacity:0.5" id="empty-icon"></div>
        <div>Select an event to see details</div>
      </div>
      <div id="detail-scroll" class="hidden"></div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── Icon helper ─────────────────────────────────────────────── */
      var ICON_MAP = {
        'clock':        'clockface',
        'calendar':     'calendar',
        'location':     'location',
        'globe':        'globe',
        'person':       'account',
        'copy':         'copy',
        'check':        'check',
        'layers':       'layers',
        'link':         'link',
      };
      function icon(name, size) {
        var n = ICON_MAP[name] || name;
        return window.codicon ? window.codicon(n, size || 13) : '';
      }

      /* ── el / txt DOM helpers ────────────────────────────────────── */
      function el(tag, cls) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      }
      function txt(tag, cls, text) {
        var e = el(tag, cls);
        e.textContent = text;
        return e;
      }

      /* ── Clipboard fallback ──────────────────────────────────────── */
      function fallbackCopy(text, onSuccess) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok && onSuccess) onSuccess();
        } catch (err) { /* silently ignore */ }
      }

      /* ── Date / time utilities ───────────────────────────────────── */
      var MONTH_NAMES = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December'];
      var DAY_NAMES   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

      function fmtTime(isoStr) {
        if (!isoStr || isoStr.length <= 10) return 'All day';
        try {
          return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } catch (e) { return isoStr; }
      }

      function fmtDateLong(isoStr) {
        if (!isoStr) return '';
        try {
          var d = new Date(isoStr.length <= 10 ? isoStr + 'T00:00:00' : isoStr);
          return DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
        } catch (e) { return isoStr; }
      }

      function fmtDuration(minutes) {
        if (minutes <= 0) return '';
        var h = Math.floor(minutes / 60);
        var m = minutes % 60;
        if (h > 0 && m > 0) return h + ' hr ' + m + ' min';
        if (h > 0) return h === 1 ? '1 hr' : h + ' hr';
        return m + ' min';
      }

      /* ── Classification maps ─────────────────────────────────────── */
      var CLS_CLASS = {
        'client_session':     'cls-client',
        'not_client_session': 'cls-not',
        'personal':           'cls-personal',
        'unclassified':       'cls-unclassified',
      };
      var CLS_LABEL = {
        'client_session':     'CLIENT',
        'not_client_session': 'EXCLUDED',
        'personal':           'PERSONAL',
        'unclassified':       'UNCLASSIFIED',
      };
      var CLS_HUMAN = {
        'client_session':     'Client session',
        'not_client_session': 'Not a client',
        'personal':           'Personal · admin',
        'unclassified':       'Unrecognised',
      };
      function clsClass(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_CLASS[c] || 'cls-unclassified';
      }
      function clsLabel(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_LABEL[c] || 'UNCLASSIFIED';
      }
      function clsHuman(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_HUMAN[c] || 'Unrecognised';
      }

      /* ── State ───────────────────────────────────────────────────── */
      var _currentEv   = null;
      var _renderToken = 0;    // increments each applyActiveEvent; guards stale async lookups
      var _lastCalRev  = -1;   // tracks last-seen calRev for re-classify on change
      var _lastSvsView = 'week';        // scheduleViewState.view — needed to bump calRev
      var _lastSvsFilter = {};          // scheduleViewState.classFilter — needed to bump calRev

      /* ── Bump calRev via request.setScheduleViewState ─────────────── */
      /* Called after a classification-mutating action (link, suppress, create+link).
       * Uses the existing view-bridge verb — no new channel field. The renderer
       * increments calRev on the ScheduleViewStateService, which broadcasts to all
       * iframes (including schedule.html) to re-classify. */
      function bumpCalRev() {
        if (_lastCalRev < 0) return;  // not yet initialised
        window.parent.postMessage({
          __soamView: true,
          kind: 'request.setScheduleViewState',
          state: { view: _lastSvsView, calRev: _lastCalRev + 1, classFilter: _lastSvsFilter },
        }, '*');
      }

      /* ── Cap proxies (bound lazily after bridge resolves) ────────── */
      var _soamView             = null;
      var _sessionsCmd          = null;
      var _sessionsMeetingQuery = null;
      var _recordCmd            = null;
      var _recordQuery          = null;

      /* ── DOM refs ─────────────────────────────────────────────────── */
      var elBridgeWait  = document.getElementById('bridge-wait');
      var elRoot        = document.getElementById('root');
      var elEmpty       = document.getElementById('empty-state');
      var elEmptyIcon   = document.getElementById('empty-icon');
      var elScroll      = document.getElementById('detail-scroll');

      /* ── Representative attendee helper ──────────────────────────── */
      function pickRepEmail(ev) {
        var atts = (ev && ev.attendees) || [];
        var best = null;
        for (var i = 0; i < atts.length; i++) {
          var a = atts[i];
          if (a.self) continue;
          if (!a.email) continue;
          if (a.organizer) { if (!best) best = a; continue; }
          return a; // first non-self, non-organiser with email
        }
        return best; // fallback: organiser-with-email
      }

      /* ── Build event obj for linkProviderEvent (O493 triple) ─────── */
      function buildEventObj(ev) {
        return {
          providerEventId: ev.providerEventId || ev.id,
          id:              ev.id,
          start:           ev.start,
          end:             ev.end,
          calendarId:      ev.calendarId,
          meetingLink:     ev.meetingLink || null,
          externalAccountId:  ev.externalAccountId  != null ? ev.externalAccountId  : null,
          providerCalendarId: ev.providerCalendarId != null ? ev.providerCalendarId : null,
        };
      }

      /* ── Inline msg helper inside link block ─────────────────────── */
      function setBlockMsg(msgEl, text, kind) {
        msgEl.textContent = text;
        msgEl.className = 'det-link-inline-msg' + (kind ? ' ' + kind : '');
        msgEl.style.display = text ? '' : 'none';
      }

      /* ── Disable/enable buttons in a container ───────────────────── */
      function disableBlock(containerEl) {
        var btns = containerEl.querySelectorAll('button,input');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      }
      function enableBlock(containerEl) {
        var btns = containerEl.querySelectorAll('button,input');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
      }

      /* ── Build inline roster picker ──────────────────────────────── */
      function buildPickerWrap(onSelect) {
        var wrap = el('div', 'det-picker-wrap');

        var search = el('input', 'det-picker-search');
        search.type = 'text';
        search.placeholder = 'Search roster…';
        wrap.appendChild(search);

        var list = el('ul', 'det-picker-list');
        wrap.appendChild(list);

        function renderRoster(filter) {
          list.innerHTML = '';
          var q = (filter || '').toLowerCase();
          for (var i = 0; i < _roster.length; i++) {
            var c = _roster[i];
            if (q && c.name.toLowerCase().indexOf(q) === -1) continue;
            (function (cid, cname) {
              var item = el('li', 'det-picker-item');
              item.textContent = cname; // PHI-safe textContent
              item.addEventListener('click', function () { onSelect(cid, cname); });
              list.appendChild(item);
            })(c.id, c.name);
          }
        }

        renderRoster('');
        search.addEventListener('input', function () { renderRoster(search.value); });
        search.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { wrap.classList.remove('open'); }
        });

        wrap._open = function () {
          renderRoster(search.value);
          wrap.classList.add('open');
          search.focus();
        };
        wrap._close = function () { wrap.classList.remove('open'); };

        return wrap;
      }

      /* ── Roster cache (loaded once per bridge mount) ─────────────── */
      var _roster = []; // [{id, name}]

      function loadRoster() {
        if (!_recordQuery) return Promise.resolve();
        return _recordQuery.call('list')
          .then(function (patients) {
            _roster = [];
            (patients || []).forEach(function (p) {
              _roster.push({ id: p.id, name: p.displayName || p.id });
            });
          })
          .catch(function () { /* best-effort */ });
      }

      /* ── Build client-link action block ──────────────────────────── */
      function buildLinkBlock(ev, titleEl) {
        var cls = (ev && ev.classification) || 'unclassified';
        var match = ev && ev._match;
        var matchClientId  = match && match.matchClientId ? match.matchClientId : null;
        var candidates     = match && Array.isArray(match.candidates) ? match.candidates : [];

        var block = el('div', 'det-link-block');
        var desc  = el('div', 'det-link-desc');
        var acts  = el('div', 'det-link-actions');
        var msgEl = el('div', 'det-link-inline-msg');
        msgEl.style.display = 'none';

        var repAtt = pickRepEmail(ev);
        var repEmail = repAtt ? repAtt.email : null;
        var repName  = repAtt ? (repAtt.name || repAtt.email || null) : null;

        // ── "Open in Sessions" shared action ──
        // For a linked event (client_session + matchClientId present), attempts to
        // resolve the client_meeting id and open the record tab directly.
        // Falls back to the activity-switch if lookup fails or no meeting found.
        function makeOpenSessionsBtn(label) {
          var btn = el('button', 'det-act-btn');
          btn.type = 'button';
          btn.textContent = label || 'Open in Sessions';
          btn.addEventListener('click', function () {
            if (!_soamView) return;
            // Only attempt direct record-tab open when linked + query cap available
            if (matchClientId && _sessionsMeetingQuery) {
              var clickEv = ev; // capture current event for the async lookup
              _sessionsMeetingQuery.call('listForPatient', matchClientId).then(function (list) {
                var rows = Array.isArray(list) ? list : [];
                // O493 triple match: prefer full (externalAccountId + providerCalendarId)
                var found = null;
                if (clickEv && clickEv.providerEventId) {
                  for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (r.providerEventId !== clickEv.providerEventId) continue;
                    // Full triple match preferred
                    if (
                      clickEv.externalAccountId &&
                      clickEv.providerCalendarId &&
                      r.externalAccountId === clickEv.externalAccountId &&
                      r.providerCalendarId === clickEv.providerCalendarId
                    ) {
                      found = r;
                      break;
                    }
                    // Fallback: bare event id match (legacy rows)
                    if (!found) found = r;
                  }
                }
                if (found) {
                  var clientName = null;
                  // Name may be in strong el from the rendered block — best-effort textContent
                  _soamView.openInEditor('meeting-record', {
                    bundleId: 'ru-soam-sessions',
                    query: 'id=' + encodeURIComponent(found.id),
                    title: clientName || 'Client Meeting',
                    entityId: found.id,
                  });
                } else {
                  // No linked meeting row — fall back to activity switch
                  _soamView.openActivity('ru-soam-sessions.container');
                }
              }).catch(function () {
                // Query unavailable or threw — fall back gracefully
                _soamView.openActivity('ru-soam-sessions.container');
              });
            } else {
              _soamView.openActivity('ru-soam-sessions.container');
            }
          });
          return btn;
        }

        // ── Link action (shared by confirm + picker select) ──
        function doLink(clientId, clientName) {
          disableBlock(block);
          setBlockMsg(msgEl, '', '');
          var evObj = buildEventObj(ev);
          var aliasP = (repEmail && _recordCmd)
            ? _recordCmd.call('addAlias', clientId, { email: repEmail }).catch(function () { /* non-fatal */ })
            : Promise.resolve();
          aliasP.then(function () {
            return _sessionsCmd ? _sessionsCmd.call('linkProviderEvent', evObj, clientId) : Promise.reject(new Error('sessions cap unavailable'));
          }).then(function () {
            // Linked — show success state
            block.innerHTML = '';
            var successDesc = el('div', 'det-link-desc');
            var strong = el('strong', '');
            strong.textContent = clientName || clientId;
            successDesc.appendChild(strong);
            var tail = document.createTextNode(' · Linked from roster ✓');
            successDesc.appendChild(tail);
            block.appendChild(successDesc);
            var successActs = el('div', 'det-link-actions');
            successActs.appendChild(makeOpenSessionsBtn('Open in Sessions'));
            block.appendChild(successActs);
            // Update header title to roster name if we have one
            if (clientName && titleEl) titleEl.textContent = clientName;
            // Bump calRev so schedule.html re-classifies this event immediately.
            bumpCalRev();
          }).catch(function (err) {
            enableBlock(block);
            if (window.__viewBoot.isLockedError(err)) {
              setBlockMsg(msgEl, 'Workspace locked — unlock to link.', 'err');
            } else {
              setBlockMsg(msgEl, 'Link failed: ' + (err && err.message ? err.message : String(err)), 'err');
            }
          });
        }

        // ── State: CLIENT (linked) ──
        if (cls === 'client_session' && matchClientId) {
          var clientName = null;
          // Lookup will fill name; start with placeholder
          var strong = el('strong', '');
          strong.textContent = '…';
          var tail1 = document.createTextNode(' · Linked from roster ✓');
          desc.appendChild(strong);
          desc.appendChild(tail1);
          block.appendChild(desc);
          acts.appendChild(makeOpenSessionsBtn('Open in Sessions'));
          block.appendChild(acts);
          // Async name lookup
          if (_recordQuery && matchClientId) {
            (function (token, clientId, strongEl, titleElRef) {
              _recordQuery.call('get', clientId).then(function (rec) {
                if (_renderToken !== token) return; // stale
                var name = rec && rec.displayName ? rec.displayName : null;
                if (name) {
                  strongEl.textContent = name;
                  if (titleElRef) titleElRef.textContent = name;
                } else {
                  strongEl.textContent = clientId;
                }
              }).catch(function () { strongEl.textContent = clientId; });
            })(_renderToken, matchClientId, strong, titleEl);
          }

        // ── State: ambiguous candidates (unclassified + _match.candidates present) ──
        // Applies when resolver found multiple possible roster matches for a participant.
        // Classification is 'unclassified' (no "probable" class); candidate data lives on _match.candidates.
        } else if (cls === 'unclassified' && candidates.length > 0) {
          desc.textContent = candidates.length === 1 ? 'Possible roster match — confirm to link.' : 'Multiple roster matches.';
          block.appendChild(desc);

          var pickerC = buildPickerWrap(function (cid, cname) {
            pickerC._close();
            doLink(cid, cname);
          });

          var linkCandBtn = el('button', 'det-act-btn primary');
          linkCandBtn.type = 'button';
          linkCandBtn.textContent = 'Link to client…';
          linkCandBtn.addEventListener('click', function () {
            loadRoster().then(function () { pickerC._open(); });
          });
          acts.appendChild(linkCandBtn);

          if (repEmail) {
            var notBtnC = el('button', 'det-act-btn');
            notBtnC.type = 'button';
            notBtnC.textContent = 'Not a client';
            notBtnC.addEventListener('click', function () {
              if (!_recordCmd) { setBlockMsg(msgEl, 'record.patient cap unavailable', 'err'); return; }
              disableBlock(block);
              _recordCmd.call('suppressParticipant', { email: repEmail })
                .then(function () {
                  block.innerHTML = '';
                  block.appendChild(txt('div', 'det-link-desc', 'Marked as not a client.'));
                  bumpCalRev();
                })
                .catch(function (err) {
                  enableBlock(block);
                  if (window.__viewBoot.isLockedError(err)) {
                    setBlockMsg(msgEl, 'Workspace locked.', 'err');
                  } else {
                    setBlockMsg(msgEl, 'Failed: ' + (err && err.message ? err.message : String(err)), 'err');
                  }
                });
            });
            acts.appendChild(notBtnC);
          }

          block.appendChild(acts);
          block.appendChild(pickerC);
          block.appendChild(msgEl);

        // ── State: EXCLUDED ──
        } else if (cls === 'not_client_session') {
          desc.textContent = 'Marked as not a client.';
          block.appendChild(desc);

          var picker2 = buildPickerWrap(function (cid, cname) {
            picker2._close();
            doLink(cid, cname);
          });

          var linkExcBtn = el('button', 'det-act-btn');
          linkExcBtn.type = 'button';
          linkExcBtn.textContent = 'Link to a client…';
          linkExcBtn.addEventListener('click', function () {
            loadRoster().then(function () { picker2._open(); });
          });
          acts.appendChild(linkExcBtn);
          block.appendChild(acts);
          block.appendChild(picker2);
          block.appendChild(msgEl);

        // ── State: PERSONAL ──
        } else if (cls === 'personal') {
          desc.textContent = 'Marked as personal / admin.';
          block.appendChild(desc);

          var picker3 = buildPickerWrap(function (cid, cname) {
            picker3._close();
            doLink(cid, cname);
          });

          var linkPersBtn = el('button', 'det-act-btn');
          linkPersBtn.type = 'button';
          linkPersBtn.textContent = 'Link to a client…';
          linkPersBtn.addEventListener('click', function () {
            loadRoster().then(function () { picker3._open(); });
          });
          acts.appendChild(linkPersBtn);
          block.appendChild(acts);
          block.appendChild(picker3);
          block.appendChild(msgEl);

        // ── State: NEW / UNCLASSIFIED ──
        } else {
          desc.textContent = 'Not recognised from your roster.';
          block.appendChild(desc);

          // "New intake client" inline form
          var intakeForm = el('div', 'det-intake-form');
          var nameInput  = el('input', 'det-intake-input');
          nameInput.type = 'text';
          nameInput.placeholder = 'Client name…';
          if (repName) nameInput.value = repName; // PHI-safe: value assignment
          var createBtn = el('button', 'det-act-btn primary');
          createBtn.type = 'button';
          createBtn.textContent = 'Create & link';
          createBtn.addEventListener('click', function () {
            var rawName = nameInput.value.trim();
            if (!rawName) { nameInput.focus(); return; }
            if (!_recordCmd) { setBlockMsg(msgEl, 'record.patient cap unavailable', 'err'); return; }
            disableBlock(block);
            var createInput = { givenName: rawName };
            if (repEmail) createInput.contactEmail = repEmail;
            _recordCmd.call('create', createInput)
              .then(function (created) {
                var newId = created && created.id ? created.id : null;
                if (!newId) return Promise.reject(new Error('create returned no id'));
                var evObj = buildEventObj(ev);
                return (_sessionsCmd ? _sessionsCmd.call('linkProviderEvent', evObj, newId, { kind: 'intake' }) : Promise.reject(new Error('sessions cap unavailable')))
                  .then(function () {
                    return _recordCmd.call('setStage', newId, 'intake', 'Intake scheduled from calendar');
                  })
                  .then(function () { return { id: newId, name: rawName }; });
              })
              .then(function (result) {
                block.innerHTML = '';
                var successDesc = el('div', 'det-link-desc');
                var strong = el('strong', '');
                strong.textContent = result.name;
                successDesc.appendChild(strong);
                successDesc.appendChild(document.createTextNode(' · Intake scheduled ✓'));
                block.appendChild(successDesc);
                var successActs = el('div', 'det-link-actions');
                successActs.appendChild(makeOpenSessionsBtn('Open in Sessions'));
                block.appendChild(successActs);
                if (titleEl) titleEl.textContent = result.name;
                // Bump calRev so schedule.html re-classifies this event immediately.
                bumpCalRev();
              })
              .catch(function (err) {
                enableBlock(block);
                if (window.__viewBoot.isLockedError(err)) {
                  setBlockMsg(msgEl, 'Workspace locked.', 'err');
                } else {
                  setBlockMsg(msgEl, 'Create failed: ' + (err && err.message ? err.message : String(err)), 'err');
                }
              });
          });
          intakeForm.appendChild(nameInput);
          intakeForm.appendChild(createBtn);

          // Picker for "Link to existing…"
          var picker4 = buildPickerWrap(function (cid, cname) {
            picker4._close();
            doLink(cid, cname);
          });

          var newIntakeBtn = el('button', 'det-act-btn primary');
          newIntakeBtn.type = 'button';
          newIntakeBtn.textContent = 'New intake client';
          newIntakeBtn.addEventListener('click', function () {
            var isOpen = intakeForm.classList.contains('open');
            intakeForm.classList.toggle('open', !isOpen);
            picker4._close();
            if (!isOpen) nameInput.focus();
          });

          var linkExistBtn = el('button', 'det-act-btn');
          linkExistBtn.type = 'button';
          linkExistBtn.textContent = 'Link to existing…';
          linkExistBtn.addEventListener('click', function () {
            intakeForm.classList.remove('open');
            loadRoster().then(function () { picker4._open(); });
          });

          acts.appendChild(newIntakeBtn);
          acts.appendChild(linkExistBtn);

          if (repEmail) {
            var notBtn3 = el('button', 'det-act-btn');
            notBtn3.type = 'button';
            notBtn3.textContent = 'Not a client';
            notBtn3.addEventListener('click', function () {
              if (!_recordCmd) { setBlockMsg(msgEl, 'record.patient cap unavailable', 'err'); return; }
              disableBlock(block);
              _recordCmd.call('suppressParticipant', { email: repEmail })
                .then(function () {
                  block.innerHTML = '';
                  block.appendChild(txt('div', 'det-link-desc', 'Marked as not a client.'));
                  bumpCalRev();
                })
                .catch(function (err) {
                  enableBlock(block);
                  if (window.__viewBoot.isLockedError(err)) {
                    setBlockMsg(msgEl, 'Workspace locked.', 'err');
                  } else {
                    setBlockMsg(msgEl, 'Failed: ' + (err && err.message ? err.message : String(err)), 'err');
                  }
                });
            });
            acts.appendChild(notBtn3);
          }

          block.appendChild(acts);
          block.appendChild(intakeForm);
          block.appendChild(picker4);
          block.appendChild(msgEl);
        }

        return block;
      }

      /* ── Join label from meeting URL ─────────────────────────────── */
      function joinLabel(url) {
        if (!url) return 'Join meeting';
        if (url.indexOf('zoom.us') !== -1) return 'Join Zoom';
        if (url.indexOf('meet.google.com') !== -1) return 'Join Google Meet';
        if (url.indexOf('teams.microsoft.com') !== -1 || url.indexOf('teams.live.com') !== -1) return 'Join Teams';
        return 'Join meeting';
      }

      /* ── Render ───────────────────────────────────────────────────── */
      function renderDetail(ev) {
        elScroll.innerHTML = '';

        if (!ev) {
          elEmpty.classList.remove('hidden');
          elScroll.classList.add('hidden');
          return;
        }

        elEmpty.classList.add('hidden');
        elScroll.classList.remove('hidden');

        var cls = (ev.classification) || 'unclassified';
        var clsCls = clsClass(ev);

        /* ── Header ── */
        var hdr = el('div', 'det-header');
        var hdrTop = el('div', 'det-header-top');

        /* Title placeholder — replaced by roster identity for linked/probable via async lookup */
        var titleStr = (typeof ev.title === 'string' && ev.title.trim()) ? ev.title : '(No title)';
        var titleEl = txt('div', 'det-title', titleStr);
        hdrTop.appendChild(titleEl);
        hdr.appendChild(hdrTop);

        /* Date + start time meta line */
        var dateStr = ev.start ? fmtDateLong(ev.start) : '';
        var timeStr = ev.allDay ? 'All day' : fmtTime(ev.start);
        if (dateStr || timeStr) {
          var metaStr = dateStr ? dateStr + (timeStr ? '  ·  ' + timeStr : '') : timeStr;
          var metaEl = txt('div', 'det-meta', metaStr);
          hdr.appendChild(metaEl);
        }
        elScroll.appendChild(hdr);

        /* ── Classification banner ── */
        var banner = el('div', 'det-cls-banner');
        var dot = el('div', 'det-cls-dot ' + clsCls);
        var clsLbl = txt('div', 'det-cls-label', clsHuman(ev));
        var badge = txt('div', 'det-cls-badge ' + clsCls, clsLabel(ev));
        banner.appendChild(dot);
        banner.appendChild(clsLbl);
        banner.appendChild(badge);
        elScroll.appendChild(banner);

        /* ── Detail body ── */
        var body = el('div', 'det-body');

        /* Time row */
        var timeRow = el('div', 'det-row');
        var timeIco = el('span', 'det-row-icon');
        timeIco.innerHTML = icon('clock', 13);
        var timeTxt = el('span', 'det-row-text');
        if (ev.allDay) {
          timeTxt.textContent = 'All day';
        } else {
          /* Use innerHTML for bold time range (no user data, safe format strings). */
          var t1 = fmtTime(ev.start);
          var t2 = ev.end ? fmtTime(ev.end) : '';
          timeTxt.innerHTML = '<strong>' + t1 + (t2 ? ' – ' + t2 : '') + '</strong>';
          if (ev.start && ev.end && String(ev.start).length > 10 && String(ev.end).length > 10) {
            var startMs = new Date(ev.start).getTime();
            var endMs   = new Date(ev.end).getTime();
            var durMin  = Math.round((endMs - startMs) / 60000);
            if (durMin > 0) {
              var durBadge = txt('span', 'det-duration-badge', fmtDuration(durMin));
              timeTxt.appendChild(durBadge);
            }
          }
        }
        timeRow.appendChild(timeIco);
        timeRow.appendChild(timeTxt);
        body.appendChild(timeRow);

        /* Calendar row */
        if (ev.calendarName) {
          var calRow = el('div', 'det-row');
          var calIco = el('span', 'det-row-icon');
          calIco.innerHTML = icon('layers', 13);
          var calTxt = el('div', 'det-row-text');
          calTxt.appendChild(txt('span', 'det-cal-badge', ev.calendarName));
          calRow.appendChild(calIco);
          calRow.appendChild(calTxt);
          body.appendChild(calRow);
        }

        /* Location row */
        if (ev.location && typeof ev.location === 'string') {
          var locRow = el('div', 'det-row');
          var locIco = el('span', 'det-row-icon');
          locIco.innerHTML = icon('location', 13);
          var locTxt = txt('span', 'det-row-text', ev.location);
          locRow.appendChild(locIco);
          locRow.appendChild(locTxt);
          body.appendChild(locRow);
        }

        /* Join row — Join button + URL + copy */
        if (ev.meetingLink && typeof ev.meetingLink === 'string') {
          var joinRow = el('div', 'det-row');
          var joinIco = el('span', 'det-row-icon');
          joinIco.innerHTML = icon('globe', 13);
          var joinTxt = el('div', 'det-row-text');

          /* Join button — primary action, opens via openExternal */
          var joinBtn = el('button', 'det-join-btn');
          joinBtn.type = 'button';
          joinBtn.textContent = joinLabel(ev.meetingLink);
          (function (url) {
            joinBtn.addEventListener('click', function () {
              if (_soamView) _soamView.openExternal(url);
            });
          })(ev.meetingLink);
          joinTxt.appendChild(joinBtn);

          joinTxt.appendChild(txt('div', 'det-join-label', 'Meeting link'));

          var joinUrlRow = el('div', '');
          joinUrlRow.style.display = 'flex';
          joinUrlRow.style.alignItems = 'center';
          joinUrlRow.style.gap = '4px';
          joinUrlRow.style.flexWrap = 'wrap';

          var joinUrlEl = txt('span', 'det-join-url', ev.meetingLink);
          joinUrlRow.appendChild(joinUrlEl);

          /* Copy button (execCommand fallback for opaque-origin sandbox) */
          var copyBtn = el('button', 'det-copy-btn');
          copyBtn.type = 'button';
          copyBtn.title = 'Copy link';
          copyBtn.innerHTML = icon('copy', 13);
          var copyConfirm = txt('span', 'det-copy-confirm', 'Copied');
          var copyTimer = null;

          (function (url) {
            copyBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              function showCopied() {
                copyBtn.innerHTML = icon('check', 13);
                copyBtn.classList.add('copied');
                copyConfirm.classList.add('show');
                if (copyTimer) clearTimeout(copyTimer);
                copyTimer = setTimeout(function () {
                  copyBtn.innerHTML = icon('copy', 13);
                  copyBtn.classList.remove('copied');
                  copyConfirm.classList.remove('show');
                }, 1200);
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(showCopied).catch(function () {
                  fallbackCopy(url, showCopied);
                });
              } else {
                fallbackCopy(url, showCopied);
              }
            });
          }(ev.meetingLink));

          joinUrlRow.appendChild(copyBtn);
          joinUrlRow.appendChild(copyConfirm);
          joinTxt.appendChild(joinUrlRow);
          joinRow.appendChild(joinIco);
          joinRow.appendChild(joinTxt);
          body.appendChild(joinRow);
        }

        elScroll.appendChild(body);

        /* ── Participants ── */
        var hasAttendees = ev.attendees && ev.attendees.length > 0;
        var hasOrganizerOnly = !hasAttendees && ev.organizer && (ev.organizer.email || ev.organizer.displayName);
        if (hasAttendees || hasOrganizerOnly) {
          var participantsWrap = el('div', 'det-body');
          participantsWrap.style.paddingTop = '0';

          participantsWrap.appendChild(el('div', 'det-divider'));

          var secLbl = el('div', 'det-section-label');
          secLbl.innerHTML = icon('person', 11) + ' Participants';
          participantsWrap.appendChild(secLbl);

          var pList = el('div', 'det-participants');

          var orgEmail = ev.organizer && ev.organizer.email ? String(ev.organizer.email).toLowerCase() : null;
          function isOrganiser(a) {
            return a.organizer === true || (orgEmail && String(a.email || '').toLowerCase() === orgEmail);
          }

          if (hasAttendees) {
            var maxShown = 8;
            var attendees = ev.attendees;
            var shown = attendees.slice(0, maxShown);
            shown.forEach(function (a) {
              var nameStr = a.name || a.email || '?';
              var initials = String(nameStr)
                .split(/\s+/)
                .slice(0, 2)
                .map(function (w) { return w.charAt(0); })
                .join('');

              var pRow = el('div', 'det-participant');
              var avatar = txt('div', 'det-avatar', initials || '?');
              var pName  = txt('div', 'det-participant-name', a.name || a.email || 'Unknown');
              pRow.appendChild(avatar);
              pRow.appendChild(pName);
              if (a.self) pRow.appendChild(txt('span', 'det-participant-role', 'you'));
              if (isOrganiser(a)) pRow.appendChild(txt('span', 'det-participant-role', 'organiser'));
              pList.appendChild(pRow);
            });
            if (attendees.length > maxShown) {
              var moreEl = txt('div', 'det-row-text', '+' + (attendees.length - maxShown) + ' more');
              moreEl.style.fontSize = '11px';
              moreEl.style.paddingLeft = '30px';
              moreEl.style.color = 'var(--color-fg-muted)';
              pList.appendChild(moreEl);
            }
          } else {
            var org = ev.organizer;
            var orgName = org.displayName || org.email || '?';
            var orgInitials = String(orgName).split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('');
            var orgRow = el('div', 'det-participant');
            orgRow.appendChild(txt('div', 'det-avatar', orgInitials || '?'));
            orgRow.appendChild(txt('div', 'det-participant-name', orgName));
            orgRow.appendChild(txt('span', 'det-participant-role', 'organiser'));
            pList.appendChild(orgRow);
          }

          participantsWrap.appendChild(pList);
          elScroll.appendChild(participantsWrap);
        }

        /* ── Client-link action block (between participants and source) ── */
        if (_sessionsCmd || _recordCmd || _recordQuery) {
          /* Only render block when caps are available (bridge resolved) */
          var linkBlock = buildLinkBlock(ev, titleEl);
          elScroll.appendChild(linkBlock);
        }

        /* ── Source block ── */
        var src = el('div', 'det-source');

        var calSrcRow = el('div', 'det-source-row');
        var calDot = el('div', 'det-source-cal-dot');
        if (ev.calendarColor && typeof ev.calendarColor === 'string') {
          calDot.style.background = ev.calendarColor;
        } else {
          calDot.style.background = 'var(--color-fg-muted)';
          calDot.style.opacity = '0.5';
        }
        calSrcRow.appendChild(calDot);
        if (ev.calendarName && typeof ev.calendarName === 'string') {
          calSrcRow.appendChild(txt('span', 'det-source-cal-name', ev.calendarName));
        }
        src.appendChild(calSrcRow);

        /* Raw provider title — always shown here (never on calendar chips) */
        if (ev.title && typeof ev.title === 'string') {
          src.appendChild(txt('div', 'det-raw-title-label', 'Raw title'));
          src.appendChild(txt('div', 'det-raw-title', ev.title));
        }

        src.appendChild(txt('div', 'det-honesty',
          'This title rides on Google. The client\'s identity shown above comes from your roster, not the raw title.'));

        elScroll.appendChild(src);
      }

      /* ── Re-classify current event on calRev change ─────────────── */
      /* Called when scheduleViewState.calRev changes (roster mutation, calendar/account
       * change). Re-derives classification + _match from caps WITHOUT needing
       * schedule.html to push a new setActiveEvent. */
      function reclassifyAndRender() {
        if (!_currentEv) return;  // no event selected — nothing to do

        var ev = _currentEv;
        var token = _renderToken;  // capture before any async

        if (!_recordQuery) {
          /* Record query unavailable — re-render with existing classification as-is. */
          renderDetail(_currentEv);
          return;
        }

        /* Build participant list from current event (same logic as schedule.html). */
        var participants = [];
        if (ev.attendees) {
          ev.attendees.forEach(function (a) {
            if (!a.self && (a.email || a.name)) {
              participants.push({ email: a.email || null, name: a.name || null });
            }
          });
        }
        if (ev.organizer && ev.organizer.email && !ev.organizer.self) {
          var orgEmail = String(ev.organizer.email).toLowerCase();
          var alreadySelf = ev.attendees && ev.attendees.some(function (a) {
            return a.self && String(a.email || '').toLowerCase() === orgEmail;
          });
          if (!alreadySelf) {
            var alreadyAdded = participants.some(function (p) {
              return p.email && p.email.toLowerCase() === orgEmail;
            });
            if (!alreadyAdded) {
              participants.push({ email: ev.organizer.email, name: (ev.organizer.displayName || null) });
            }
          }
        }

        if (participants.length === 0) {
          /* No external participants → personal. */
          var copy2 = {};
          for (var k2 in ev) { if (Object.prototype.hasOwnProperty.call(ev, k2)) copy2[k2] = ev[k2]; }
          copy2.classification = 'personal';
          copy2._match = null;
          if (_renderToken !== token) return;
          _currentEv = copy2;
          renderDetail(_currentEv);
          return;
        }

        /* First check if this event is linked (highest precedence). */
        var linkedPromise = _sessionsMeetingQuery
          ? _sessionsMeetingQuery.call('listLinkedProvider', {
              providerId: 'google-calendar',
              from: ev.start ? new Date(ev.start).getTime() : 0,
              to:   ev.end   ? new Date(ev.end).getTime()   : 0,
            }).catch(function () { return []; })
          : Promise.resolve([]);

        linkedPromise.then(function (rows) {
          if (_renderToken !== token) return;
          rows = rows || [];
          var linkedRow = null;
          for (var i = 0; i < rows.length; i++) {
            if (rows[i].provider_event_id === (ev.providerEventId || ev.id)) {
              linkedRow = rows[i];
              break;
            }
          }

          if (linkedRow) {
            /* Linked — instant client_session. */
            var copy3 = {};
            for (var k3 in ev) { if (Object.prototype.hasOwnProperty.call(ev, k3)) copy3[k3] = ev[k3]; }
            copy3.classification = 'client_session';
            copy3._match = linkedRow.patient_id ? { matchClientId: linkedRow.patient_id, source: 'linked' } : { source: 'linked' };
            if (_renderToken !== token) return;
            _currentEv = copy3;
            renderDetail(_currentEv);
            return;
          }

          /* Resolve participants sequentially (mirrors schedule.html resolveNext).
           * Precedence: match > suppressed > none. Candidates maps to unclassified grid
           * class but enrichment (_match.candidates) preserved for candidate-resolution UI. */
          var PREC = { 'client_session': 2, 'not_client_session': 1, 'unclassified': 0 };
          var _bestMatch2 = null;

          function resolveNext(idx, best) {
            if (best === 'client_session') return Promise.resolve({ cls: 'client_session' });
            if (idx >= participants.length) return Promise.resolve({ cls: best });
            var p = participants[idx];
            var query = {};
            if (p.email) query.email = p.email;
            if (p.name)  query.name  = p.name;
            return _recordQuery.call('resolveParticipant', query)
              .then(function (result) {
                var outcome = (result && result.outcome) || 'none';
                var cls;
                if (outcome === 'match')           cls = 'client_session';
                else if (outcome === 'suppressed') cls = 'not_client_session';
                else                               cls = 'unclassified'; // candidates + none
                if (PREC[cls] > PREC[best]) {
                  if (outcome === 'match' && result.clientId) {
                    _bestMatch2 = { matchClientId: result.clientId, source: 'resolver' };
                  } else {
                    _bestMatch2 = null;
                  }
                }
                /* Candidates: always capture enrichment regardless of precedence so
                 * the candidate-resolution UI can offer disambiguation. Only set if
                 * no better (client_session) match already captured. */
                if (outcome === 'candidates' && result.candidates && best !== 'client_session' && (!_bestMatch2 || !_bestMatch2.matchClientId)) {
                  _bestMatch2 = { candidates: result.candidates, source: 'resolver' };
                }
                return resolveNext(idx + 1, (PREC[cls] > PREC[best]) ? cls : best);
              })
              .catch(function () { return resolveNext(idx + 1, best); });
          }

          resolveNext(0, 'unclassified').then(function (r) {
            if (_renderToken !== token) return;
            var copy4 = {};
            for (var k4 in ev) { if (Object.prototype.hasOwnProperty.call(ev, k4)) copy4[k4] = ev[k4]; }
            copy4.classification = r.cls;
            copy4._match = _bestMatch2 || null;
            _currentEv = copy4;
            renderDetail(_currentEv);
          }).catch(function () {
            /* Resolve error — leave classification as-is. */
            if (_renderToken !== token) return;
            renderDetail(_currentEv);
          });
        });
      }

      /* ── Apply inbound scheduleViewState ─────────────────────────── */
      function applyScheduleViewState(state) {
        if (!state) return;
        var rev    = typeof state.calRev === 'number' ? state.calRev : 0;
        var view   = (typeof state.view === 'string') ? state.view : _lastSvsView;
        var filter = (state.classFilter && typeof state.classFilter === 'object' && !Array.isArray(state.classFilter))
                     ? state.classFilter : _lastSvsFilter;
        /* Always update view + filter so bumpCalRev sends correct state. */
        _lastSvsView   = view;
        _lastSvsFilter = filter;
        if (rev === _lastCalRev) return;  // calRev unchanged — no re-classify needed
        _lastCalRev = rev;
        reclassifyAndRender();
      }

      /* ── Apply active event (from channel or init/context) ──────── */
      function applyActiveEvent(ev) {
        _currentEv = ev || null;
        _renderToken++;
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { renderDetail(_currentEv); });
        } else {
          renderDetail(_currentEv);
        }
      }

      /* ── Bootstrap ───────────────────────────────────────────────── */
      var boot = window.__viewBoot;

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        boot.applyTheme(d);
        /* Read activeEvent from init + context messages. */
        if (d.kind === 'init' || d.kind === 'context') {
          if (Object.prototype.hasOwnProperty.call(d, 'activeEvent')) {
            applyActiveEvent(d.activeEvent);
          }
          /* Seed scheduleViewState from init/context so bumpCalRev + re-classify are correct. */
          if (d.scheduleViewState) {
            var svs = d.scheduleViewState;
            if (_lastCalRev === -1) {
              /* First init — seed without triggering re-classify (event just set above). */
              if (typeof svs.calRev === 'number') _lastCalRev = svs.calRev;
              if (typeof svs.view === 'string') _lastSvsView = svs.view;
              if (svs.classFilter && typeof svs.classFilter === 'object' && !Array.isArray(svs.classFilter)) {
                _lastSvsFilter = svs.classFilter;
              }
            } else {
              applyScheduleViewState(svs);
            }
          }
        }
        /* Dedicated push from onDidChange. */
        if (d.kind === 'activeEvent') {
          applyActiveEvent(d.event || null);
        }
        /* calRev push — re-classify current event. */
        if (d.kind === 'scheduleViewState' && d.state) {
          applyScheduleViewState(d.state);
        }
      });

      boot.awaitBridge().then(function (soamView) {
        _soamView = soamView;

        elBridgeWait.classList.add('hidden');
        elRoot.style.display = '';

        boot.applyCodicons();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            elEmptyIcon.innerHTML = icon('calendar', 22);
          });
        } else {
          elEmptyIcon.innerHTML = icon('calendar', 22);
        }

        /* Bind caps (best-effort; view-binds are NOT manifest-gated) */
        soamView.bindCommand('sessions.meeting', '1.0')
          .then(function (p) { _sessionsCmd = p; })
          .catch(function () { /* unavailable (e.g. locked) */ });

        soamView.bindQuery('sessions.meeting.query', '1.0')
          .then(function (p) { _sessionsMeetingQuery = p; })
          .catch(function () { /* unavailable */ });

        soamView.bindCommand('record.patient', '1.0')
          .then(function (p) { _recordCmd = p; })
          .catch(function () { /* unavailable */ });

        soamView.bindQuery('record.patient.query', '1.0')
          .then(function (p) {
            _recordQuery = p;
            /* Re-render once record query is ready — link block needs it */
            if (_currentEv) renderDetail(_currentEv);
          })
          .catch(function () { /* unavailable */ });

        /* Initial render — may have been set by init/context message before this runs. */
        renderDetail(_currentEv);

      }).catch(function (err) {
        elBridgeWait.textContent = 'Bridge error: ' + ((err && err.message) ? err.message : String(err));
      });

    })();
    </script>
  </body>
</html>
