<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Event</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

      /* ── Design tokens (defaults — injected via postMessage from host) ─ */
      :root {
        color-scheme: light dark;

        --font-sans:    'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono:    ui-monospace, Consolas, 'Courier New', monospace;

        /* Surface */
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        /* Foreground */
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        /* Borders */
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        /* Accent */
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        /* Semantic */
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --color-info:    #5ac0de;

        --radius-sm:   4px;
        --radius-md:   7px;
        --radius-card: 10px;

        --transition: 130ms ease;

        /* Classification colors */
        --cls-client-color:      #5ac85a;
        --cls-probable-color:    #f4a623;
        --cls-not-color:         #636366;
        --cls-personal-color:    #5ac0de;
        --cls-unclassified-color: #636366;
      }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Bridge wait ────────────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      #bridge-wait.hidden { display: none; }
      .spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Root ──────────────────────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Empty / no-event state ─────────────────────────────────── */
      #empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        color: var(--color-fg-muted);
        font-size: 12px;
        padding: 24px;
        text-align: center;
      }
      #empty-state.hidden { display: none; }

      /* ── Detail scroll container ─────────────────────────────────── */
      #detail-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }
      #detail-scroll.hidden { display: none; }

      /* ── Header ──────────────────────────────────────────────────── */
      .det-header {
        padding: 14px 14px 10px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .det-header-top {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .det-title {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--color-fg-primary);
        word-break: break-word;
      }
      .det-meta {
        font-size: 11px;
        color: var(--color-fg-muted);
        line-height: 1.4;
      }

      /* ── Classification banner ───────────────────────────────────── */
      .det-cls-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        font-size: 12px;
      }
      .det-cls-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .det-cls-label {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }
      .det-cls-badge {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        border-radius: 3px;
        padding: 1px 5px;
        flex-shrink: 0;
        border: 1px solid transparent;
      }

      /* Classification color variants */
      .cls-client    { --cls-color: var(--cls-client-color); }
      .cls-probable  { --cls-color: var(--cls-probable-color); }
      .cls-not       { --cls-color: var(--cls-not-color); }
      .cls-personal  { --cls-color: var(--cls-personal-color); }
      .cls-unclassified { --cls-color: var(--cls-unclassified-color); }

      .det-cls-dot.cls-client      { background: var(--cls-client-color); }
      .det-cls-dot.cls-probable    { background: var(--cls-probable-color); }
      .det-cls-dot.cls-not         { background: var(--cls-not-color); }
      .det-cls-dot.cls-personal    { background: var(--cls-personal-color); }
      .det-cls-dot.cls-unclassified { background: var(--cls-unclassified-color); }

      .det-cls-badge.cls-client {
        color: var(--cls-client-color);
        border-color: color-mix(in srgb, var(--cls-client-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-client-color) 10%, transparent);
      }
      .det-cls-badge.cls-probable {
        color: var(--cls-probable-color);
        border-color: color-mix(in srgb, var(--cls-probable-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-probable-color) 10%, transparent);
        border-style: dashed;
      }
      .det-cls-badge.cls-not {
        color: var(--cls-not-color);
        border-color: color-mix(in srgb, var(--cls-not-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-not-color) 10%, transparent);
      }
      .det-cls-badge.cls-personal {
        color: var(--cls-personal-color);
        border-color: color-mix(in srgb, var(--cls-personal-color) 40%, transparent);
        background: color-mix(in srgb, var(--cls-personal-color) 10%, transparent);
      }
      .det-cls-badge.cls-unclassified {
        color: var(--cls-unclassified-color);
        border-color: color-mix(in srgb, var(--cls-unclassified-color) 30%, transparent);
        background: transparent;
      }

      /* ── Detail body ─────────────────────────────────────────────── */
      .det-body {
        padding: 10px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .det-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        min-height: 20px;
      }
      .det-row-icon {
        color: var(--color-fg-muted);
        flex-shrink: 0;
        margin-top: 1px;
        display: inline-flex;
        align-items: center;
        min-width: 14px;
      }
      .det-row-text {
        color: var(--color-fg-secondary);
        line-height: 1.4;
        flex: 1;
        min-width: 0;
        word-break: break-word;
      }
      .det-row-text strong {
        color: var(--color-fg-primary);
        font-weight: 500;
      }
      .det-duration-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        color: var(--color-fg-secondary);
        background: var(--color-surface-base);
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        border-radius: 3px;
        padding: 1px 5px;
        margin-left: 6px;
      }

      /* ── Join row ────────────────────────────────────────────────── */
      .det-join-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--color-fg-secondary);
        margin-bottom: 2px;
      }
      .det-join-url {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        color: var(--color-accent);
        user-select: text;
        cursor: text;
        word-break: break-all;
      }
      .det-copy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: var(--radius-sm);
        color: var(--color-fg-muted);
        flex-shrink: 0;
        transition: background var(--transition), color var(--transition);
        cursor: pointer;
        border: none;
        background: none;
        font: inherit;
        margin-left: 4px;
        vertical-align: middle;
      }
      .det-copy-btn:hover { background: var(--color-surface-active); color: var(--color-fg-primary); }
      .det-copy-btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 1px; }
      .det-copy-btn.copied { color: var(--color-success); }
      .det-copy-confirm {
        font-size: 10px;
        color: var(--color-success);
        margin-left: 4px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .det-copy-confirm.show { opacity: 1; }

      /* ── Divider ─────────────────────────────────────────────────── */
      .det-divider {
        height: 1px;
        background: color-mix(in srgb, var(--color-border) 50%, transparent);
        margin: 4px 0 2px;
      }

      /* ── Section label ───────────────────────────────────────────── */
      .det-section-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--color-fg-muted);
        margin-bottom: 4px;
        padding-left: 23px;
      }

      /* ── Participants ─────────────────────────────────────────────── */
      .det-participants {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .det-participant {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
      }
      .det-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--color-accent) 20%, var(--color-surface-base) 80%);
        border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
        color: var(--color-accent);
        font-size: 9px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      .det-participant-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--color-fg-secondary);
      }
      .det-participant-role {
        font-size: 10px;
        font-weight: 500;
        color: var(--color-fg-muted);
        background: color-mix(in srgb, var(--color-surface-base) 80%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
        border-radius: 3px;
        padding: 0 4px;
        flex-shrink: 0;
        line-height: 1.6;
      }

      /* ── Source block ─────────────────────────────────────────────── */
      .det-source {
        margin: 4px 14px 16px;
        background: color-mix(in srgb, var(--color-surface-base) 60%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .det-source-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
      }
      .det-source-cal-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .det-source-cal-name {
        color: var(--color-fg-secondary);
        font-weight: 500;
      }
      .det-raw-title-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--color-fg-muted);
      }
      .det-raw-title {
        font-size: 12px;
        color: var(--color-fg-secondary);
        word-break: break-word;
        font-style: italic;
      }
      .det-honesty {
        font-size: 10.5px;
        color: var(--color-fg-muted);
        line-height: 1.5;
        border-top: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        padding-top: 6px;
      }

      /* ── Calendar badge ──────────────────────────────────────────── */
      .det-cal-badge {
        font-size: 11px;
        color: var(--color-fg-muted);
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        border-radius: 3px;
        padding: 1px 5px;
      }

    </style>
  </head>
  <body>
    <div id="bridge-wait"><span class="spinner"></span> Connecting…</div>
    <div id="root" style="display:none">
      <div id="empty-state">
        <div style="color:var(--color-fg-muted);opacity:0.5" id="empty-icon"></div>
        <div>Select an event to see details</div>
      </div>
      <div id="detail-scroll" class="hidden"></div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── Icon helper ─────────────────────────────────────────────── */
      var ICON_MAP = {
        'clock':        'clockface',
        'calendar':     'calendar',
        'location':     'location',
        'globe':        'globe',
        'person':       'account',
        'copy':         'copy',
        'check':        'check',
        'layers':       'layers',
      };
      function icon(name, size) {
        var n = ICON_MAP[name] || name;
        return window.codicon ? window.codicon(n, size || 13) : '';
      }

      /* ── el / txt DOM helpers ────────────────────────────────────── */
      function el(tag, cls) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      }
      function txt(tag, cls, text) {
        var e = el(tag, cls);
        e.textContent = text;
        return e;
      }

      /* ── Clipboard fallback ──────────────────────────────────────── */
      function fallbackCopy(text, onSuccess) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok && onSuccess) onSuccess();
        } catch (err) { /* silently ignore */ }
      }

      /* ── Date / time utilities ───────────────────────────────────── */
      var MONTH_NAMES = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December'];
      var DAY_NAMES   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

      function fmtTime(isoStr) {
        if (!isoStr || isoStr.length <= 10) return 'All day';
        try {
          return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } catch (e) { return isoStr; }
      }

      function fmtDateLong(isoStr) {
        if (!isoStr) return '';
        try {
          var d = new Date(isoStr.length <= 10 ? isoStr + 'T00:00:00' : isoStr);
          return DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
        } catch (e) { return isoStr; }
      }

      function fmtDuration(minutes) {
        if (minutes <= 0) return '';
        var h = Math.floor(minutes / 60);
        var m = minutes % 60;
        if (h > 0 && m > 0) return h + ' hr ' + m + ' min';
        if (h > 0) return h === 1 ? '1 hr' : h + ' hr';
        return m + ' min';
      }

      /* ── Classification maps ─────────────────────────────────────── */
      var CLS_CLASS = {
        'client_session':          'cls-client',
        'probable_client_session': 'cls-probable',
        'not_client_session':      'cls-not',
        'personal':                'cls-personal',
        'unclassified':            'cls-unclassified',
      };
      var CLS_LABEL = {
        'client_session':          'CLIENT',
        'probable_client_session': 'PROBABLE',
        'not_client_session':      'EXCLUDED',
        'personal':                'PERSONAL',
        'unclassified':            'UNCLASSIFIED',
      };
      var CLS_HUMAN = {
        'client_session':          'Client session',
        'probable_client_session': 'Probable client',
        'not_client_session':      'Not a client',
        'personal':                'Personal · admin',
        'unclassified':            'Unrecognised',
      };
      function clsClass(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_CLASS[c] || 'cls-unclassified';
      }
      function clsLabel(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_LABEL[c] || 'UNCLASSIFIED';
      }
      function clsHuman(ev) {
        var c = (ev && ev.classification) || 'unclassified';
        return CLS_HUMAN[c] || 'Unrecognised';
      }

      /* ── State ───────────────────────────────────────────────────── */
      var _currentEv = null;

      /* ── DOM refs ─────────────────────────────────────────────────── */
      var elBridgeWait  = document.getElementById('bridge-wait');
      var elRoot        = document.getElementById('root');
      var elEmpty       = document.getElementById('empty-state');
      var elEmptyIcon   = document.getElementById('empty-icon');
      var elScroll      = document.getElementById('detail-scroll');

      /* ── Render ───────────────────────────────────────────────────── */
      function renderDetail(ev) {
        elScroll.innerHTML = '';

        if (!ev) {
          elEmpty.classList.remove('hidden');
          elScroll.classList.add('hidden');
          return;
        }

        elEmpty.classList.add('hidden');
        elScroll.classList.remove('hidden');

        var cls = (ev.classification) || 'unclassified';
        var clsCls = clsClass(ev);

        /* ── Header ── */
        var hdr = el('div', 'det-header');
        var hdrTop = el('div', 'det-header-top');

        /* Title: use roster identity if linked/probable, raw title as fallback.
         * For display in the header we show the raw title (this is the aux slot;
         * the Calendar chips never show raw title, but here the user is inspecting
         * the event directly). PHI via textContent only. */
        var titleStr = (typeof ev.title === 'string' && ev.title.trim()) ? ev.title : '(No title)';
        var titleEl = txt('div', 'det-title', titleStr);
        hdrTop.appendChild(titleEl);
        hdr.appendChild(hdrTop);

        /* Date + start time meta line */
        var dateStr = ev.start ? fmtDateLong(ev.start) : '';
        var timeStr = ev.allDay ? 'All day' : fmtTime(ev.start);
        if (dateStr || timeStr) {
          var metaStr = dateStr ? dateStr + (timeStr ? '  ·  ' + timeStr : '') : timeStr;
          var metaEl = txt('div', 'det-meta', metaStr);
          hdr.appendChild(metaEl);
        }
        elScroll.appendChild(hdr);

        /* ── Classification banner ── */
        var banner = el('div', 'det-cls-banner');
        var dot = el('div', 'det-cls-dot ' + clsCls);
        var clsLbl = txt('div', 'det-cls-label', clsHuman(ev));
        var badge = txt('div', 'det-cls-badge ' + clsCls, clsLabel(ev));
        banner.appendChild(dot);
        banner.appendChild(clsLbl);
        banner.appendChild(badge);
        elScroll.appendChild(banner);

        /* ── Detail body ── */
        var body = el('div', 'det-body');

        /* Time row */
        var timeRow = el('div', 'det-row');
        var timeIco = el('span', 'det-row-icon');
        timeIco.innerHTML = icon('clock', 13);
        var timeTxt = el('span', 'det-row-text');
        if (ev.allDay) {
          timeTxt.textContent = 'All day';
        } else {
          /* Use innerHTML for the bold time range (no user data, safe format strings). */
          var t1 = fmtTime(ev.start);
          var t2 = ev.end ? fmtTime(ev.end) : '';
          timeTxt.innerHTML = '<strong>' + t1 + (t2 ? ' – ' + t2 : '') + '</strong>';
          if (ev.start && ev.end && String(ev.start).length > 10 && String(ev.end).length > 10) {
            var startMs = new Date(ev.start).getTime();
            var endMs   = new Date(ev.end).getTime();
            var durMin  = Math.round((endMs - startMs) / 60000);
            if (durMin > 0) {
              var durBadge = txt('span', 'det-duration-badge', fmtDuration(durMin));
              timeTxt.appendChild(durBadge);
            }
          }
        }
        timeRow.appendChild(timeIco);
        timeRow.appendChild(timeTxt);
        body.appendChild(timeRow);

        /* Calendar row (display name from event) */
        if (ev.calendarName) {
          var calRow = el('div', 'det-row');
          var calIco = el('span', 'det-row-icon');
          calIco.innerHTML = icon('layers', 13);
          var calTxt = el('div', 'det-row-text');
          calTxt.appendChild(txt('span', 'det-cal-badge', ev.calendarName));
          calRow.appendChild(calIco);
          calRow.appendChild(calTxt);
          body.appendChild(calRow);
        }

        /* Location row */
        if (ev.location && typeof ev.location === 'string') {
          var locRow = el('div', 'det-row');
          var locIco = el('span', 'det-row-icon');
          locIco.innerHTML = icon('location', 13);
          var locTxt = txt('span', 'det-row-text', ev.location);
          locRow.appendChild(locIco);
          locRow.appendChild(locTxt);
          body.appendChild(locRow);
        }

        /* Join row (meeting link — display + copy, NO working button yet — A2) */
        if (ev.meetingLink && typeof ev.meetingLink === 'string') {
          var joinRow = el('div', 'det-row');
          var joinIco = el('span', 'det-row-icon');
          joinIco.innerHTML = icon('globe', 13);
          var joinTxt = el('div', 'det-row-text');
          joinTxt.appendChild(txt('div', 'det-join-label', 'Meeting link'));

          var joinUrlRow = el('div', '');
          joinUrlRow.style.display = 'flex';
          joinUrlRow.style.alignItems = 'center';
          joinUrlRow.style.gap = '4px';
          joinUrlRow.style.flexWrap = 'wrap';

          var joinUrlEl = txt('span', 'det-join-url', ev.meetingLink);
          joinUrlRow.appendChild(joinUrlEl);

          /* Copy button (execCommand fallback for opaque-origin sandbox) */
          var copyBtn = el('button', 'det-copy-btn');
          copyBtn.type = 'button';
          copyBtn.title = 'Copy link';
          copyBtn.innerHTML = icon('copy', 13);
          var copyConfirm = txt('span', 'det-copy-confirm', 'Copied');
          var copyTimer = null;

          (function (url) {
            copyBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              function showCopied() {
                copyBtn.innerHTML = icon('check', 13);
                copyBtn.classList.add('copied');
                copyConfirm.classList.add('show');
                if (copyTimer) clearTimeout(copyTimer);
                copyTimer = setTimeout(function () {
                  copyBtn.innerHTML = icon('copy', 13);
                  copyBtn.classList.remove('copied');
                  copyConfirm.classList.remove('show');
                }, 1200);
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(showCopied).catch(function () {
                  fallbackCopy(url, showCopied);
                });
              } else {
                fallbackCopy(url, showCopied);
              }
            });
          }(ev.meetingLink));

          joinUrlRow.appendChild(copyBtn);
          joinUrlRow.appendChild(copyConfirm);
          joinTxt.appendChild(joinUrlRow);
          joinRow.appendChild(joinIco);
          joinRow.appendChild(joinTxt);
          body.appendChild(joinRow);
        }

        elScroll.appendChild(body);

        /* ── Participants ── */
        var hasAttendees = ev.attendees && ev.attendees.length > 0;
        var hasOrganizerOnly = !hasAttendees && ev.organizer && (ev.organizer.email || ev.organizer.displayName);
        if (hasAttendees || hasOrganizerOnly) {
          var participantsWrap = el('div', 'det-body');
          participantsWrap.style.paddingTop = '0';

          participantsWrap.appendChild(el('div', 'det-divider'));

          var secLbl = el('div', 'det-section-label');
          secLbl.innerHTML = icon('person', 11) + ' Participants';
          participantsWrap.appendChild(secLbl);

          var pList = el('div', 'det-participants');

          var orgEmail = ev.organizer && ev.organizer.email ? String(ev.organizer.email).toLowerCase() : null;
          function isOrganiser(a) {
            return a.organizer === true || (orgEmail && String(a.email || '').toLowerCase() === orgEmail);
          }

          if (hasAttendees) {
            var maxShown = 8;
            var attendees = ev.attendees;
            var shown = attendees.slice(0, maxShown);
            shown.forEach(function (a) {
              var nameStr = a.name || a.email || '?';
              var initials = String(nameStr)
                .split(/\s+/)
                .slice(0, 2)
                .map(function (w) { return w.charAt(0); })
                .join('');

              var pRow = el('div', 'det-participant');
              var avatar = txt('div', 'det-avatar', initials || '?');
              var pName  = txt('div', 'det-participant-name', a.name || a.email || 'Unknown');
              pRow.appendChild(avatar);
              pRow.appendChild(pName);
              if (a.self) pRow.appendChild(txt('span', 'det-participant-role', 'you'));
              if (isOrganiser(a)) pRow.appendChild(txt('span', 'det-participant-role', 'organiser'));
              pList.appendChild(pRow);
            });
            if (attendees.length > maxShown) {
              var moreEl = txt('div', 'det-row-text', '+' + (attendees.length - maxShown) + ' more');
              moreEl.style.fontSize = '11px';
              moreEl.style.paddingLeft = '30px';
              moreEl.style.color = 'var(--color-fg-muted)';
              pList.appendChild(moreEl);
            }
          } else {
            var org = ev.organizer;
            var orgName = org.displayName || org.email || '?';
            var orgInitials = String(orgName).split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('');
            var orgRow = el('div', 'det-participant');
            orgRow.appendChild(txt('div', 'det-avatar', orgInitials || '?'));
            orgRow.appendChild(txt('div', 'det-participant-name', orgName));
            orgRow.appendChild(txt('span', 'det-participant-role', 'organiser'));
            pList.appendChild(orgRow);
          }

          participantsWrap.appendChild(pList);
          elScroll.appendChild(participantsWrap);
        }

        /* ── Source block ── */
        /* Shows calendar origin + raw provider title (verbatim) + honesty note.
         * Raw title displayed ONLY here — never on calendar chips (roster identity there).
         * This is the user's own consented calendar (read-side ADR-313). */
        var src = el('div', 'det-source');

        /* Calendar source row: color dot + calendar name */
        var calSrcRow = el('div', 'det-source-row');
        var calDot = el('div', 'det-source-cal-dot');
        if (ev.calendarColor && typeof ev.calendarColor === 'string') {
          calDot.style.background = ev.calendarColor;
        } else {
          calDot.style.background = 'var(--color-fg-muted)';
          calDot.style.opacity = '0.5';
        }
        calSrcRow.appendChild(calDot);
        if (ev.calendarName && typeof ev.calendarName === 'string') {
          calSrcRow.appendChild(txt('span', 'det-source-cal-name', ev.calendarName));
        }
        src.appendChild(calSrcRow);

        /* Raw provider title */
        if (ev.title && typeof ev.title === 'string') {
          src.appendChild(txt('div', 'det-raw-title-label', 'Raw title'));
          src.appendChild(txt('div', 'det-raw-title', ev.title));
        }

        /* Honesty note */
        src.appendChild(txt('div', 'det-honesty',
          'This title rides on Google. The client’s identity shown above comes from your roster, not the raw title.'));

        elScroll.appendChild(src);
      }

      /* ── Apply active event (from channel or init/context) ──────── */
      function applyActiveEvent(ev) {
        _currentEv = ev || null;
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { renderDetail(_currentEv); });
        } else {
          renderDetail(_currentEv);
        }
      }

      /* ── Bootstrap ───────────────────────────────────────────────── */
      var boot = window.__viewBoot;

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        boot.applyTheme(d);
        /* Read activeEvent from init + context messages. */
        if (d.kind === 'init' || d.kind === 'context') {
          if (Object.prototype.hasOwnProperty.call(d, 'activeEvent')) {
            applyActiveEvent(d.activeEvent);
          }
        }
        /* Dedicated push from onDidChange. */
        if (d.kind === 'activeEvent') {
          applyActiveEvent(d.event || null);
        }
      });

      boot.awaitBridge().then(function () {
        elBridgeWait.classList.add('hidden');
        elRoot.style.display = '';

        boot.applyCodicons();
        /* Seed codicon in empty-state icon after codicons are loaded. */
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            elEmptyIcon.innerHTML = icon('calendar', 22);
          });
        } else {
          elEmptyIcon.innerHTML = icon('calendar', 22);
        }

        /* Initial render — may have been set by init/context message before this runs. */
        renderDetail(_currentEv);

      }).catch(function (err) {
        elBridgeWait.textContent = 'Bridge error: ' + ((err && err.message) ? err.message : String(err));
      });

    })();
    </script>
  </body>
</html>
