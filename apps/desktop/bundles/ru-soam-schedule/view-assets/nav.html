<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Schedule</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: var(
          --font-sans,
          'Inter Tight',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif
        );
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-panel, #1c1c1f);
        color: var(--color-fg-primary, #f2f2f7);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Bridge wait overlay ───────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel, #1c1c1f);
        z-index: 100;
        font-size: 12px;
        color: var(--color-fg-muted, #636366);
      }
      #bridge-wait.hidden {
        display: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      #root.hidden {
        display: none;
      }

      /* ── Activity title ────────────────────────────────── */
      #activity-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--color-border, #3a3a3c);
        flex-shrink: 0;
      }
      .activity-title-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-fg-secondary, #aeaeb2);
      }
      .activity-title-period {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--color-fg-muted, #636366);
      }

      /* ── Scrollable body ───────────────────────────────── */
      #scroll-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted, #636366) 30%, transparent)
          transparent;
      }

      /* ── Accounts section — pinned to bottom ──────────── */
      #accounts-section {
        margin-top: auto;
        padding-top: 4px;
      }

      /* ── Section header ────────────────────────────────── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 6px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--color-fg-muted, #636366);
        /* border-bottom: 1px solid var(--color-border, #3a3a3c); */
      }
      .section-header-label {
        flex: 1;
      }

      /* Small "+" icon button in section header */
      .btn-section-add {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 3px;
        font-size: 14px;
        line-height: 1;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        color: var(--color-fg-muted, #636366);
        background: transparent;
        cursor: pointer;
        transition:
          background 130ms ease,
          color 130ms ease;
      }
      .btn-section-add:hover {
        background: var(--color-surface-active, #2a2d26);
        color: var(--color-fg-secondary, #aeaeb2);
      }

      /* ── Section header icon-button group ─────────────── */
      .section-header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* ── Flat calendar list ────────────────────────────── */
      #cals-block {
        padding: 4px 0;
      }

      .cal-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        cursor: pointer;
        user-select: none;
        transition: background 110ms ease;
      }
      .cal-row:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 7%, transparent);
      }
      .cal-row.active {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 9%, transparent);
      }
      .cal-row.active:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 13%, transparent);
      }

      /* Disabled calendar row (account disconnected) */
      .cal-row--disabled {
        cursor: default;
        opacity: 0.45;
      }
      .cal-row--disabled:hover {
        background: transparent;
      }

      /* Merged colored-tick checkbox */
      .cal-checkbox {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 130ms ease,
          border-color 130ms ease;
        /* off-state: thin outline in calendar color, transparent fill */
        border-width: 1.5px;
        border-style: solid;
      }
      /* Tick mark — only rendered when .on via the SVG path */
      .cal-checkbox svg {
        display: none;
        width: 9px;
        height: 9px;
        flex-shrink: 0;
      }
      .cal-checkbox.on svg {
        display: block;
      }

      .cal-name {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--color-fg-secondary, #aeaeb2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Empty state */
      .cals-empty {
        padding: 10px 12px;
        font-size: 11.5px;
        color: var(--color-fg-muted, #636366);
        font-style: italic;
      }

      /* ── Classification filter section ─────────────────── */
      #classif-block {
        padding: 4px 0;
      }

      .classif-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        cursor: pointer;
        user-select: none;
        border-radius: 0;
        transition: background 110ms ease;
      }
      .classif-row:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 7%, transparent);
      }
      /* Active = all visible (no focus set) OR this row is the focused class. */
      .classif-row.active {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 9%, transparent);
      }
      .classif-row.active:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 13%, transparent);
      }

      .classif-label {
        flex: 1;
        font-size: 12px;
        color: var(--color-fg-secondary, #aeaeb2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Muted when another class is focused (row is not active) */
      .classif-row:not(.active) .classif-label {
        color: var(--color-fg-muted, #636366);
      }

      .classif-count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--color-fg-muted, #636366);
        min-width: 18px;
        text-align: right;
        flex-shrink: 0;
      }
      .classif-row.active .classif-count {
        color: var(--color-fg-secondary, #aeaeb2);
      }

      /* ── Accounts section ──────────────────────────────── */
      #accounts-block {
        padding: 4px 0;
      }

      .acct-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        cursor: default;
        user-select: none;
        transition: background 110ms ease;
      }
      .acct-row:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 7%, transparent);
      }
      .acct-row.active {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 9%, transparent);
      }
      .acct-row.active:hover {
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 13%, transparent);
      }

      .acct-row-icon {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-fg-muted, #636366);
        font-size: 11px;
        font-weight: 700;
        border: 1.5px solid var(--color-fg-muted, #636366);
        border-radius: 50%;
        line-height: 1;
      }

      .acct-row-info {
        flex: 1;
        min-width: 0;
      }

      .acct-row-email {
        font-size: 12px;
        color: var(--color-fg-secondary, #aeaeb2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .acct-row-status {
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acct-row-status--connected {
        color: var(--color-success, #5ac85a);
      }
      .acct-row-status--disconnected {
        color: var(--color-fg-muted, #636366);
      }

      .acct-row-btn {
        flex-shrink: 0;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 3px;
        color: var(--color-fg-muted, #636366);
        border: 1px solid color-mix(in srgb, var(--color-border, #3a3a3c) 70%, transparent);
        background: transparent;
        cursor: pointer;
        transition:
          color 110ms ease,
          background 110ms ease;
        white-space: nowrap;
      }
      .acct-row-btn:hover {
        color: var(--color-fg-secondary, #aeaeb2);
        background: color-mix(in srgb, var(--color-fg-muted, #636366) 10%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="bridge-wait">Connecting…</div>
    <div id="root" class="hidden">
      <!-- Activity title -->
      <div id="activity-title">
        <span class="activity-title-label">Schedule</span>
        <span class="activity-title-period" id="activity-period"></span>
      </div>

      <!-- Scrollable body -->
      <div id="scroll-body">
        <!-- Calendars section -->
        <div class="section-header">
          <span class="section-header-label">Calendars</span>
          <div class="section-header-actions">
            <button
              class="btn-section-add"
              id="btn-open-schedule"
              type="button"
              title="Open calendar"
            >
              <span data-codicon="open-in-window" data-size="14"></span>
            </button>
            <button
              class="btn-section-add"
              id="btn-add-calendar"
              type="button"
              title="Add calendar"
            >
              <span data-codicon="add" data-size="14"></span>
            </button>
          </div>
        </div>

        <div id="cals-block"></div>

        <!-- Filter by Classification section -->
        <div class="section-header" style="margin-top: 4px">
          <span class="section-header-label">Filter by Classification</span>
        </div>
        <div id="classif-block"></div>

        <!-- Accounts section — bottom-pinned via margin-top:auto on wrapper -->
        <div id="accounts-section">
          <div class="section-header">
            <span class="section-header-label">Accounts</span>
          </div>
          <div id="accounts-block"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        /* ── Classification definitions ─────────────────────────────────────── *
         * Fixed order. No per-class color swatch — color now encodes calendar.   */
        var CLASSIFICATIONS = [
          { id: 'client_session',     label: 'Client sessions' },
          { id: 'not_client_session', label: 'Excluded' },
          { id: 'personal',          label: 'Personal' },
          { id: 'unclassified',      label: 'Unclassified' },
        ];

        /* ── Module state ────────────────────────────────────────────────────── */
        var currentView = 'week';
        var currentRev = 0;
        var _lastSeenRev = -1; /* tracks calRev to detect external increments */
        var _classFilter = null; /* string | null; null = all visible, string = focused class id */
        var _counts = {}; /* Record<classId, number> from scheduleCounts */
        var queryCap = null;
        var cmdCap = null;
        var calendars = [];
        var accounts = [];
        var accountStateMap = {}; /* accountId -> connectionState */
        var accountEmailMap = {}; /* accountId -> email */
        var boot = window.__viewBoot;
        /* __viewQuery observer handles for calendar list + accounts list.
         * Created once after cap bind; destroyed + recreated if caps re-bind. */
        var _accountsObs = null;
        var _calsObs = null;

        /* ── DOM refs ─────────────────────────────────────────────────────────── */
        var elBridgeWait = document.getElementById('bridge-wait');
        var elRoot = document.getElementById('root');
        var elPeriod = document.getElementById('activity-period');
        var elBtnAddCal = document.getElementById('btn-add-calendar');
        var elBtnOpenSched = document.getElementById('btn-open-schedule');
        var elCalsBlock = document.getElementById('cals-block');
        var elClassifBlock = document.getElementById('classif-block');
        var elAccountsBlock = document.getElementById('accounts-block');

        /* ── calRev bump (calendar mutations only) ───────────────────────────── */
        function bumpCalRev() {
          currentRev = currentRev + 1;
          if (window.soamView && window.soamView.setScheduleViewState) {
            window.soamView.setScheduleViewState({
              view: currentView,
              calRev: currentRev,
              classFilter: _classFilter,
            });
          }
        }

        /* ── Write focused class (NO calRev bump) ────────────────────────────── */
        /* focusedClass: null = all visible; string = show only that class. */
        function writeFocusedClass(focusedClass) {
          _classFilter = focusedClass;
          if (window.soamView && window.soamView.setScheduleViewState) {
            window.soamView.setScheduleViewState({
              view: currentView,
              calRev: currentRev,
              classFilter: _classFilter,
            });
          }
          renderClassifications();
        }

        /* ── Load data from caps via __viewQuery observers ──────────────────── */
        /* Each observer is keyed by cap namespace + operation.
         * Both subscribe callbacks rebuild both panels so state stays consistent
         * (accounts data needed by buildCalRow to check disabled state). */
        function applyAccountsData(data) {
          accounts = data || [];
          accountStateMap = {};
          accountEmailMap = {};
          accounts.forEach(function (a) {
            accountStateMap[a.id] = a.connectionState;
            if (a.email) accountEmailMap[a.id] = a.email;
          });
          renderCalendars();
          renderAccounts();
        }

        function applyCalsData(data) {
          calendars = data || [];
          renderCalendars();
        }

        function destroyDataObservers() {
          if (_accountsObs) { _accountsObs.destroy(); _accountsObs = null; }
          if (_calsObs) { _calsObs.destroy(); _calsObs = null; }
        }

        function loadData() {
          if (!queryCap) return;

          /* Tear down any pre-existing observers before (re)creating. */
          destroyDataObservers();

          /* Accounts observer — staleTime 30s (account list changes infrequently). */
          _accountsObs = window.__viewQuery.observeQuery({
            queryKey: ['schedule.calendar', 'listAccounts'],
            queryFn: function () { return queryCap.call('listAccounts'); },
            staleTime: 30000,
          });
          _accountsObs.subscribe(function (result) {
            if (result.status === 'success') {
              applyAccountsData(result.data);
            } else if (result.status === 'error') {
              applyAccountsData([]);
            }
          });

          /* Calendars observer — staleTime 30s. */
          _calsObs = window.__viewQuery.observeQuery({
            queryKey: ['schedule.calendar', 'listAddedCalendars'],
            queryFn: function () { return queryCap.call('listAddedCalendars'); },
            staleTime: 30000,
          });
          _calsObs.subscribe(function (result) {
            if (result.status === 'success') {
              applyCalsData(result.data);
            } else if (result.status === 'error') {
              applyCalsData([]);
            }
          });
        }

        /* ── Render flat calendar list ───────────────────────────────────────── */
        function renderCalendars() {
          elCalsBlock.innerHTML = '';

          if (calendars.length === 0) {
            var em = document.createElement('div');
            em.className = 'cals-empty';
            em.textContent = 'No calendars yet — click + to add one.';
            elCalsBlock.appendChild(em);
            return;
          }

          calendars.forEach(function (cal) {
            elCalsBlock.appendChild(buildCalRow(cal));
          });
        }

        /* ── Build single calendar row ───────────────────────────────────────── */
        function buildCalRow(cal) {
          var color = cal.color || '#a0a0a8';
          var isOn = !!cal.selected;
          var disabled = accountStateMap[cal.accountId] !== 'connected';
          var emailHint = accountEmailMap[cal.accountId];
          var tooltip = emailHint ? emailHint + ' / ' + cal.displayName : cal.displayName;

          var row = document.createElement('div');
          row.className = 'cal-row' + (disabled ? ' cal-row--disabled' : '') + (isOn && !disabled ? ' active' : '');
          row.title = tooltip;

          /* Click row or checkbox → toggle selected (no-op when account disconnected).
           * Uses __viewQuery.runMutation for optimistic cache flip:
           *   optimistic: flip cal.selected in listAddedCalendars cache → immediate UI update
           *   on settle: invalidate ['schedule.calendar'] → observers refetch from source
           *   bumpCalRev: kept after success — cross-iframe signal for schedule.html to
           *               invalidate its events query (iframes don't share store.changed). */
          row.addEventListener('click', function () {
            if (disabled) return;
            if (!cmdCap) return;
            var newSelected = !cal.selected;
            window.__viewQuery.runMutation({
              run: function () { return cmdCap.call('updateCalendar', cal.id, { selected: newSelected }); },
              optimistic: function (client) {
                /* Patch the listAddedCalendars cache entry for instant UI feedback. */
                var key = ['schedule.calendar', 'listAddedCalendars'];
                var prev = client.getQueryData(key);
                if (Array.isArray(prev)) {
                  var patched = prev.map(function (c) {
                    return c.id === cal.id ? Object.assign({}, c, { selected: newSelected }) : c;
                  });
                  client.setQueryData(key, patched);
                  /* Return rollback fn to restore previous data on error. */
                  return function () { client.setQueryData(key, prev); };
                }
              },
              invalidateKeys: [['schedule.calendar']],
            }).then(function () {
              /* bumpCalRev: cross-iframe invalidation signal for schedule.html events query. */
              bumpCalRev();
            }).catch(function () {
              /* Mutation failed; optimistic rollback already applied by runMutation. */
            });
          });

          /* Right-click → context menu */
          row.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            if (window.soamView && window.soamView.requestContextMenu) {
              var accountErrored = accountStateMap[cal.accountId] !== 'connected';
              window.soamView.requestContextMenu(
                'ru-soam-schedule/calendar/context',
                e.clientX,
                e.clientY,
                {
                  calendarId: cal.id,
                  accountId: cal.accountId,
                  name: cal.displayName,
                  color: cal.color,
                },
                { 'schedule.calendarAccountErrored': accountErrored },
              );
            }
          });

          /* Merged colored-tick checkbox — always unchecked when account disconnected */
          var effectiveOn = isOn && !disabled;
          var chk = document.createElement('div');
          chk.className = 'cal-checkbox' + (effectiveOn ? ' on' : '');
          if (effectiveOn) {
            /* Filled with calendar color; dark tick for contrast */
            chk.style.background = color;
            chk.style.borderColor = 'transparent';
          } else {
            /* Empty box; thin outline in calendar color */
            chk.style.background = 'transparent';
            chk.style.borderColor = color;
          }
          chk.title = disabled
            ? 'Account disconnected'
            : effectiveOn
              ? 'Hide calendar'
              : 'Show calendar';

          /* SVG tick mark (shown only when .on via CSS) */
          var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 10 10');
          svg.setAttribute('fill', 'none');
          var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          /* Checkmark path: L-shape bottom-left corner → M1.5,5 L4,7.5 L8.5,2 */
          path.setAttribute('d', 'M1.5 5 L4 7.5 L8.5 2');
          path.setAttribute('stroke', 'rgba(0,0,0,0.8)');
          path.setAttribute('stroke-width', '1.7');
          path.setAttribute('stroke-linecap', 'round');
          path.setAttribute('stroke-linejoin', 'round');
          svg.appendChild(path);
          chk.appendChild(svg);

          /* Display name */
          var nameEl = document.createElement('span');
          nameEl.className = 'cal-name';
          /* textContent safe: provider calendar name — non-PHI metadata */
          nameEl.textContent = cal.displayName;

          row.appendChild(chk);
          row.appendChild(nameEl);

          return row;
        }

        /* ── Render accounts list ───────────────────────────────────────────── */
        function renderAccounts() {
          elAccountsBlock.innerHTML = '';
          if (!accounts || accounts.length === 0) {
            var em = document.createElement('div');
            em.className = 'cals-empty';
            em.textContent = 'No accounts connected.';
            elAccountsBlock.appendChild(em);
            return;
          }
          accounts.forEach(function (a) {
            elAccountsBlock.appendChild(buildAcctRow(a));
          });
        }

        /* ── Build single account row ────────────────────────────────────────── */
        function buildAcctRow(a) {
          var isConnected = a.connectionState === 'connected';

          var row = document.createElement('div');
          row.className = 'acct-row' + (isConnected ? ' active' : '');

          /* Right-click → context menu */
          row.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            if (window.soamView && window.soamView.requestContextMenu) {
              window.soamView.requestContextMenu(
                'ru-soam-schedule/account/context',
                e.clientX,
                e.clientY,
                { accountId: a.id },
                { 'schedule.accountConnected': isConnected },
              );
            }
          });

          /* Provider icon — inline 'G' circle */
          var icon = document.createElement('div');
          icon.className = 'acct-row-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = 'G';
          row.appendChild(icon);

          /* Info block */
          var info = document.createElement('div');
          info.className = 'acct-row-info';

          var emailEl = document.createElement('div');
          emailEl.className = 'acct-row-email';
          /* textContent safe: account email is non-client PII */
          emailEl.textContent = a.email || a.externalAccountId || '—';
          info.appendChild(emailEl);

          var statusEl = document.createElement('div');
          statusEl.className =
            'acct-row-status acct-row-status--' + (isConnected ? 'connected' : 'disconnected');
          statusEl.textContent = isConnected ? 'Connected · read-only' : 'Disconnected';
          info.appendChild(statusEl);

          row.appendChild(info);

          return row;
        }

        /* ── Render classification filter rows ───────────────────────────────── */
        /* Single-focus mode: clicking a row focuses only that class; clicking it
         * again (or "All events") resets to all visible. No colored dot per class
         * (color now encodes calendar, not classification). Count displayed always. */
        function renderClassifications() {
          elClassifBlock.innerHTML = '';

          /* Compute total count */
          var total = 0;
          CLASSIFICATIONS.forEach(function (c) {
            total += _counts[c.id] || 0;
          });

          /* "All events" master row — active when no class is focused */
          elClassifBlock.appendChild(
            buildClassifRow({
              id: '__all__',
              label: 'All events',
              count: total,
              active: !_classFilter,
            }),
          );

          /* Individual classification rows */
          CLASSIFICATIONS.forEach(function (c) {
            /* Active = this is the currently focused class, OR nothing is focused (all visible). */
            var isFocused = _classFilter === c.id;
            elClassifBlock.appendChild(
              buildClassifRow({
                id: c.id,
                label: c.label,
                count: _counts[c.id] || 0,
                /* Row is "active" (full brightness) when it's the focused class
                 * OR when no focus is set (all classes are equally visible). */
                active: !_classFilter || isFocused,
                focused: isFocused,
              }),
            );
          });
        }

        /* ── Build single classification row ─────────────────────────────────── */
        function buildClassifRow(item) {
          /* active = full brightness; !active = muted (another class is focused) */
          var row = document.createElement('div');
          row.className = 'classif-row' + (item.active ? ' active' : '');

          row.addEventListener('click', function () {
            if (item.id === '__all__') {
              /* Reset focus → all visible */
              writeFocusedClass(null);
            } else if (_classFilter === item.id) {
              /* Click the already-focused class → reset */
              writeFocusedClass(null);
            } else {
              /* Focus this class */
              writeFocusedClass(item.id);
            }
          });

          /* Label */
          var label = document.createElement('span');
          label.className = 'classif-label';
          label.textContent = item.label;
          row.appendChild(label);

          /* Count */
          var countEl = document.createElement('span');
          countEl.className = 'classif-count';
          countEl.textContent = String(item.count);
          row.appendChild(countEl);

          return row;
        }

        /* ── Apply inbound scheduleViewState ─────────────────────────────────── */
        function applyViewState(state) {
          if (!state || typeof state.view !== 'string') return;
          currentView = state.view;
          if (typeof state.calRev === 'number') {
            var incomingRev = state.calRev;
            /* Reload calendar list when calRev increased externally (e.g. calendar-setup added one).
             * Guard: only fire when rev actually grew AND caps are bound (loadData guards itself).
             * With __viewQuery observers active, invalidate triggers refetch without tearing
             * down + recreating observers; fall back to loadData if observers not yet set up. */
            if (_lastSeenRev >= 0 && incomingRev > currentRev) {
              currentRev = incomingRev;
              _lastSeenRev = incomingRev;
              if (_accountsObs && _calsObs) {
                window.__viewQuery.invalidate(['schedule.calendar']);
              } else {
                loadData();
              }
            } else {
              currentRev = incomingRev;
              if (_lastSeenRev < 0) _lastSeenRev = incomingRev;
            }
          }
          /* classFilter: new shape = string | null. Old Record<string,boolean> → null. */
          if (typeof state.classFilter === 'string' && state.classFilter.length > 0) {
            _classFilter = state.classFilter;
          } else {
            _classFilter = null;
          }
          renderClassifications();
        }

        /* ── Apply inbound scheduleCounts ────────────────────────────────────── */
        function applyCounts(counts) {
          if (!counts || typeof counts !== 'object' || Array.isArray(counts)) return;
          _counts = counts;
          renderClassifications();
        }

        /* ── Message handler ─────────────────────────────────────────────────── */
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.__soamView !== true) return;
          boot.applyTheme(d);
          if (d.kind === 'init' || d.kind === 'context') {
            if (d.scheduleViewState) applyViewState(d.scheduleViewState);
            if (d.scheduleCounts) applyCounts(d.scheduleCounts);
          }
          if (d.kind === 'scheduleViewState' && d.state) {
            applyViewState(d.state);
          }
          if (d.kind === 'scheduleCounts' && d.counts) {
            applyCounts(d.counts);
          }
        });

        /* ── Bridge bootstrap ─────────────────────────────────────────────────── */
        boot
          .awaitBridge()
          .then(function (soamView) {
            window.soamView = soamView;
            elBridgeWait.classList.add('hidden');
            elRoot.classList.remove('hidden');

            boot.applyCodicons();

            elPeriod.textContent = new Date().toLocaleDateString('en-US', {
              month: 'short',
              year: 'numeric',
            });

            /* "Open calendar" button → reopen / focus the aggregate Schedule tab */
            elBtnOpenSched.addEventListener('click', function () {
              if (window.soamView && window.soamView.openInEditor) {
                window.soamView.openInEditor('schedule', {
                  query: 'id=schedule',
                  title: 'Schedule',
                  entityId: 'schedule',
                });
              }
            });

            /* "+" button → open calendar-setup work-area view (Phase B; graceful no-op until built) */
            elBtnAddCal.addEventListener('click', function () {
              if (window.soamView && window.soamView.openInEditor) {
                window.soamView.openInEditor('calendar-setup', {
                  query: 'mode=add',
                  title: 'Add calendar',
                  entityId: 'calendar-setup',
                });
              }
            });

            /* Bind caps */
            Promise.all([
              soamView.bindQuery('schedule.calendar.query', '1.0'),
              soamView.bindCommand('schedule.calendar', '1.0'),
            ])
              .then(function (caps) {
                queryCap = caps[0];
                cmdCap = caps[1];
                loadData();

                /* Auto-open the aggregate Schedule grid in the work area on activity focus
                 * (replaces the removed "Open calendar" button). Idempotent: same entityId
                 * re-focuses the existing tab rather than opening a duplicate. */
                soamView.events.onActivate(function () {
                  if (window.soamView && window.soamView.openInEditor) {
                    window.soamView.openInEditor('schedule', {
                      query: 'id=schedule',
                      title: 'Schedule',
                      entityId: 'schedule',
                    });
                  }
                  /* Refresh data on activity focus. Invalidate if observers exist (cheaper),
                   * otherwise loadData creates them. */
                  if (_accountsObs && _calsObs) {
                    window.__viewQuery.invalidate(['schedule.calendar']);
                  } else {
                    loadData();
                  }
                });
              })
              .catch(function () {
                renderCalendars(); /* show empty state */
              });

            /* Initial renders */
            renderCalendars();
            renderAccounts();
            renderClassifications();
          })
          .catch(function (err) {
            elBridgeWait.textContent =
              'Bridge error: ' + (err && err.message ? err.message : String(err));
          });
      })();
    </script>
  </body>
</html>
