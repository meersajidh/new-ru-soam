<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Client Aspects</title>
    <style>

      /* ── Reset ──────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ── Design tokens (overridden via postMessage) ─────────────── */
      :root {
        color-scheme: light dark;
        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ───────────────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 12px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Bridge wait overlay ────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px; height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Status bar ─────────────────────────────────────────────── */
      #status-bar {
        font-size: 11px;
        padding: 5px 12px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
      }
      #status-bar.visible { display: block; }
      #status-bar.is-locked {
        background: color-mix(in srgb, var(--color-warning) 9%, transparent);
        color: var(--color-warning);
      }

      /* ── Client identity strip ──────────────────────────────────── */
      #identity-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-elevated);
        flex-shrink: 0;
      }
      .id-avatar {
        flex: 0 0 auto;
        width: 32px; height: 32px;
        border-radius: 50%;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.01em;
      }
      .id-text { min-width: 0; }
      .id-name {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .id-sub {
        font-size: 10px;
        color: var(--color-fg-muted);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Scroll area ────────────────────────────────────────────── */
      #aspects-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
      }

      /* ── Section / aspect ───────────────────────────────────────── */
      .section {
        border-bottom: 1px solid var(--color-border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
        cursor: pointer;
        user-select: none;
        background: transparent;
        transition: background var(--transition);
      }
      .section-header:hover {
        background: color-mix(in srgb, var(--color-fg-muted) 6%, transparent);
      }
      .section-caret {
        flex: 0 0 auto;
        transition: transform 120ms ease;
        color: var(--color-fg-muted);
      }
      .section-caret.is-open { transform: rotate(90deg); }
      .section-title {
        flex: 1 1 auto;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--color-fg-primary);
      }
      .section-source {
        font-size: 9px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        border-radius: 3px;
        padding: 1px 5px;
        flex-shrink: 0;
      }
      .section-body {
        padding: 10px 12px 14px;
        display: none;
      }
      .section-body.is-open { display: block; }

      /* ── Risk section ───────────────────────────────────────────── */
      .risk-alert-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--color-error) 12%, var(--color-surface-elevated));
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 30%, var(--color-border));
        font-size: 11.5px;
        font-weight: 600;
        color: var(--color-error);
        flex-shrink: 0;
      }
      .risk-facts { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
      .risk-fact {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--color-fg-secondary);
      }
      .risk-items { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
      .risk-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11px;
        color: var(--color-fg-secondary);
      }
      .risk-dot {
        flex: 0 0 auto;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--color-error);
        margin-top: 5px;
      }
      .risk-when {
        font-size: 9.5px;
        font-family: var(--font-mono);
        color: var(--color-fg-muted);
        margin-left: 3px;
        white-space: nowrap;
      }
      .risk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: 1px solid var(--color-border);
        color: var(--color-fg-secondary);
        border-radius: var(--radius-sm);
        font-size: 10.5px;
        font-weight: 500;
        padding: 4px 9px;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background var(--transition), color var(--transition);
      }
      .action-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
        border-color: var(--color-fg-muted);
      }

      /* ── Profile section ────────────────────────────────────────────────────────────────────────────── */
      .kv { display: flex; flex-direction: column; gap: 8px; }
      .kv-row { display: flex; align-items: baseline; gap: 8px; font-size: 11px; }
      .kv-label { color: var(--color-fg-muted); flex: 0 0 90px; font-size: 10.5px; }
      .kv-value { color: var(--color-fg-secondary); flex: 1 1 auto; }
      .kv-value.is-empty { color: var(--color-fg-muted); font-style: italic; }
      .note-subtle { font-size: 10px; color: var(--color-fg-muted); margin-top: 6px; }

      /* ── Profile edit form ─────────────────────────────────────────────────────────────────── */
      #profile-edit-form {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }
      #profile-edit-form.is-open { display: flex; }
      .pe-field { display: flex; flex-direction: column; gap: 3px; }
      .pe-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--color-fg-muted);
      }
      .pe-input {
        width: 100%;
        padding: 5px 8px;
        font-size: 11px;
        font-family: var(--font-sans);
        background: var(--color-surface-base, #111);
        color: var(--color-fg-primary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color var(--transition);
      }
      .pe-input:focus { border-color: var(--color-border-focus); }
      .pe-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 2px;
      }
      .pe-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 500;
        font-family: var(--font-sans);
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
      }
      .pe-btn:hover { background: var(--color-surface-active); color: var(--color-fg-primary); }
      .pe-btn.primary {
        background: var(--color-accent);
        color: var(--color-accent-fg, #1c1c1e);
        border-color: transparent;
      }
      .pe-btn.primary:hover { background: var(--color-success); }
      .pe-btn.primary:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
      .pe-save-msg {
        font-size: 10px;
        flex: 1;
        opacity: 0;
        transition: opacity var(--transition);
      }
      .pe-save-msg.visible { opacity: 1; }
      .pe-save-msg.ok { color: var(--color-success); }
      .pe-save-msg.err { color: var(--color-error); }

      /* ── Edit button on section header ───────────────────────────────────────────────── */
      .section-edit-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--color-fg-muted);
        cursor: pointer;
        flex-shrink: 0;
        transition: background var(--transition), color var(--transition);
      }
      .section-edit-btn:hover { background: var(--color-surface-active); color: var(--color-fg-secondary); }
      .section-edit-btn.is-active { color: var(--color-accent); }
    </style>
  </head>
  <body>
    <!-- Bridge wait overlay -->
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display:none">
      <div id="status-bar" role="alert"></div>

      <!-- Client identity strip -->
      <div id="identity-strip" style="display:none">
        <div class="id-avatar" id="id-avatar">?</div>
        <div class="id-text">
          <div class="id-name" id="id-name">—</div>
          <div class="id-sub" id="id-sub"></div>
        </div>
      </div>

      <!-- Sections -->
      <div id="aspects-scroll">
        <!-- Risk / Safety (always shown first) -->
        <div id="risk-alert-bar" class="risk-alert-bar" style="display:none">
          <span data-codicon="shield" data-size="13"></span>
          Risk / Safety — active concern
        </div>

        <section class="section" id="section-risk" data-maturity-id="section-risk">
          <header class="section-header" id="sh-risk" tabindex="0" role="button" aria-expanded="true">
            <span class="section-caret is-open" data-codicon="chevron-right" data-size="12"></span>
            <span data-codicon="shield" data-size="13"></span>
            <span class="section-title">Risk / Safety</span>
            <span class="section-source">PRACTICE</span>
          </header>
          <div class="section-body is-open" id="sb-risk">
            <div class="risk-facts" id="risk-facts">
              <div class="risk-fact">
                <span data-codicon="pass" data-size="12"></span>
                Capacity intact
              </div>
              <div class="risk-fact">
                <span data-codicon="shield" data-size="12"></span>
                NR engaged — R. Deshpande
              </div>
              <div class="risk-fact">
                <span data-codicon="edit" data-size="12"></span>
                MHA §23 exception not currently invoked
              </div>
            </div>
            <ul class="risk-items" id="risk-items">
              <li class="risk-item"><span class="risk-dot"></span><span>Passive SI, no plan or intent</span><span class="risk-when">Session 28 May</span></li>
              <li class="risk-item"><span class="risk-dot"></span><span>Safety plan agreed &amp; shared with NR</span><span class="risk-when">28 May</span></li>
              <li class="risk-item"><span class="risk-dot"></span><span>Means restriction discussed</span><span class="risk-when">28 May</span></li>
            </ul>
            <div class="risk-actions">
              <button class="action-btn" type="button">
                <span data-codicon="shield" data-size="11"></span>
                Safety plan
              </button>
              <button class="action-btn" type="button">
                <span data-codicon="note" data-size="11"></span>
                Log §23 disclosure
              </button>
            </div>
          </div>
        </section>

        <!-- Profile (real data, editable inline) -->
        <section class="section" id="section-profile" data-maturity-id="section-profile">
          <header class="section-header" id="sh-profile" tabindex="0" role="button" aria-expanded="true">
            <span class="section-caret is-open" data-codicon="chevron-right" data-size="12"></span>
            <span data-codicon="person" data-size="13"></span>
            <span class="section-title">Profile</span>
            <span class="section-source">PRACTICE</span>
            <button class="section-edit-btn" id="btn-profile-edit" type="button" title="Edit profile" aria-label="Edit profile" tabindex="0">
              <span data-codicon="edit" data-size="12"></span>
            </button>
          </header>
          <div class="section-body is-open" id="sb-profile">
            <div class="kv" id="profile-kv">
              <!-- populated by JS -->
            </div>
            <!-- Inline edit form (toggled by edit button) -->
            <div id="profile-edit-form">
              <div class="pe-field">
                <label class="pe-label" for="pe-language">Preferred language</label>
                <input class="pe-input" id="pe-language" type="text" placeholder="e.g. Marathi" autocomplete="off" spellcheck="false" />
              </div>
              <div class="pe-field">
                <label class="pe-label" for="pe-diagnosis">Diagnosis / problem list</label>
                <input class="pe-input" id="pe-diagnosis" type="text" placeholder="e.g. F33.2 Recurrent depressive disorder" autocomplete="off" spellcheck="false" />
              </div>
              <div class="pe-field">
                <label class="pe-label" for="pe-meds">Medication awareness</label>
                <input class="pe-input" id="pe-meds" type="text" placeholder="e.g. Sertraline 100 mg OD" autocomplete="off" spellcheck="false" />
              </div>
              <div class="pe-actions">
                <button class="pe-btn primary" id="btn-pe-save" type="button">Save</button>
                <button class="pe-btn" id="btn-pe-cancel" type="button">Cancel</button>
                <span class="pe-save-msg" id="pe-save-msg" role="status" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </section>
      </div><!-- /aspects-scroll -->
    </div><!-- /root -->

    <script>
    (function () {
      'use strict';

      /* ── State ──────────────────────────────────────────────────── */
      var _queryProxy = null;  // record.patient.query
      var _cmdProxy   = null;  // record.patient (command)
      var _clientId   = null;
      var _record     = null;
      var _profile    = null;
      var _editOpen   = false;
      var _editSaving = false;
      var _editMsgTimer = null;

      /* ── Elements ───────────────────────────────────────────────── */
      var elBridgeWait    = document.getElementById('bridge-wait');
      var elRoot          = document.getElementById('root');
      var elStatusBar     = document.getElementById('status-bar');
      var elIdentityStrip = document.getElementById('identity-strip');
      var elIdAvatar      = document.getElementById('id-avatar');
      var elIdName        = document.getElementById('id-name');
      var elIdSub         = document.getElementById('id-sub');
      var elRiskAlertBar  = document.getElementById('risk-alert-bar');
      var elProfileKv     = document.getElementById('profile-kv');
      var elEditForm      = document.getElementById('profile-edit-form');
      var elEditBtn       = document.getElementById('btn-profile-edit');
      var elPeLang        = document.getElementById('pe-language');
      var elPeDiag        = document.getElementById('pe-diagnosis');
      var elPeMeds        = document.getElementById('pe-meds');
      var elPeSave        = document.getElementById('btn-pe-save');
      var elPeCancel      = document.getElementById('btn-pe-cancel');
      var elPeMsg         = document.getElementById('pe-save-msg');

      /* ── Helpers ────────────────────────────────────────────────── */
      function showError(msg) {
        elStatusBar.textContent = msg;
        elStatusBar.className = 'visible';
      }
      function showLocked(msg) {
        elStatusBar.textContent = msg;
        elStatusBar.className = 'visible is-locked';
      }
      function isLockedError(err) {
        return err && (err.code === 'cap.locked' ||
          (err.message && err.message.indexOf('cap.locked') !== -1));
      }
      function computeAge(dob) {
        if (!dob) return null;
        try {
          var birth = new Date(dob);
          if (isNaN(birth.getTime())) return null;
          var now = new Date();
          var age = now.getFullYear() - birth.getFullYear();
          var m = now.getMonth() - birth.getMonth();
          if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
          return age >= 0 ? age : null;
        } catch (e) { return null; }
      }
      function initials(rec) {
        var g = (rec.givenName || '').trim();
        var f = (rec.familyName || '').trim();
        var a = '';
        if (g) a += g[0].toUpperCase();
        if (f) a += f[0].toUpperCase();
        return a || '?';
      }
      function el(tag, cls) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      }
      function txt(tag, cls, content) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        e.textContent = content;
        return e;
      }

      /* ── Section toggle ─────────────────────────────────────────── */
      function bindToggle(headerId, bodyId) {
        var header = document.getElementById(headerId);
        var body   = document.getElementById(bodyId);
        if (!header || !body) return;
        function toggle(e) {
          // Do not toggle if click was on the edit button.
          if (elEditBtn && (e.target === elEditBtn || elEditBtn.contains(e.target))) return;
          var open = body.classList.contains('is-open');
          body.classList.toggle('is-open', !open);
          var caret = header.querySelector('.section-caret');
          if (caret) caret.classList.toggle('is-open', !open);
          header.setAttribute('aria-expanded', String(!open));
        }
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); }
        });
      }

      /* ── Identity strip render ──────────────────────────────────── */
      function renderIdentity() {
        var rec = _record;
        elIdAvatar.textContent = initials(rec);
        elIdName.textContent = rec.displayName || ((rec.givenName || '') + ' ' + (rec.familyName || '')).trim();
        var age = computeAge(rec.dob);
        elIdSub.textContent = age !== null ? 'age ' + age : rec.id;
        elIdentityStrip.style.display = '';
      }

      /* ── Profile section render ─────────────────────────────────── */
      function renderProfile() {
        var profile = _profile;
        var frag = document.createDocumentFragment();

        // Language — real or "Not recorded"
        var lang = (profile && profile.preferredLanguage) ? profile.preferredLanguage + ' (preferred)' : null;
        var langRow = el('div', 'kv-row');
        langRow.appendChild(txt('span', 'kv-label', 'Language'));
        var langVal = txt('span', lang ? 'kv-value' : 'kv-value is-empty', lang || 'Not recorded');
        langRow.appendChild(langVal);
        frag.appendChild(langRow);

        // Diagnosis — real or "Not recorded"
        var diagText = (profile && profile.diagnosis) ? profile.diagnosis : null;
        var diagRow = el('div', 'kv-row');
        diagRow.appendChild(txt('span', 'kv-label', 'Diagnosis'));
        var diagVal = txt('span', diagText ? 'kv-value' : 'kv-value is-empty', diagText || 'Not recorded');
        diagRow.appendChild(diagVal);
        frag.appendChild(diagRow);

        // Medication awareness — real or "Not recorded"
        var medsText = (profile && profile.medicationAwareness) ? profile.medicationAwareness : null;
        var medsRow = el('div', 'kv-row');
        medsRow.appendChild(txt('span', 'kv-label', 'Medications'));
        var medsVal = txt('span', medsText ? 'kv-value' : 'kv-value is-empty', medsText || 'Not recorded');
        medsRow.appendChild(medsVal);
        frag.appendChild(medsRow);

        var note = txt('p', 'note-subtle', 'Medication awareness only — not a prescribing workflow.');
        frag.appendChild(note);

        elProfileKv.innerHTML = '';
        elProfileKv.appendChild(frag);
      }

      /* ── Alert bar ──────────────────────────────────────────────── */
      function renderRiskAlert() {
        // Phase A: always show the mock risk alert (real risk schema deferred).
        elRiskAlertBar.style.display = '';
      }

      /* ── Full render ────────────────────────────────────────────── */
      function renderAll() {
        renderIdentity();
        renderRiskAlert();
        renderProfile();
      }

      /* ── Inline edit ────────────────────────────────────────────── */
      function openEdit() {
        _editOpen = true;
        elEditBtn.classList.add('is-active');
        elPeLang.value = (_profile && _profile.preferredLanguage)   || '';
        elPeDiag.value = (_profile && _profile.diagnosis)           || '';
        elPeMeds.value = (_profile && _profile.medicationAwareness) || '';
        elEditForm.classList.add('is-open');
        elPeLang.focus();
      }

      function closeEdit() {
        _editOpen = false;
        elEditBtn.classList.remove('is-active');
        elEditForm.classList.remove('is-open');
        clearTimeout(_editMsgTimer);
        elPeMsg.className = 'pe-save-msg';
        elPeMsg.textContent = '';
      }

      function showEditMsg(msg, kind) {
        clearTimeout(_editMsgTimer);
        elPeMsg.textContent = msg;
        elPeMsg.className = 'pe-save-msg visible ' + (kind || '');
        if (kind === 'ok') {
          _editMsgTimer = setTimeout(function () {
            closeEdit();
          }, 1200);
        }
      }

      function onEditSave() {
        if (_editSaving || !_cmdProxy || !_clientId) return;
        var lang  = elPeLang.value.trim();
        var diag  = elPeDiag.value.trim();
        var meds  = elPeMeds.value.trim();
        // Send empty string (not null) for blanked fields so the upsert WRITES
        // the clear — updateProfile's update branch skips null (COALESCE-merge)
        // but writes '' (non-null), so a cleared field actually clears.
        var patch = {
          preferredLanguage:   lang,
          diagnosis:           diag,
          medicationAwareness: meds,
        };
        _editSaving = true;
        elPeSave.disabled = true;
        _cmdProxy.call('updateProfile', _clientId, patch).then(function (updated) {
          _editSaving = false;
          elPeSave.disabled = false;
          _profile = updated;
          renderProfile();
          showEditMsg('Saved.', 'ok');
        }).catch(function (err) {
          _editSaving = false;
          elPeSave.disabled = false;
          if (isLockedError(err)) {
            showEditMsg('Workspace locked.', 'err');
          } else {
            showEditMsg('Save failed: ' + (err && err.message), 'err');
          }
        });
      }

      /* ── Load data ──────────────────────────────────────────────── */
      function loadAndRender() {
        if (!_queryProxy || !_clientId) return;
        Promise.all([
          _queryProxy.call('get', _clientId),
          _queryProxy.call('getProfile', _clientId),
        ]).then(function (results) {
          var rec     = results[0];
          var profile = results[1];
          if (!rec) { showError('Client not found: ' + _clientId); return; }
          _record  = rec;
          _profile = profile;
          renderAll();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked — unlock to view client.');
          } else {
            showError('Failed to load: ' + (err && err.message));
          }
        });
      }

      // Shared bridge ref for context handler.
      var _soamView = null;

      function ensureProxiesAndRender() {
        if (!_clientId || _clientId === 'new') return;
        if (_queryProxy && _cmdProxy) { loadAndRender(); return; }
        if (!_soamView) return;
        var bindQ = _queryProxy ? Promise.resolve(_queryProxy)
          : _soamView.bindQuery('record.patient.query', '1.0');
        var bindC = _cmdProxy ? Promise.resolve(_cmdProxy)
          : _soamView.bindCommand('record.patient', '1.0');
        Promise.all([bindQ, bindC]).then(function (proxies) {
          _queryProxy = proxies[0];
          _cmdProxy   = proxies[1];
          loadAndRender();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked.');
          } else {
            showError('Bridge error: ' + (err && err.message));
          }
        });
      }

      /* ── Message handler (theme + context) ─────────────────────── */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        if ((d.kind === 'init' || d.kind === 'theme') && d.theme) {
          var root = document.documentElement;
          Object.keys(d.theme).forEach(function (k) {
            root.style.setProperty(k, d.theme[k]);
          });
        }
        // context message: entityId pushed by BundleViewIframe on client switch.
        if (d.kind === 'context') {
          var newId = d.entityId || null;
          if (!newId) { _clientId = null; return; }
          if (newId !== _clientId) {
            _clientId = newId;
            if (_editOpen) closeEdit();
            ensureProxiesAndRender();
          }
        }
      });

      /* ── Bridge await ───────────────────────────────────────────── */
      function awaitBridge() {
        return new Promise(function (resolve) {
          if (window.soamView) return resolve(window.soamView);
          var iv = setInterval(function () {
            if (window.soamView) { clearInterval(iv); resolve(window.soamView); }
          }, 25);
        });
      }

      awaitBridge().then(function (soamView) {
        elBridgeWait.style.display = 'none';
        elRoot.style.display = '';
        _soamView = soamView;

        bindToggle('sh-risk',    'sb-risk');
        bindToggle('sh-profile', 'sb-profile');

        // Edit button — stop propagation so section-header toggle doesn't fire.
        elEditBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (_editOpen) { closeEdit(); } else { openEdit(); }
        });
        elPeSave.addEventListener('click', onEditSave);
        elPeCancel.addEventListener('click', function () { closeEdit(); });

        // Do NOT read id from location.search — id arrives via context/activate message.

        soamView.events.onActivate(function () {
          // If _clientId already set by context handler, ensure proxies + render.
          ensureProxiesAndRender();
        });

        soamView.events.onStoreChange(function (payload) {
          if (payload && (payload.table === 'patients' || payload.table === 'patient_profile')) {
            loadAndRender();
          }
        });
      });

    })();
    </script>
  </body>
</html>
