<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Client Aspects</title>
    <style>
      /* ── Reset ──────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* ── Design tokens (overridden via postMessage) ─────────────── */
      :root {
        color-scheme: light dark;
        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;
        --color-surface-base: #161618;
        --color-surface-panel: #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active: #2a2d26;
        --color-fg-primary: #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted: #636366;
        --color-border: #3a3a3c;
        --color-border-focus: #5ac85a;
        --color-accent: #5ac85a;
        --color-accent-fg: #1c1c1e;
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error: #e05252;
        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ───────────────────────────────────────────────────── */
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 12px;
        line-height: 1.5;
        background: var(--color-surface-panel);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Bridge wait overlay ────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-panel);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Status bar ─────────────────────────────────────────────── */
      #status-bar {
        font-size: 11px;
        padding: 5px 12px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
      }
      #status-bar.visible {
        display: block;
      }
      #status-bar.is-locked {
        background: color-mix(in srgb, var(--color-warning) 9%, transparent);
        color: var(--color-warning);
      }

      /* ── Client identity strip ──────────────────────────────────── */
      #identity-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-elevated);
        flex-shrink: 0;
      }
      .id-avatar {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.01em;
      }
      .id-text {
        min-width: 0;
      }
      .id-name {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .id-sub {
        font-size: 10px;
        color: var(--color-fg-muted);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Scroll area ────────────────────────────────────────────── */
      #aspects-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
      }

      /* ── Section / aspect ───────────────────────────────────────── */
      .section {
        border-bottom: 1px solid var(--color-border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 12px;
        cursor: pointer;
        user-select: none;
        /* background-color: var(--color-surface-panel); */
        background: color-mix(in srgb, var(--color-surface-panel) 50%, transparent);
        transition: background var(--transition);
      }
      .section-header:hover {
        background: color-mix(in srgb, var(--color-fg-muted) 25%, transparent);
      }
      .section-caret {
        flex: 0 0 auto;
        transition: transform 120ms ease;
        color: var(--color-fg-muted);
      }
      .section-caret.is-open {
        transform: rotate(90deg);
      }
      .section-title {
        flex: 1 1 auto;
        font-size: 11.5px;
        font-weight: 800;
        color: var(--color-fg-primary);
      }
      .section-source {
        font-size: 9px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        border-radius: 3px;
        padding: 1px 5px;
        flex-shrink: 0;
      }
      .section-body {
        padding: 10px 12px 14px;
        display: none;
      }
      .section-body.is-open {
        display: block;
      }

      /* ── Risk section ───────────────────────────────────────────── */
      .risk-alert-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--color-error) 12%, var(--color-surface-elevated));
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 30%, var(--color-border));
        font-size: 11.5px;
        font-weight: 600;
        color: var(--color-error);
        flex-shrink: 0;
      }
      .risk-facts {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 10px;
      }
      .risk-fact {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--color-fg-secondary);
      }
      .risk-items {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .risk-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11px;
        color: var(--color-fg-secondary);
      }
      .risk-dot {
        flex: 0 0 auto;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--color-error);
        margin-top: 5px;
      }
      .risk-when {
        font-size: 9.5px;
        font-family: var(--font-mono);
        color: var(--color-fg-muted);
        margin-left: 3px;
        white-space: nowrap;
      }
      .risk-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: 1px solid var(--color-border);
        color: var(--color-fg-secondary);
        border-radius: var(--radius-sm);
        font-size: 10.5px;
        font-weight: 500;
        padding: 4px 9px;
        cursor: pointer;
        font-family: var(--font-sans);
        transition:
          background var(--transition),
          color var(--transition);
      }
      .action-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
        border-color: var(--color-fg-muted);
      }

      /* ── Profile section ────────────────────────────────────────────────────────────────────────────── */
      .kv {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .kv-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 11px;
      }
      .kv-label {
        color: var(--color-fg-muted);
        flex: 0 0 90px;
        font-size: 10.5px;
      }
      .kv-value {
        color: var(--color-fg-secondary);
        flex: 1 1 auto;
      }
      .kv-value.is-empty {
        color: var(--color-fg-muted);
        font-style: italic;
      }
      .note-subtle {
        font-size: 10px;
        color: var(--color-fg-muted);
        margin-top: 6px;
      }

      /* ── Profile edit form ─────────────────────────────────────────────────────────────────── */
      #profile-edit-form {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }
      #profile-edit-form.is-open {
        display: flex;
      }
      .pe-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .pe-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--color-fg-muted);
      }
      .pe-input {
        width: 100%;
        padding: 5px 8px;
        font-size: 11px;
        font-family: var(--font-sans);
        background: var(--color-surface-base, #111);
        color: var(--color-fg-primary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color var(--transition);
      }
      .pe-input:focus {
        border-color: var(--color-border-focus);
      }
      .pe-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 2px;
      }
      .pe-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 500;
        font-family: var(--font-sans);
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition:
          background var(--transition),
          color var(--transition);
      }
      .pe-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
      }
      .pe-btn.primary {
        background: var(--color-accent);
        color: var(--color-accent-fg, #1c1c1e);
        border-color: transparent;
      }
      .pe-btn.primary:hover {
        background: var(--color-success);
      }
      .pe-btn.primary:disabled {
        opacity: 0.45;
        cursor: default;
        pointer-events: none;
      }
      .pe-save-msg {
        font-size: 10px;
        flex: 1;
        opacity: 0;
        transition: opacity var(--transition);
      }
      .pe-save-msg.visible {
        opacity: 1;
      }
      .pe-save-msg.ok {
        color: var(--color-success);
      }
      .pe-save-msg.err {
        color: var(--color-error);
      }

      /* ── Identifiers section ──────────────────────────────────────────────────── */
      .alias-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }
      .alias-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        min-width: 0;
      }
      .alias-kind {
        font-size: 9.5px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted);
        flex: 0 0 42px;
      }
      .alias-value {
        color: var(--color-fg-secondary);
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .alias-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      #alias-add-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
        margin-top: 4px;
      }
      #alias-add-form .pe-field {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      #alias-add-form .pe-label {
        flex: 0 0 36px;
      }

      /* ── Circle member list ───────────────────────────────────────────────────── */
      .circle-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .circle-member {
        background: var(--color-surface-base, #111);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: 7px 10px;
      }
      .circle-member-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: wrap;
      }
      .circle-member-name {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--color-fg-primary);
      }
      .circle-member-kind {
        font-size: 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted);
      }
      .circle-nr-badge {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--color-accent);
        border: 1px solid color-mix(in srgb, var(--color-accent) 40%, transparent);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .circle-member-meta {
        font-size: 10.5px;
        color: var(--color-fg-secondary);
        margin-top: 2px;
      }
      .circle-member-actions {
        display: flex;
        gap: 5px;
        margin-top: 5px;
        flex-wrap: wrap;
      }
      .circle-action-btn {
        font-size: 10px;
        font-weight: 500;
        font-family: var(--font-sans);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition:
          background var(--transition),
          color var(--transition);
      }
      .circle-action-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
      }
      .circle-empty {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
        padding: 4px 0;
      }

      /* ── Circle add form ──────────────────────────────────────────────────── */
      #circle-add-form {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }
      #circle-add-form.is-open {
        display: flex;
      }

      /* ── Consent section ─────────────────────────────────────────────────── */
      .consent-kv {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .consent-flag-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 5px 8px;
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--color-warning) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-warning) 25%, transparent);
        color: var(--color-warning);
        font-weight: 500;
      }
      #consent-edit-form {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }
      #consent-edit-form.is-open {
        display: flex;
      }

      /* ── Risk severity dot colors ──────────────────────────────────────── */
      .risk-dot.sev-info {
        background: var(--color-fg-muted);
      }
      .risk-dot.sev-concern {
        background: var(--color-warning);
      }
      .risk-dot.sev-elevated {
        background: var(--color-error);
      }
      .risk-dot.sev-critical {
        background: #e0193a;
        box-shadow: 0 0 4px #e0193a88;
      }
      .risk-empty {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
        padding: 4px 0 8px;
      }

      /* ── Inline risk forms ──────────────────────────────────────────────── */
      .risk-inline-form {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }
      .risk-inline-form.is-open {
        display: flex;
      }

      /* ── Edit button on section header ───────────────────────────────────────────────── */
      .section-edit-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--color-fg-muted);
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background var(--transition),
          color var(--transition);
      }
      .section-edit-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-secondary);
      }
      .section-edit-btn.is-active {
        color: var(--color-accent);
      }

      /* ── Documents section ──────────────────────────────────────── */
      .doc-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .doc-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        background: var(--color-surface-base, #111);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: 6px 9px;
      }
      .doc-icon {
        flex: 0 0 auto;
        color: var(--color-fg-muted);
        margin-top: 1px;
      }
      .doc-info {
        flex: 1 1 auto;
        min-width: 0;
      }
      .doc-title {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--color-fg-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .doc-meta {
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--color-fg-muted);
        margin-top: 1px;
      }
      .doc-remove-btn {
        flex: 0 0 auto;
        font-size: 10px;
        font-weight: 500;
        font-family: var(--font-sans);
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-muted);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
      }
      .doc-remove-btn:hover {
        background: color-mix(in srgb, var(--color-error) 12%, transparent);
        color: var(--color-error);
        border-color: color-mix(in srgb, var(--color-error) 30%, var(--color-border));
      }
      .doc-empty {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-style: italic;
        padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <!-- Bridge wait overlay -->
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display: none">
      <div id="status-bar" role="alert"></div>

      <!-- Client identity strip -->
      <div id="identity-strip" style="display: none">
        <div class="id-avatar" id="id-avatar">?</div>
        <div class="id-text">
          <div class="id-name" id="id-name">—</div>
          <div class="id-sub" id="id-sub"></div>
        </div>
      </div>

      <!-- Sections -->
      <div id="aspects-scroll">
        <!-- Risk / Safety (always shown first) -->
        <div id="risk-alert-bar" class="risk-alert-bar" style="display: none">
          <span data-codicon="shield" data-size="13"></span>
          Risk / Safety — active concern
        </div>

        <section class="section" id="section-risk" data-maturity-id="section-risk">
          <header
            class="section-header"
            id="sh-risk"
            tabindex="0"
            role="button"
            aria-expanded="true"
          >
            <span class="section-caret is-open" data-codicon="chevron-right" data-size="12"></span>
            <span data-codicon="shield" data-size="13"></span>
            <span class="section-title">Risk / Safety</span>
            <span class="section-source">PRACTICE</span>
          </header>
          <div class="section-body is-open" id="sb-risk">
            <!-- Facts row: Capacity · §23 state · NR -->
            <div class="risk-facts" id="risk-facts">
              <!-- populated by JS -->
            </div>

            <!-- Risk events list -->
            <ul class="risk-items" id="risk-items">
              <!-- populated by JS -->
            </ul>

            <!-- Primary actions -->
            <div class="risk-actions" id="risk-actions">
              <button class="action-btn" id="btn-safety-plan" type="button">
                <span data-codicon="shield" data-size="11"></span>
                Open safety plan
              </button>
              <button class="action-btn" id="btn-s23-toggle" type="button">
                <span data-codicon="law" data-size="11"></span>
                <span id="s23-btn-label">Log §23 disclosure</span>
              </button>
              <button class="action-btn" id="btn-add-risk" type="button">
                <span data-codicon="add" data-size="11"></span>
                Add risk event
              </button>
            </div>

            <!-- §23 inline form -->
            <div class="risk-inline-form" id="s23-form">
              <div class="pe-field">
                <label class="pe-label" for="s23-ground"
                  >Statutory ground <span style="color: var(--color-error)">*</span></label
                >
                <select class="pe-input" id="s23-ground">
                  <option value="">— select —</option>
                  <option value="harm_to_others">Harm to others</option>
                  <option value="threat_to_life">Threat to life</option>
                  <option value="nr_duty">NR duty</option>
                  <option value="professional_care">Professional care duty</option>
                  <option value="authority_order">Authority order</option>
                </select>
              </div>
              <div class="pe-field" id="s23-disclosed-field">
                <label class="pe-label" for="s23-disclosed">Disclosed to</label>
                <input
                  class="pe-input"
                  id="s23-disclosed"
                  type="text"
                  placeholder="Name / organisation"
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>
              <div class="pe-field" id="s23-reason-field">
                <label class="pe-label" for="s23-reason">Reason / notes</label>
                <textarea

        /* ── Overlay factory ────────────────────────────────────────── */
        function makeOverlay(cfg) {
          // cfg: { form, msg, btn (optional), autoCloseMs (optional, default 1200) }
          var _open = false;
          var _timer = null;
          var autoMs = cfg.autoCloseMs !== undefined ? cfg.autoCloseMs : 1200;
          function close() {
            _open = false;
            if (cfg.btn) cfg.btn.classList.remove('is-active');
            cfg.form.classList.remove('is-open');
            clearTimeout(_timer);
            cfg.msg.className = 'pe-save-msg';
            cfg.msg.textContent = '';
          }
          function showMsg(msg, kind) {
            clearTimeout(_timer);
            cfg.msg.textContent = msg;
            cfg.msg.className = 'pe-save-msg visible ' + (kind || '');
            if (kind === 'ok') {
              _timer = setTimeout(function () { close(); }, autoMs);
            }
          }
          function open(populate) {
            _open = true;
            if (cfg.btn) cfg.btn.classList.add('is-active');
            cfg.form.classList.add('is-open');
            if (populate) populate();
          }
          function isOpen() { return _open; }
          return { open: open, close: close, showMsg: showMsg, isOpen: isOpen };
        }

        /* ── Overlay instances (created after el* refs are assigned) ── */

        function showError(msg) {

        // Shared impl in the injected window.__viewBoot (view-bootstrap.ts).
        function isLockedError(err) {
          return window.__viewBoot.isLockedError(err);
        }
        function computeAge(dob) {
          if (!dob) return null;
          try {
            var birth = new Date(dob);
            if (isNaN(birth.getTime())) return null;
            var now = new Date();
            var age = now.getFullYear() - birth.getFullYear();
            var m = now.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
            return age >= 0 ? age : null;
          } catch (e) {
            return null;
          }
        }
        function initials(rec) {
          var g = (rec.givenName || '').trim();
          var f = (rec.familyName || '').trim();
          var a = '';
          if (g) a += g[0].toUpperCase();
          if (f) a += f[0].toUpperCase();
          return a || '?';
        }

          var e = document.createElement(tag);

        /* ── Section toggle ─────────────────────────────────────────── */
        function bindToggle(headerId, bodyId, editBtnId) {
          var header = document.getElementById(headerId);
          var body = document.getElementById(bodyId);
          var editBtn = editBtnId ? document.getElementById(editBtnId) : null;
          if (!header || !body) return;
          function toggle(e) {

            // Let the nested edit button handle its own keyboard activation —
            // do NOT preventDefault on its bubbled key event (would swallow it).
            if (editBtn && (e.target === editBtn || editBtn.contains(e.target))) return;

        /* ── Relative date helper ───────────────────────────────────── */
        function relDate(ts) {
          if (!ts) return '';
          var d = new Date(ts);
          var now = new Date();
          var diff = now - d; // ms
          var days = Math.floor(diff / 86400000);
          if (days === 0) return 'Today';
          if (days === 1) return 'Yesterday';
          if (days < 7) return days + 'd ago';
          if (days < 31) return Math.floor(days / 7) + 'w ago';
          // Full short date
          return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        }

        /* ── Documents section render ───────────────────────────────── */
        var DOC_MAX_BYTES = 25 * 1024 * 1024;

        function fmtSize(bytes) {
          if (bytes == null) return '';
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
          return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function renderDocuments() {
          elDocList.innerHTML = '';
          var docs = _documents;
          if (!docs || docs.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'doc-empty';
            empty.textContent = 'No documents.';
            elDocList.appendChild(empty);
            return;
          }
          docs.forEach(function (doc) {
            var item = document.createElement('div');
            item.className = 'doc-item';

            var iconSpan = document.createElement('span');
            iconSpan.className = 'doc-icon';
            iconSpan.setAttribute('data-codicon', 'file');
            iconSpan.setAttribute('data-size', '12');
            item.appendChild(iconSpan);

            var info = document.createElement('div');
            info.className = 'doc-info';

            var title = document.createElement('div');
            title.className = 'doc-title';
            title.textContent = doc.title;
            info.appendChild(title);

            var meta = [];
            if (doc.mimeType) meta.push(doc.mimeType);
            if (doc.createdAt) {
              meta.push(relDate(doc.createdAt));
            }
            if (meta.length > 0) {
              var metaDiv = document.createElement('div');
              metaDiv.className = 'doc-meta';
              metaDiv.textContent = meta.join(' · ');
              info.appendChild(metaDiv);
            }

            item.appendChild(info);

            var removeBtn = document.createElement('button');
            removeBtn.className = 'doc-remove-btn';
            removeBtn.type = 'button';
            removeBtn.textContent = 'Remove';
            (function (d) {
              removeBtn.addEventListener('click', function () {
                onDocRemove(d.id);
              });
            })(doc);
            item.appendChild(removeBtn);

            elDocList.appendChild(item);
          });
          // Apply codicons in newly rendered items.
          applyCodeicons(elDocList);
        }

        /* ── Document upload msg helper ─────────────────────────────── */
        function showDocUploadMsg(msg, kind) {
          clearTimeout(_docUploadMsgTimer);
          elDocUploadMsg.textContent = msg;
          elDocUploadMsg.className = 'pe-save-msg visible ' + (kind || '');
          if (kind === 'ok') {
            _docUploadMsgTimer = setTimeout(function () {
              elDocUploadMsg.className = 'pe-save-msg';
              elDocUploadMsg.textContent = '';
            }, 2000);
          }
        }

        /* ── Document remove handler ─────────────────────────────────── */
        function onDocRemove(docId) {
          if (!_cmdProxy || !_clientId) return;
          var proxy = _cmdProxy;
          var clientId = _clientId;
          proxy
            .call('removeDocument', clientId, docId)
            .then(function () {
              // Reload list.
              return _queryProxy.call('listDocuments', clientId);
            })
            .then(function (docs) {
              _documents = docs;
              renderDocuments();
            })
            .catch(function (err) {
              if (isLockedError(err)) {
                showLocked('Workspace locked.');
              } else {
                showError('Remove failed: ' + (err && err.message));
              }
            });
        }

        /* ── Document upload handler ─────────────────────────────────── */
        function onDocUpload() {
          if (_docUploading || !_cmdProxy || !_clientId || !_docUploadFile) return;
          var file = _docUploadFile;
          var clientId = _clientId;

          // Client-side size guard (25 MiB).
          if (file.size > DOC_MAX_BYTES) {
            elDocSizeErr.textContent = 'File too large (max 25 MB).';
            elDocSizeErr.style.display = '';
            return;
          }
          elDocSizeErr.style.display = 'none';

          _docUploading = true;
          elBtnDocUpload.disabled = true;
          showDocUploadMsg('Uploading…', '');

          var reader = new FileReader();
          reader.onload = function (e) {
            var dataUrl = e.target.result;
            // Strip data:<mime>;base64, prefix.
            var commaIdx = dataUrl.indexOf(',');
            var base64 = commaIdx >= 0 ? dataUrl.slice(commaIdx + 1) : dataUrl;

            var proxy = _cmdProxy;
            proxy
              .call('attachDocument', clientId, {
                fileName: file.name,
                mimeType: file.type || null,
                base64: base64,
              })
              .then(function () {
                _docUploading = false;
                elBtnDocUpload.disabled = true; // keep disabled until new file chosen
                _docUploadFile = null;
                elDocFileName.textContent = '';
                elDocFileInput.value = '';
                showDocUploadMsg('Attached.', 'ok');
                return _queryProxy.call('listDocuments', clientId);
              })
              .then(function (docs) {
                _documents = docs;
                renderDocuments();
              })
              .catch(function (err) {
                _docUploading = false;
                elBtnDocUpload.disabled = false;
                if (isLockedError(err)) {
                  showDocUploadMsg('Workspace locked.', 'err');
                } else {
                  showDocUploadMsg('Upload failed: ' + (err && err.message), 'err');
                }
              });
          };
          reader.onerror = function () {
            _docUploading = false;
            elBtnDocUpload.disabled = false;
            showDocUploadMsg('Could not read file.', 'err');
          };
          reader.readAsDataURL(file);
        }

        /* ── Full render ────────────────────────────────────────────── */
        function renderAll() {
          renderIdentity();
          renderRiskFacts();
          renderRiskItems();
          renderRiskAlert();
          updateS23BtnLabel();
          // Show capacity field after data load.
          var capField = document.getElementById('capacity-field');
          if (capField) {
            capField.style.display = '';
            // Reflect current capacity in select.
            var capSel = document.getElementById('cap-select');
            if (capSel) capSel.value = '';
          }
          renderProfile();
          renderAliases();
          renderCircle();
          renderConsent();
          renderDocuments();
        }

        /* ── Inline edit ────────────────────────────────────────────── */
        function openEdit() {
          ovProfile.open(function () {
            elPeLang.value = (_profile && _profile.preferredLanguage) || '';
            elPeDiag.value = (_profile && _profile.diagnosis) || '';
            elPeMeds.value = (_profile && _profile.medicationAwareness) || '';
            elPeLang.focus();
          });
        }
        function closeEdit() { ovProfile.close(); }
        function showEditMsg(msg, kind) { ovProfile.showMsg(msg, kind); }

        function onEditSave() {
          if (_editSaving || !_cmdProxy || !_clientId) return;
          var lang = elPeLang.value.trim();
          var diag = elPeDiag.value.trim();
          var meds = elPeMeds.value.trim();
          // Send empty string (not null) for blanked fields so the upsert WRITES
          // the clear — updateProfile's update branch skips null (COALESCE-merge)
          // but writes '' (non-null), so a cleared field actually clears.
          var patch = {
            preferredLanguage: lang,
            diagnosis: diag,
            medicationAwareness: meds,
          };
          _editSaving = true;
          elPeSave.disabled = true;
          _cmdProxy
            .call('updateProfile', _clientId, patch)
            .then(function (updated) {
              _editSaving = false;
              elPeSave.disabled = false;
              _profile = updated;
              renderProfile();
              showEditMsg('Saved.', 'ok');
            })
            .catch(function (err) {
              _editSaving = false;
              elPeSave.disabled = false;
              if (isLockedError(err)) {
                showEditMsg('Workspace locked.', 'err');
              } else {
                showEditMsg('Save failed: ' + (err && err.message), 'err');
              }
            });
        }

        /* ── Load data ──────────────────────────────────────────────── */
        function loadAndRender() {
          if (!_queryProxy || !_clientId) return;
          // Guard against a stale response: the client can switch (context
          // message) while these calls are in flight; drop results for a client
          // we're no longer showing so a slow load can't clobber the new one.
          var reqId = _clientId;
          Promise.all([
            _queryProxy.call('get', _clientId),
            _queryProxy.call('getProfile', _clientId),
            _queryProxy.call('getCircle', _clientId),
            _queryProxy.call('getConsentState', _clientId),
            _queryProxy.call('listRiskEvents', _clientId),
            _queryProxy.call('getSafetyPlan', _clientId),
            _queryProxy.call('listDocuments', _clientId),
            _queryProxy.call('getAliases', _clientId),
          ])
            .then(function (results) {
              if (_clientId !== reqId) return;
              var rec = results[0];
              var profile = results[1];
              var circle = results[2];
              var consent = results[3];
              var riskEvents = results[4];
              var safetyPlan = results[5];
              var documents = results[6];
              var aliases = results[7];
              if (!rec) {
                showError('Client not found: ' + _clientId);
                return;
              }
              _record = rec;
              _profile = profile;
              _circle = circle;
              _consent = consent;
              _riskEvents = riskEvents;
              _safetyPlan = safetyPlan;
              _documents = documents;
              _aliases = aliases;
              renderAll();
            })
            .catch(function (err) {
              if (isLockedError(err)) {
                showLocked('Workspace locked — unlock to view client.');
              } else {
                showError('Failed to load: ' + (err && err.message));
              }
            });
        }

        // Shared bridge ref for context handler.
        var _soamView = null;

        function ensureProxiesAndRender() {
          if (!_clientId || _clientId === 'new') return;
          if (_queryProxy && _cmdProxy) {
            loadAndRender();
            return;
          }
          if (!_soamView) return;
          var bindQ = _queryProxy
            ? Promise.resolve(_queryProxy)
            : _soamView.bindQuery('record.patient.query', '1.0');
          var bindC = _cmdProxy
            ? Promise.resolve(_cmdProxy)
            : _soamView.bindCommand('record.patient', '1.0');
          Promise.all([bindQ, bindC])
            .then(function (proxies) {
              _queryProxy = proxies[0];
              _cmdProxy = proxies[1];
              loadAndRender();
            })
            .catch(function (err) {
              if (isLockedError(err)) {
                showLocked('Workspace locked.');
              } else {
                showError('Bridge error: ' + (err && err.message));
              }
            });
        }

        /* ── Message handler (theme + context) ─────────────────────── */
        /* ── Section focus (O465 deep-link from intake checklist) ──── */
        function focusSection(id) {
          var target = document.getElementById(id);
          if (!target) return;
          // Deep-link = "show me THIS section". Collapse every section, open only
          // the target (Risk/Safety + Profile default to open in the static markup,
          // so without this they'd stay expanded alongside the target). Toggling
          // classes is safe — section toggle reads open-state from the class, no
          // separate JS state to desync.
          document.querySelectorAll('.section').forEach(function (s) {
            var open = (s === target);
            var body = s.querySelector('.section-body');
            var header = s.querySelector('.section-header');
            if (body) body.classList.toggle('is-open', open);
            if (header) {
              var caret = header.querySelector('.section-caret');
              if (caret) caret.classList.toggle('is-open', open);
              header.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
          });
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.__soamView !== true) return;
          window.__viewBoot.applyTheme(d);
          if (d.kind === 'focusAspect') { focusSection(d.sectionId); }
          // context message: entityId pushed by BundleViewIframe on client switch.
          if (d.kind === 'context') {
            var newId = d.entityId || null;
            if (!newId) {
              _clientId = null;
              return;
            }
            if (newId !== _clientId) {
              _clientId = newId;
              if (ovProfile.isOpen()) closeEdit();
              if (ovCircleAdd.isOpen()) closeCircleAdd();
              if (ovConsent.isOpen()) closeConsentEdit();
              if (ovS23.isOpen()) closeS23Form();
              if (ovRiskEvent.isOpen()) closeRiskAddForm();
              // Reset identifier add form for new client.
              elAaValue.value = '';
              clearTimeout(_aaMsgTimer);
              elAaMsg.className = 'pe-save-msg';
              elAaMsg.textContent = '';
              // Reset document upload state for new client.
              _docUploadFile = null;
              elDocFileName.textContent = '';
              elDocFileInput.value = '';
              elDocSizeErr.style.display = 'none';
              elBtnDocUpload.disabled = true;
              ensureProxiesAndRender();
            }
          }
        });

        /* ── Bridge await ───────────────────────────────────────────── */
        // Shared impl in the injected window.__viewBoot (view-bootstrap.ts).
        function awaitBridge() {
          return window.__viewBoot.awaitBridge();
        }

        awaitBridge().then(function (soamView) {
          elBridgeWait.style.display = 'none';
          elRoot.style.display = '';
          _soamView = soamView;

          bindToggle('sh-risk', 'sb-risk');
          bindToggle('sh-profile', 'sb-profile', 'btn-profile-edit');
          bindToggle('sh-identifiers', 'sb-identifiers');
          bindToggle('sh-circle', 'sb-circle', 'btn-circle-edit');
          bindToggle('sh-consent', 'sb-consent', 'btn-consent-edit');
          bindToggle('sh-documents', 'sb-documents');

          // Identifiers: Add button.
          elAaSave.addEventListener('click', onAliasAdd);

          // Risk: Open safety plan.
          document.getElementById('btn-safety-plan').addEventListener('click', function () {
            if (!_clientId || !soamView) return;
            soamView.openInEditor('safety-plan', {
              query: 'id=' + encodeURIComponent(_clientId),
              title: 'Safety Plan',
              entityId: _clientId,
            });
          });

          // Risk: §23 toggle.
          document.getElementById('btn-s23-toggle').addEventListener('click', function () {
            if (ovS23.isOpen()) {
              closeS23Form();
            } else {
              openS23Form();
            }
          });
          document.getElementById('btn-s23-confirm').addEventListener('click', onS23Confirm);
          document.getElementById('btn-s23-cancel').addEventListener('click', function () {
            closeS23Form();
          });

          // Risk: Add risk event.
          document.getElementById('btn-add-risk').addEventListener('click', function () {
            if (ovRiskEvent.isOpen()) {
              closeRiskAddForm();
            } else {
              openRiskAddForm();
            }
          });
          document.getElementById('btn-re-save').addEventListener('click', onRiskEventSave);
          document.getElementById('btn-re-cancel').addEventListener('click', function () {
            closeRiskAddForm();
          });

          // Capacity quick-set.
          document.getElementById('cap-select').addEventListener('change', function () {
            onCapacityChange(this.value);
          });

          // Profile edit button — stop propagation so section-header toggle doesn't fire.
          elEditBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (ovProfile.isOpen()) {
              closeEdit();
            } else {
              openEdit();
            }
          });
          elPeSave.addEventListener('click', onEditSave);
          elPeCancel.addEventListener('click', function () {
            closeEdit();
          });

          // Circle add button.
          elCircleEditBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (ovCircleAdd.isOpen()) {
              closeCircleAdd();
            } else {
              openCircleAdd();
            }
          });
          elCaSave.addEventListener('click', onCircleAddSave);
          elCaCancel.addEventListener('click', function () {
            closeCircleAdd();
          });

          // Consent edit button.
          elConsentEditBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (ovConsent.isOpen()) {
              closeConsentEdit();
            } else {
              openConsentEdit();
            }
          });
          elCeSave.addEventListener('click', onConsentEditSave);
          elCeCancel.addEventListener('click', function () {
            closeConsentEdit();
          });

          // Documents: file input change → enable Attach button + show name.
          elDocFileInput.addEventListener('change', function () {
            var file = elDocFileInput.files && elDocFileInput.files[0];
            if (!file) {
              _docUploadFile = null;
              elDocFileName.textContent = '';
              elBtnDocUpload.disabled = true;
              elDocSizeErr.style.display = 'none';
              return;
            }
            _docUploadFile = file;
            elDocFileName.textContent = file.name;
            elDocSizeErr.style.display = 'none';
            if (file.size > DOC_MAX_BYTES) {
              elDocSizeErr.textContent = 'File too large (max 25 MB).';
              elDocSizeErr.style.display = '';
              elBtnDocUpload.disabled = true;
            } else {
              elBtnDocUpload.disabled = false;
            }
          });

          // Documents: Attach button click.
          elBtnDocUpload.addEventListener('click', onDocUpload);

          // Do NOT read id from location.search — id arrives via context/activate message.

          soamView.events.onActivate(function () {
            // If _clientId already set by context handler, ensure proxies + render.
            ensureProxiesAndRender();
          });

          soamView.events.onStoreChange(function (payload) {
            if (
              payload &&
              (payload.table === 'patients' ||
                payload.table === 'patient_profile' ||
                payload.table === 'patient_circle_member' ||
                payload.table === 'patient_consent_state' ||
                payload.table === 'patient_risk_event' ||
                payload.table === 'patient_safety_plan' ||
                payload.table === 'patient_document' ||
                payload.table === 'patient_identity_alias')
            ) {
              loadAndRender();
            }
          });
        });
      })();
    </script>
  </body>
</html>
