<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Client Overview</title>
    <style>

      /* ── Reset ──────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ── Design tokens (defaults — host overrides via postMessage) ─ */
      :root {
        color-scheme: light dark;

        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;

        /* Surface */
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        /* Foreground */
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        /* Borders */
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        /* Accent */
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        --color-accent-hover:   #6bd46b;
        --color-accent-pressed: #4ab44a;
        /* Semantic */
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --color-info:    #5ac0de;

        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ───────────────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Layout ─────────────────────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      /* ── Bridge wait overlay ────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-base);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Status / error bar ─────────────────────────────────────── */
      #status-bar {
        font-size: 11px;
        padding: 6px 16px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 25%, transparent);
      }
      #status-bar.visible { display: block; }
      #status-bar.is-locked {
        background: color-mix(in srgb, var(--color-warning) 9%, transparent);
        color: var(--color-warning);
        border-color: color-mix(in srgb, var(--color-warning) 25%, transparent);
      }

      /* ── Density switcher (compact icon dropdown) ──────────────── */
      #density-btn {
        position: fixed;
        top: 8px;
        right: 14px;
        z-index: 200;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--color-fg-muted);
        cursor: pointer;
        padding: 0;
        transition: background var(--transition), color var(--transition), border-color var(--transition);
      }
      #density-btn:hover,
      #density-btn.is-open {
        background: var(--color-surface-elevated);
        border-color: var(--color-border);
        color: var(--color-fg-secondary);
      }
      #density-menu {
        position: fixed;
        top: 40px;
        right: 14px;
        z-index: 201;
        min-width: 130px;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        padding: 4px 0;
        display: none;
      }
      #density-menu.is-open { display: block; }
      .density-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 10px;
        background: transparent;
        border: none;
        font-family: var(--font-sans);
        font-size: 11.5px;
        color: var(--color-fg-secondary);
        cursor: pointer;
        text-align: left;
        transition: background var(--transition), color var(--transition);
      }
      .density-item:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-primary);
      }
      .density-item.is-active {
        color: var(--color-accent);
      }
      .density-item-check {
        flex: 0 0 12px;
        width: 12px;
        height: 12px;
        color: var(--color-accent);
      }
      .density-item-check--empty {
        display: inline-block;
        width: 12px;
        height: 12px;
      }

      /* ── Scroll area ────────────────────────────────────────────── */
      #ov-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 28px 56px;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
        position: relative;
      }
      .ov-inner {
        max-width: 1100px;
        margin: 0 auto;
      }

      /* ── Risk banner ────────────────────────────────────────────── */
      .risk-banner {
        border: 1px solid color-mix(in srgb, var(--color-error) 50%, var(--color-border));
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--color-error) 9%, var(--color-surface-elevated));
        overflow: hidden;
        margin-bottom: 20px;
      }
      .risk-banner-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .risk-banner-ico {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--color-error) 18%, transparent);
        color: var(--color-error);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .risk-banner-text { flex: 1 1 220px; min-width: 0; }
      .risk-banner-headline {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--color-fg-primary);
      }
      .risk-banner-meta {
        display: block;
        font-size: 11px;
        color: var(--color-fg-secondary);
        margin-top: 2px;
      }
      .risk-banner-cmds { display: flex; gap: 8px; flex: 0 0 auto; }
      .risk-banner-detail {
        padding: 14px 16px 16px;
        border-top: 1px solid color-mix(in srgb, var(--color-error) 25%, var(--color-border));
      }
      .risk-items { list-style: none; display: flex; flex-direction: column; gap: 7px; }
      .risk-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12px;
        color: var(--color-fg-secondary);
      }
      .risk-item-dot {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-error);
        margin-top: 5px;
      }
      .risk-item-when {
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--color-fg-muted);
        margin-left: 4px;
        white-space: nowrap;
      }

      /* ── cmd-btn ────────────────────────────────────────────────── */
      .cmd-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--color-accent);
        border: 1px solid transparent;
        color: var(--color-accent-fg);
        border-radius: var(--radius-sm);
        font-size: 11px;
        font-weight: 500;
        padding: 4px 10px;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background var(--transition);
      }
      .cmd-btn:hover { background: var(--color-accent-hover); }
      .cmd-btn.ghost {
        background: transparent;
        border-color: var(--color-border);
        color: var(--color-fg-secondary);
      }
      .cmd-btn.ghost:hover {
        background: var(--color-surface-active);
        border-color: var(--color-fg-muted);
        color: var(--color-fg-primary);
      }

      /* ── aspect-caret ───────────────────────────────────────────── */
      .aspect-caret { transition: transform .12s; }
      .aspect-caret.is-open { transform: rotate(90deg); }

      /* ── Header ─────────────────────────────────────────────────── */
      .ov-header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .ov-avatar {
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        font-size: 22px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.02em;
      }
      .ov-id { flex: 1 1 240px; min-width: 0; }
      .ov-name {
        font-size: 24px;
        font-weight: 600;
        margin: 0;
        line-height: 1.12;
        letter-spacing: -0.01em;
        overflow-wrap: break-word;
      }
      .ov-id-sub {
        font-size: 12px;
        color: var(--color-fg-muted);
        margin: 4px 0 10px;
        font-family: var(--font-mono);
      }
      .ov-problems { display: flex; flex-wrap: wrap; gap: 6px; }
      .ov-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--color-fg-secondary);
        background: var(--color-surface-active);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .ov-chip.is-primary {
        background: color-mix(in srgb, var(--color-accent) 14%, transparent);
        color: var(--color-fg-primary);
      }
      .ov-chip-code {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--color-fg-muted);
      }

      .ov-badges {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        flex: 0 0 auto;
      }
      .ov-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--color-border);
        white-space: nowrap;
      }
      .ov-badge.ok {
        color: var(--color-success);
        border-color: color-mix(in srgb, var(--color-success) 35%, transparent);
        background: color-mix(in srgb, var(--color-success) 9%, transparent);
      }

      /* ── Cards ──────────────────────────────────────────────────── */
      .ov-grid { display: grid; gap: 16px; }
      .ov-grid.dense { grid-template-columns: repeat(auto-fill, minmax(278px, 1fr)); }
      .ov-grid.focused { grid-template-columns: 1fr 1fr; }
      .ov-grid.focused .ov-more { grid-column: 1 / -1; }

      .ov-card {
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
      }
      .ov-card-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 12px;
        color: var(--color-fg-secondary);
      }
      .ov-card-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--color-fg-primary);
        flex: 1 1 auto;
      }
      .ov-card-source {
        font-size: 9px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .ov-card-body { flex: 1 1 auto; }
      .ov-card-foot {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--color-border);
      }

      .link-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: none;
        color: var(--color-accent);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font-sans);
        padding: 0;
      }
      .link-btn:hover { text-decoration: underline; }

      /* Next session card */
      .next-appt { display: flex; align-items: center; gap: 12px; color: var(--color-accent); }
      .next-when { font-size: 16px; font-weight: 600; color: var(--color-fg-primary); }
      .next-label { font-size: 11px; color: var(--color-fg-muted); }

      /* Last note card */
      .last-note-meta { font-size: 10px; font-family: var(--font-mono); color: var(--color-fg-muted); margin-bottom: 6px; }
      .last-note-summary { margin: 0; font-size: 13px; color: var(--color-fg-secondary); line-height: 1.5; }

      /* Scores */
      .scores { display: flex; gap: 22px; flex-wrap: wrap; }
      .score-block { display: flex; flex-direction: column; gap: 5px; }
      .score-head { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
      .score-name { font-size: 11px; font-family: var(--font-mono); color: var(--color-fg-secondary); }
      .score-latest { font-size: 18px; font-weight: 600; color: var(--color-fg-primary); display: inline-flex; align-items: center; gap: 4px; }
      .spark { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
      .spark-bar { width: 9px; background: var(--color-accent); border-radius: 2px 2px 0 0; opacity: 0.6; }
      .spark-bar:last-child { opacity: 1; }
      .score-band { font-size: 10px; color: var(--color-fg-muted); }

      /* Goals */
      .goal-row { padding: 8px 0; border-bottom: 1px dashed var(--color-border); }
      .goal-row:last-child { border-bottom: none; }
      .goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .goal-label { font-size: 12px; color: var(--color-fg-secondary); line-height: 1.35; }
      .goal-status { font-size: 9px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; }
      .goal-status.st-ontrack { color: var(--color-success); background: color-mix(in srgb, var(--color-success) 14%, transparent); }
      .goal-status.st-slipping { color: var(--color-warning); background: color-mix(in srgb, var(--color-warning) 14%, transparent); }
      .goal-status.st-notstarted { color: var(--color-fg-muted); background: var(--color-surface-active); }
      .goal-track { height: 5px; background: var(--color-surface-active); border-radius: 3px; overflow: hidden; }
      .goal-fill { display: block; height: 100%; background: var(--color-accent); border-radius: 3px; }

      /* Payment */
      .payment { display: flex; flex-direction: column; gap: 4px; }
      .payment-amt { display: flex; align-items: center; gap: 10px; }
      .payment-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
      .payment-status.pending { color: var(--color-warning); }
      .payment-figure { font-size: 18px; font-weight: 600; color: var(--color-fg-primary); }

      /* Circle mini */
      .circle-mini { list-style: none; display: flex; flex-direction: column; gap: 7px; }
      .circle-mini li { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--color-fg-secondary); }
      .circle-mini svg { color: var(--color-fg-muted); flex: 0 0 auto; margin-top: 1px; }
      .circle-mini b { color: var(--color-fg-primary); font-weight: 600; }
      .aspect-meta { font-size: 11px; color: var(--color-fg-muted); }

      /* Focused density glance row */
      .ov-more {
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
      }
      .ov-more-head { font-size: 12px; font-weight: 600; color: var(--color-fg-primary); }
      .ov-more-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 12px; }
      .mini-stat { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--color-surface-active); }
      .mini-stat-label { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--color-fg-muted); }
      .mini-stat-value { font-size: 20px; font-weight: 600; color: var(--color-fg-primary); }
      .mini-stat-sub { font-size: 10px; }
      .mini-stat-sub.ok { color: var(--color-success); }
      .mini-stat-sub.warn { color: var(--color-warning); }

      /* Timeline density */
      .ov-timeline-wrap { display: flex; gap: 28px; align-items: flex-start; }
      .ov-timeline { list-style: none; flex: 1 1 auto; position: relative; }
      .ov-timeline::before {
        content: '';
        position: absolute;
        left: 76px; top: 6px; bottom: 6px;
        width: 1px;
        background: var(--color-border);
      }
      .tl-event {
        display: grid;
        grid-template-columns: 56px 28px 1fr;
        align-items: start;
        gap: 0 12px;
        padding-bottom: 18px;
      }
      .tl-when { font-size: 11px; font-family: var(--font-mono); color: var(--color-fg-muted); text-align: right; padding-top: 6px; }
      .tl-dot {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        z-index: 1;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-fg-muted);
      }
      .tl-dot.tone-error {
        color: var(--color-error);
        border-color: color-mix(in srgb, var(--color-error) 50%, transparent);
        background: color-mix(in srgb, var(--color-error) 12%, var(--color-surface-elevated));
      }
      .tl-dot.tone-accent {
        color: var(--color-accent);
        border-color: color-mix(in srgb, var(--color-accent) 50%, transparent);
        background: color-mix(in srgb, var(--color-accent) 12%, var(--color-surface-elevated));
      }
      .tl-card {
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 11px 14px;
      }
      .tl-title { font-size: 13px; font-weight: 600; color: var(--color-fg-primary); margin-bottom: 3px; }
      .tl-body { font-size: 12px; color: var(--color-fg-secondary); line-height: 1.45; }

      .tl-facts {
        flex: 0 0 220px;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tl-facts-head { font-size: 11px; font-weight: 600; color: var(--color-fg-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
      .tl-fact { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--color-fg-secondary); }
      .tl-fact svg { color: var(--color-fg-muted); flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <!-- Bridge wait overlay -->
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display:none">
      <!-- Error / locked status bar -->
      <div id="status-bar" role="alert"></div>

      <!-- Density switcher: compact icon button pinned top-right -->
      <button id="density-btn" type="button" aria-label="Change overview density" aria-haspopup="true" aria-expanded="false">
        <span data-codicon="gear" data-size="13"></span>
      </button>
      <div id="density-menu" role="menu" aria-label="Overview density">
        <button class="density-item is-active" data-density="dense" type="button" role="menuitem">
          <span class="density-item-check"><span data-codicon="check" data-size="12"></span></span>
          Dense
        </button>
        <button class="density-item" data-density="focused" type="button" role="menuitem">
          <span class="density-item-check--empty"></span>
          Focused
        </button>
        <button class="density-item" data-density="timeline" type="button" role="menuitem">
          <span class="density-item-check--empty"></span>
          Timeline
        </button>
      </div>

      <!-- Scrollable content area -->
      <div id="ov-scroll">
        <div class="ov-inner" id="ov-body">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── Icon helper — delegates to codicons.js window.codicon() ── */
      /* Lucide → codicon substitutions:
       *   shield-alert  → shield      (no shield-alert codicon)
       *   calendar-clock→ calendar    (no clock variant)
       *   file-text     → file-text   (exact match)
       *   activity      → pulse       (waveform)
       *   list-checks   → check-all   (checked list)
       *   indian-rupee  → credit-card (no rupee codicon)
       *   users         → organization
       *   video         → device-camera-video
       *   map-pin       → location
       *   arrow-up-right→ link-external
       *   scroll-text   → bookmark    (named doc marker)
       *   circle-check  → pass        (circle + check)
       *   pill          → milestone   (no pill codicon)
       *   languages     → symbol-key  (abc-like glyph)
       *   user-round    → person
       *   phone         → account     (closest person-related)
       *   target        → target      (exact match)
       *   circle-user   → account     (person in circle)
       */
      var ICON_MAP = {
        'shield-alert':   'shield',
        'shield':         'shield',
        'chevron-right':  'chevron-right',
        'circle-user':    'account',
        'calendar-clock': 'calendar',
        'file-text':      'file-text',
        'activity':       'pulse',
        'list-checks':    'check-all',
        'indian-rupee':   'credit-card',

      function computeAge(dob) {
        if (!dob) return null;
        try {
          var birth = new Date(dob);
          if (isNaN(birth.getTime())) return null;
          var now = new Date();
          var age = now.getFullYear() - birth.getFullYear();
          var m = now.getMonth() - birth.getMonth();
          if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
          return age >= 0 ? age : null;
        } catch (e) { return null; }
      }

        return a || '?';

      var CHECK_SVG = window.codicon('check', 12);

      function updateDensityMenu() {
        var items = document.querySelectorAll('.density-item[data-density]');
        items.forEach(function (item) {
          var isActive = item.getAttribute('data-density') === _density;
          item.classList.toggle('is-active', isActive);
          var checkSpan = item.querySelector('.density-item-check, .density-item-check--empty');
          if (checkSpan) {
            if (isActive) {
              checkSpan.className = 'density-item-check';
              checkSpan.innerHTML = CHECK_SVG;
            } else {
              checkSpan.className = 'density-item-check--empty';
              checkSpan.innerHTML = '';
            }
          }
        });
      }

      function initDensitySwitcher() {
        var toggleBtn = document.getElementById('density-btn');
        var menu = document.getElementById('density-menu');

        function closeMenu() {
          menu.classList.remove('is-open');
          toggleBtn.classList.remove('is-open');
          toggleBtn.setAttribute('aria-expanded', 'false');
        }

        toggleBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = menu.classList.contains('is-open');
          if (isOpen) {
            closeMenu();
          } else {
            menu.classList.add('is-open');
            toggleBtn.classList.add('is-open');
            toggleBtn.setAttribute('aria-expanded', 'true');
          }
        });

        document.addEventListener('click', function () { closeMenu(); });

        var items = document.querySelectorAll('.density-item[data-density]');
        items.forEach(function (item) {
          item.addEventListener('click', function (e) {
            e.stopPropagation();
            _density = item.getAttribute('data-density');
            updateDensityMenu();
            closeMenu();
            renderOverview();
          });
        });

        updateDensityMenu();
      }

      /* ── Bridge + load ──────────────────────────────────────────── */
      function parseQuery(search) {
        var q = (search || '').replace(/^\?/, '');
        var params = {};
        q.split('&').forEach(function (pair) {
          var idx = pair.indexOf('=');
          if (idx < 0) return;
          var k = decodeURIComponent(pair.slice(0, idx));
          var v = decodeURIComponent(pair.slice(idx + 1));
          params[k] = v;
        });
        return params;
      }

      function awaitBridge() {
        return new Promise(function (resolve) {
          if (window.soamView) return resolve(window.soamView);
          var iv = setInterval(function () {
            if (window.soamView) { clearInterval(iv); resolve(window.soamView); }
          }, 25);
        });
      }

      function loadAndRender() {
        if (!_proxy || !_clientId) return;

        Promise.all([
          _proxy.call('get', _clientId),
          _proxy.call('getProfile', _clientId),
          _proxy.call('getLifecycle', _clientId),
        ]).then(function (results) {
          var rec = results[0];
          var profile = results[1];
          var lifecycle = results[2];

          if (!rec) {
            showError('Client not found: ' + _clientId);
            return;
          }
          _record = rec;
          _profile = profile;
          _lifecycle = lifecycle;
          renderOverview();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked — unlock to view client.');
          } else {
            showError('Failed to load: ' + (err && err.message));
          }
        });
      }

      // Bind proxy once; shared between activate path and context-update path.
      var _soamView = null;

      function ensureProxyAndRender() {
        if (!_clientId || _clientId === 'new') return;
        if (_proxy) { loadAndRender(); return; }
        if (!_soamView) return;
        _soamView.bindQuery('record.patient.query', '1.0').then(function (proxy) {
          _proxy = proxy;
          loadAndRender();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked — unlock to view client.');
          } else {
            showError('Bridge error: ' + (err && err.message));
          }
        });
      }

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        if ((d.kind === 'init' || d.kind === 'theme') && d.theme) {
          var root = document.documentElement;
          Object.keys(d.theme).forEach(function (k) {
            root.style.setProperty(k, d.theme[k]);
          });
        }
        // context message: entityId pushed by BundleViewIframe on client switch.
        if (d.kind === 'context') {
          var newId = d.entityId || null;
          if (!newId) {
            // No active client — show empty state (keep current content; aux/panel unmounts anyway).
            _clientId = null;
            return;
          }
          if (newId !== _clientId) {
            _clientId = newId;
            ensureProxyAndRender();
          }
        }
      });

      awaitBridge().then(function (soamView) {
        elBridgeWait.style.display = 'none';
        elRoot.style.display = '';
        _soamView = soamView;

        initDensitySwitcher();

        // Do NOT read id from location.search — id arrives via context/activate message.

        soamView.events.onActivate(function () {
          // activate fires on first show; context message also arrives concurrently.
          // If _clientId already set by context handler, just ensure proxy + render.
          ensureProxyAndRender();
        });

        soamView.events.onStoreChange(function (payload) {
          if (payload && (payload.table === 'patients' || payload.table === 'patient_profile' || payload.table === 'patient_lifecycle')) {
            loadAndRender();
          }
        });
      });

    })();
    </script>
  </body>
</html>
