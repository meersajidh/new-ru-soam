<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Safety Plan</title>
    <style>

      /* ── Reset ──────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ── Design tokens (overridden via postMessage) ─────────────── */
      :root {
        color-scheme: light dark;
        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ───────────────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Bridge wait overlay ────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-base);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px; height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Root layout ────────────────────────────────────────────── */
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Status bar ─────────────────────────────────────────────── */
      #status-bar {
        font-size: 11px;
        padding: 5px 16px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 25%, transparent);
      }
      #status-bar.visible { display: block; }
      #status-bar.is-locked {
        background: color-mix(in srgb, var(--color-warning) 9%, transparent);
        color: var(--color-warning);
        border-color: color-mix(in srgb, var(--color-warning) 25%, transparent);
      }

      /* ── Header strip ───────────────────────────────────────────── */
      #header-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px 11px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-panel);
        flex-shrink: 0;
      }
      .hs-icon {
        color: var(--color-warning);
        flex: 0 0 auto;
      }
      .hs-title {
        font-size: 14px;
        font-weight: 600;
        flex: 1 1 auto;
      }
      .hs-client {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-family: var(--font-mono);
      }

      /* ── Scroll area ────────────────────────────────────────────── */
      #sp-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 28px 48px;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
      }

      /* ── Form card ──────────────────────────────────────────────── */
      #sp-card {
        max-width: 640px;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 24px 28px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #sp-card[data-maturity-id] { /* maturity hook */ }

      /* ── Section heading ────────────────────────────────────────── */
      .sp-section-head {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-fg-muted);
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--color-border);
      }

      /* ── Field ──────────────────────────────────────────────────── */
      .sp-field { display: flex; flex-direction: column; gap: 5px; }
      .sp-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--color-fg-secondary);
      }
      .sp-hint {
        font-size: 10px;
        color: var(--color-fg-muted);
        margin-top: 2px;
      }
      .sp-input {
        width: 100%;
        padding: 7px 10px;
        font-size: 12px;
        font-family: var(--font-sans);
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color var(--transition);
      }
      .sp-input:focus { border-color: var(--color-border-focus); }
      select.sp-input { appearance: none; cursor: pointer; }
      textarea.sp-input {
        resize: vertical;
        min-height: 72px;
        line-height: 1.5;
      }

      /* ── Checkbox row ───────────────────────────────────────────── */
      .sp-check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: var(--color-fg-secondary);
      }
      .sp-check-row input[type="checkbox"] {
        accent-color: var(--color-accent);
        width: 15px;
        height: 15px;
        cursor: pointer;
        flex: 0 0 auto;
      }

      /* ── Actions row ────────────────────────────────────────────── */
      #sp-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 4px;
        border-top: 1px solid var(--color-border);
      }
      .sp-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 500;
        font-family: var(--font-sans);
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-secondary);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
      }
      .sp-btn:hover { background: var(--color-surface-active); color: var(--color-fg-primary); }
      .sp-btn.primary {
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border-color: transparent;
      }
      .sp-btn.primary:hover { background: var(--color-success); }
      .sp-btn.primary:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
      #sp-save-msg {
        flex: 1;
        font-size: 11px;
        opacity: 0;
        transition: opacity var(--transition);
      }
      #sp-save-msg.visible { opacity: 1; }
      #sp-save-msg.ok  { color: var(--color-success); }
      #sp-save-msg.err { color: var(--color-error); }
    </style>
  </head>
  <body>
    <!-- Bridge wait overlay -->
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display:none">
      <div id="status-bar" role="alert"></div>

      <!-- Header strip -->
      <div id="header-strip">
        <span class="hs-icon" data-codicon="shield" data-size="15"></span>
        <span class="hs-title">Safety Plan</span>
        <span class="hs-client" id="hs-client"></span>
      </div>

      <div id="sp-scroll">
        <!-- Form card — populated by JS -->
        <div id="sp-card" data-maturity-id="safety-plan-editor">
          <div id="sp-loading" style="color:var(--color-fg-muted);font-size:12px;">Loading…</div>
        </div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── State ──────────────────────────────────────────────────── */
      var _queryProxy = null;
      var _cmdProxy   = null;
      var _clientId   = null;
      var _plan       = null;  // current safety plan or null
      var _saving     = false;
      var _saveMsgTimer = null;

      /* ── Elements ───────────────────────────────────────────────── */
      var elBridgeWait = document.getElementById('bridge-wait');
      var elRoot       = document.getElementById('root');
      var elStatusBar  = document.getElementById('status-bar');
      var elHsClient   = document.getElementById('hs-client');
      var elCard       = document.getElementById('sp-card');

      /* ── Field references (populated after buildForm) ───────────── */
      var elStatus     = null;
      var elSharedNr   = null;
      var elWarningSigns            = null;
      var elCopingStrategies        = null;
      var elSocialSettingsContacts  = null;
      var elHelpContacts            = null;
      var elProfAgencies            = null;
      var elMeansRestriction        = null;
      var elReasonsForLiving        = null;
      var elSaveBtn    = null;
      var elSaveMsg    = null;

      /* ── Helpers ────────────────────────────────────────────────── */
      function showError(msg) {
        elStatusBar.textContent = msg;
        elStatusBar.className = 'visible';
      }
      function showLocked(msg) {
        elStatusBar.textContent = msg;
        elStatusBar.className = 'visible is-locked';
      }
      function isLockedError(err) {
        return err && (err.code === 'cap.locked' ||
          (err.message && err.message.indexOf('cap.locked') !== -1));
      }
      function isNotFoundError(err) {
        return err && (err.code === 'cap.not_found' ||
          (err.message && err.message.indexOf('cap.not_found') !== -1));
      }

      /* ── Build form ─────────────────────────────────────────────── */
      function buildForm() {
        var plan = _plan;
        elCard.innerHTML = '';

        // ── Status + shared-NR row ────────────────────────────────
        var statusSection = document.createElement('div');

        var statusHead = document.createElement('div');
        statusHead.className = 'sp-section-head';
        statusHead.textContent = 'Plan status';
        statusSection.appendChild(statusHead);

        var statusField = document.createElement('div');
        statusField.className = 'sp-field';
        var statusLabel = document.createElement('label');
        statusLabel.className = 'sp-label';
        statusLabel.htmlFor = 'sp-status';
        statusLabel.textContent = 'Status';
        var statusSelect = document.createElement('select');
        statusSelect.className = 'sp-input';
        statusSelect.id = 'sp-status';
        [
          { value: 'none',         label: 'None' },
          { value: 'active',       label: 'Active' },
          { value: 'under_review', label: 'Under review' },
        ].forEach(function (opt) {
          var o = document.createElement('option');
          o.value = opt.value;
          o.textContent = opt.label;
          statusSelect.appendChild(o);
        });
        statusSelect.value = (plan && plan.status) ? plan.status : 'none';
        statusField.appendChild(statusLabel);
        statusField.appendChild(statusSelect);
        statusSection.appendChild(statusField);

        var checkRow = document.createElement('div');
        checkRow.className = 'sp-check-row';
        checkRow.style.marginTop = '10px';
        var checkInput = document.createElement('input');
        checkInput.type = 'checkbox';
        checkInput.id = 'sp-shared-nr';
        checkInput.checked = !!(plan && plan.sharedWithNr);
        var checkLabel = document.createElement('label');
        checkLabel.htmlFor = 'sp-shared-nr';
        checkLabel.textContent = 'Plan shared with Nominated Representative (NR)';
        checkRow.appendChild(checkInput);
        checkRow.appendChild(checkLabel);
        statusSection.appendChild(checkRow);
        elCard.appendChild(statusSection);

        // ── Stanley-Brown fields (India-adapted) ──────────────────
        var sbSection = document.createElement('div');
        var sbHead = document.createElement('div');
        sbHead.className = 'sp-section-head';
        sbHead.textContent = 'Safety plan content — Stanley-Brown (India-adapted)';
        sbSection.appendChild(sbHead);

        var FIELDS = [
          {
            id: 'sp-warning-signs',
            label: 'Warning signs',
            placeholder: 'Thoughts, images, mood, situation, behaviour that signal a crisis may be coming',
            key: 'warningSigns',
          },
          {
            id: 'sp-coping-strategies',
            label: 'Coping strategies',
            placeholder: 'Things I can do alone to distract or calm myself — incl. faith/spiritual practice, community rituals',
            key: 'copingStrategies',
          },
          {
            id: 'sp-social-settings',
            label: 'Social settings & people for distraction',
            placeholder: 'Places or family/community members who help me feel better without discussing crisis',
            key: 'socialSettingsContacts',
          },
          {
            id: 'sp-help-contacts',
            label: 'People I can ask for help',
            placeholder: 'Pull from People/Circle — NR is primary contact; add name & phone number',
            key: 'helpContacts',
          },
          {
            id: 'sp-prof-agencies',
            label: 'Professionals & agencies',
            placeholder: 'Tele-MANAS 14416 (national helpline); treating clinician; hospital contact',
            key: 'professionalAgencies',
          },
          {
            id: 'sp-means-restriction',
            label: 'Means restriction',
            placeholder: 'Pesticide/insecticide access, ligature points, medication quantity — consider family-held custody',
            key: 'meansRestriction',
          },
          {
            id: 'sp-reasons-living',
            label: 'Reasons for living',
            placeholder: 'Family, children, faith, goals, cultural obligations',
            key: 'reasonsForLiving',
          },
        ];

        var fieldEls = {};
        FIELDS.forEach(function (f) {
          var field = document.createElement('div');
          field.className = 'sp-field';
          field.style.marginBottom = '14px';
          var lbl = document.createElement('label');
          lbl.className = 'sp-label';
          lbl.htmlFor = f.id;
          lbl.textContent = f.label;
          var ta = document.createElement('textarea');
          ta.className = 'sp-input';
          ta.id = f.id;
          ta.rows = 3;
          ta.placeholder = f.placeholder;
          // Prefill Tele-MANAS placeholder only when field is empty and no saved value.
          var savedVal = plan ? (plan[f.key] || '') : '';
          ta.value = savedVal;
          if (!savedVal && f.key === 'professionalAgencies') {
            ta.placeholder = 'Tele-MANAS 14416 (national helpline); treating clinician; hospital contact';
          }
          field.appendChild(lbl);
          field.appendChild(ta);
          sbSection.appendChild(field);
          fieldEls[f.key] = ta;
        });

        elCard.appendChild(sbSection);

        // ── Actions ───────────────────────────────────────────────
        var actions = document.createElement('div');
        actions.id = 'sp-actions';

        var saveBtn = document.createElement('button');
        saveBtn.className = 'sp-btn primary';
        saveBtn.id = 'sp-save-btn';
        saveBtn.type = 'button';
        saveBtn.innerHTML = '<span data-codicon="save" data-size="12"></span> Save';

        var saveMsg = document.createElement('span');
        saveMsg.id = 'sp-save-msg';
        saveMsg.setAttribute('role', 'status');
        saveMsg.setAttribute('aria-live', 'polite');

        actions.appendChild(saveBtn);
        actions.appendChild(saveMsg);
        elCard.appendChild(actions);

        // Store field refs.
        elStatus    = statusSelect;
        elSharedNr  = checkInput;
        elWarningSigns           = fieldEls.warningSigns;
        elCopingStrategies       = fieldEls.copingStrategies;
        elSocialSettingsContacts = fieldEls.socialSettingsContacts;
        elHelpContacts           = fieldEls.helpContacts;
        elProfAgencies           = fieldEls.professionalAgencies;
        elMeansRestriction       = fieldEls.meansRestriction;
        elReasonsForLiving       = fieldEls.reasonsForLiving;
        elSaveBtn   = saveBtn;
        elSaveMsg   = saveMsg;

        // Bind save button.
        saveBtn.addEventListener('click', onSave);

        // Apply codicons.
        if (window.hydrateMaturity) window.hydrateMaturity(elCard);
        applyCodeicons(elCard);
      }

      function applyCodeicons(root) {
        var els = (root || document).querySelectorAll('[data-codicon]');
        for (var i = 0; i < els.length; i++) {
          var e = els[i];
          var name = e.getAttribute('data-codicon');
          var size = parseInt(e.getAttribute('data-size') || '13', 10);
          if (window.codicon) {
            e.innerHTML = window.codicon(name, size);
          }
        }
      }

      /* ── Save handler ───────────────────────────────────────────── */
      function showSaveMsg(msg, kind) {
        clearTimeout(_saveMsgTimer);
        if (!elSaveMsg) return;
        elSaveMsg.textContent = msg;
        elSaveMsg.className = 'visible ' + (kind || '');
        if (kind === 'ok') {
          _saveMsgTimer = setTimeout(function () {
            if (elSaveMsg) {
              elSaveMsg.className = '';
              elSaveMsg.textContent = '';
            }
          }, 2000);
        }
      }

      function onSave() {
        if (_saving || !_cmdProxy || !_clientId) return;
        var patch = {
          status:                  elStatus.value,
          sharedWithNr:            elSharedNr.checked,
          // Send '' for blanked fields (clear semantics per brief).
          warningSigns:            elWarningSigns.value,
          copingStrategies:        elCopingStrategies.value,
          socialSettingsContacts:  elSocialSettingsContacts.value,
          helpContacts:            elHelpContacts.value,
          professionalAgencies:    elProfAgencies.value,
          meansRestriction:        elMeansRestriction.value,
          reasonsForLiving:        elReasonsForLiving.value,
        };
        _saving = true;
        elSaveBtn.disabled = true;
        _cmdProxy.call('setSafetyPlan', _clientId, patch).then(function (updated) {
          _saving = false;
          elSaveBtn.disabled = false;
          _plan = updated;
          showSaveMsg('Saved.', 'ok');
          // Re-render to reflect saved state.
          buildForm();
        }).catch(function (err) {
          _saving = false;
          elSaveBtn.disabled = false;
          if (isLockedError(err)) {
            showSaveMsg('Workspace locked.', 'err');
          } else if (isNotFoundError(err)) {
            showSaveMsg('Client not found.', 'err');
          } else {
            showSaveMsg('Save failed: ' + (err && err.message), 'err');
          }
        });
      }

      /* ── Load data ──────────────────────────────────────────────── */
      function loadAndRender() {
        if (!_queryProxy || !_clientId) return;
        var queries = [
          _queryProxy.call('getSafetyPlan', _clientId),
          _queryProxy.call('get', _clientId),
        ];
        Promise.all(queries).then(function (results) {
          _plan = results[0];
          var rec = results[1];
          if (rec) {
            elHsClient.textContent = rec.displayName || rec.givenName || _clientId;
          }
          buildForm();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked — unlock to view.');
          } else {
            showError('Failed to load: ' + (err && err.message));
          }
        });
      }

      var _soamView = null;

      function ensureProxiesAndRender() {
        if (!_clientId) return;
        if (_queryProxy && _cmdProxy) { loadAndRender(); return; }
        if (!_soamView) return;
        var bindQ = _queryProxy ? Promise.resolve(_queryProxy)
          : _soamView.bindQuery('record.patient.query', '1.0');
        var bindC = _cmdProxy ? Promise.resolve(_cmdProxy)
          : _soamView.bindCommand('record.patient', '1.0');
        Promise.all([bindQ, bindC]).then(function (proxies) {
          _queryProxy = proxies[0];
          _cmdProxy   = proxies[1];
          loadAndRender();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked('Workspace locked.');
          } else {
            showError('Bridge error: ' + (err && err.message));
          }
        });
      }

      /* ── Parse query string ─────────────────────────────────────── */
      function parseQuery(search) {
        var q = (search || '').replace(/^\?/, '');
        var params = {};
        q.split('&').forEach(function (pair) {
          var idx = pair.indexOf('=');
          if (idx < 0) return;
          var k = decodeURIComponent(pair.slice(0, idx));
          var v = decodeURIComponent(pair.slice(idx + 1));
          params[k] = v;
        });
        return params;
      }

      /* ── Message handler (theme) ────────────────────────────────── */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        if ((d.kind === 'init' || d.kind === 'theme') && d.theme) {
          var root = document.documentElement;
          Object.keys(d.theme).forEach(function (k) {
            root.style.setProperty(k, d.theme[k]);
          });
        }
      });

      /* ── Bridge await ───────────────────────────────────────────── */
      function awaitBridge() {
        return new Promise(function (resolve) {
          if (window.soamView) return resolve(window.soamView);
          var iv = setInterval(function () {
            if (window.soamView) { clearInterval(iv); resolve(window.soamView); }
          }, 25);
        });
      }

      awaitBridge().then(function (soamView) {
        elBridgeWait.style.display = 'none';
        elRoot.style.display = '';
        _soamView = soamView;

        // Read clientId from location.search ?id= (opened via openInEditor).
        var params = parseQuery(window.location.search);
        _clientId = params.id || null;

        if (!_clientId) {
          showError('No client id in URL — open via Safety plan button.');
          return;
        }

        ensureProxiesAndRender();

        soamView.events.onStoreChange(function (payload) {
          if (payload && (
            payload.table === 'patient_safety_plan' ||
            payload.table === 'patients'
          )) {
            loadAndRender();
          }
        });
      });

    })();
    </script>
  </body>
</html>
