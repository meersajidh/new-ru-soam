<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Migrate clients</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
      input  { font: inherit; color: inherit; }

      /* ── Design tokens (injected via postMessage; fallbacks for cold load) ── */
      :root {
        color-scheme: light dark;
        --font-sans:              'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        --color-fg-primary:       #f2f2f7;
        --color-fg-secondary:     #aeaeb2;
        --color-fg-muted:         #636366;
        --color-border:           #3a3a3c;
        --color-border-focus:     #5ac85a;
        --color-accent:           #5ac85a;
        --color-accent-fg:        #1c1c1e;
        --color-accent-hover:     #6bd46b;
        --color-accent-pressed:   #4ab44a;
        --color-error:            #e05252;
        --color-warning:          #e0b34e;
        --color-info:             #4ea6e0;
        --radius-sm:  4px;
        --radius-md:  7px;
        --radius-card: 10px;
      }

      /* ── Base ─────────────────────────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Bridge wait overlay ──────────────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-base);
        z-index: 100;
        font-size: 12px;
        color: var(--color-fg-muted);
      }
      #bridge-wait.hidden { display: none; }

      /* ── Root ─────────────────────────────────────────────────────────────── */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      #root.hidden { display: none; }

      /* ── Work-area header ─────────────────────────────────────────────────── */
      .work-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px 12px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }

      .work-header-titles { flex: 1; min-width: 0; }

      .work-header-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--color-fg-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .work-header-sub {
        font-size: 11.5px;
        color: var(--color-fg-muted);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── Toolbar ──────────────────────────────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }

      .toolbar-status {
        flex: 1;
        font-size: 12px;
        color: var(--color-fg-muted);
      }
      .toolbar-status.scanning { color: var(--color-fg-secondary); }
      .toolbar-status.done     { color: var(--color-fg-muted); }
      .toolbar-status.error    { color: var(--color-error); }

      /* Select-all checkbox */
      .toolbar-select-all {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--color-fg-muted);
        cursor: pointer;
        flex-shrink: 0;
        user-select: none;
      }
      .toolbar-select-all input[type="checkbox"] {
        width: 14px;
        height: 14px;
        accent-color: var(--color-accent);
        cursor: pointer;
      }
      .toolbar-select-all.hidden { display: none; }

      .btn-refresh {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 500;
        color: var(--color-fg-secondary);
        border: 1px solid var(--color-border);
        background: var(--color-surface-elevated);
        transition: background 110ms ease, border-color 110ms ease;
        flex-shrink: 0;
      }
      .btn-refresh:hover:not(:disabled) {
        background: var(--color-surface-active);
        border-color: color-mix(in srgb, var(--color-fg-muted) 50%, transparent);
      }
      .btn-refresh:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ── Batch action bar ─────────────────────────────────────────────────── */
      #batch-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 20px;
        background: color-mix(in srgb, var(--color-accent) 8%, var(--color-surface-panel));
        border-bottom: 1px solid color-mix(in srgb, var(--color-accent) 20%, var(--color-border));
        flex-shrink: 0;
      }
      #batch-bar.hidden { display: none; }

      .batch-count {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }

      .batch-progress {
        font-size: 11.5px;
        color: var(--color-fg-muted);
        flex: 1;
        display: none;
      }
      .batch-progress.visible { display: block; }

      .btn-batch-promote {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 500;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border: none;
        transition: background 100ms ease, opacity 100ms ease;
        white-space: nowrap;
      }
      .btn-batch-promote:hover:not(:disabled) { background: var(--color-accent-hover); }
      .btn-batch-promote:active:not(:disabled) { background: var(--color-accent-pressed); }
      .btn-batch-promote:disabled { opacity: 0.45; cursor: not-allowed; }

      .btn-batch-exclude {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        background: transparent;
        transition: color 100ms ease, background 100ms ease, border-color 100ms ease;
        white-space: nowrap;
      }
      .btn-batch-exclude:hover:not(:disabled) {
        color: var(--color-error);
        border-color: color-mix(in srgb, var(--color-error) 40%, transparent);
        background: color-mix(in srgb, var(--color-error) 7%, transparent);
      }
      .btn-batch-exclude:disabled { opacity: 0.45; cursor: not-allowed; }

      .btn-batch-clear {
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-fg-muted);
        background: transparent;
        transition: color 100ms ease;
      }
      .btn-batch-clear:hover:not(:disabled) { color: var(--color-fg-secondary); }
      .btn-batch-clear:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ── Candidate list ───────────────────────────────────────────────────── */
      #list-area {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 25%, transparent) transparent;
      }

      .list-inner {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 8px 0;
        max-width: 720px;
        margin: 0 auto;
      }

      /* ── Candidate card ───────────────────────────────────────────────────── */
      .candidate-card {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 11px 20px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        transition: background 100ms ease;
      }
      .candidate-card:first-child { border-top: none; }
      .candidate-card:last-child  { border-bottom: none; }
      .candidate-card:hover {
        background: color-mix(in srgb, var(--color-fg-muted) 4%, transparent);
      }
      .candidate-card.is-selected {
        background: color-mix(in srgb, var(--color-accent) 5%, transparent);
      }
      .candidate-card.is-selected:hover {
        background: color-mix(in srgb, var(--color-accent) 8%, transparent);
      }

      /* Card checkbox */
      .card-checkbox-wrap {
        display: flex;
        align-items: center;
        padding-top: 9px;
        flex-shrink: 0;
      }
      .card-checkbox {
        width: 14px;
        height: 14px;
        accent-color: var(--color-accent);
        cursor: pointer;
      }

      /* Avatar initial */
      .candidate-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-secondary);
        margin-top: 1px;
        user-select: none;
      }

      .candidate-body { flex: 1; min-width: 0; }

      .candidate-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--color-fg-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .candidate-email {
        font-size: 12px;
        color: var(--color-fg-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 1px;
      }

      .candidate-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 1px 6px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .badge--none {
        color: var(--color-fg-muted);
        background: color-mix(in srgb, var(--color-fg-muted) 12%, transparent);
      }
      .badge--candidates {
        color: var(--color-warning);
        background: color-mix(in srgb, var(--color-warning) 12%, transparent);
      }

      .candidate-event-count {
        font-size: 11px;
        color: var(--color-fg-muted);
      }

      /* ── Confirm-candidate strip ──────────────────────────────────────────── */
      .confirm-strip {
        display: none;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--color-warning) 8%, var(--color-surface-elevated));
        border: 1px solid color-mix(in srgb, var(--color-warning) 20%, var(--color-border));
        flex-wrap: wrap;
      }
      .confirm-strip.visible { display: flex; }

      .confirm-strip-label {
        font-size: 11.5px;
        color: var(--color-fg-secondary);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn-confirm-match {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: var(--radius-sm);
        font-size: 11.5px;
        font-weight: 500;
        background: color-mix(in srgb, var(--color-warning) 15%, var(--color-surface-elevated));
        color: var(--color-warning);
        border: 1px solid color-mix(in srgb, var(--color-warning) 30%, transparent);
        transition: background 100ms ease;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn-confirm-match:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-warning) 22%, var(--color-surface-elevated));
      }
      .btn-confirm-match:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ── Action buttons ───────────────────────────────────────────────────── */
      .candidate-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        padding-top: 2px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn-promote {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 500;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border: none;
        transition: background 100ms ease, opacity 100ms ease;
        white-space: nowrap;
      }
      .btn-promote:hover:not(:disabled) { background: var(--color-accent-hover); }
      .btn-promote:active:not(:disabled) { background: var(--color-accent-pressed); }
      .btn-promote:disabled { opacity: 0.45; cursor: not-allowed; }

      .btn-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-info);
        border: 1px solid color-mix(in srgb, var(--color-info) 30%, transparent);
        background: color-mix(in srgb, var(--color-info) 7%, transparent);
        transition: background 100ms ease, border-color 100ms ease, opacity 100ms ease;
        white-space: nowrap;
      }
      .btn-link:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-info) 13%, transparent);
        border-color: color-mix(in srgb, var(--color-info) 45%, transparent);
      }
      .btn-link:disabled { opacity: 0.45; cursor: not-allowed; }

      .btn-exclude {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        background: transparent;
        transition: color 100ms ease, background 100ms ease, border-color 100ms ease;
        white-space: nowrap;
      }
      .btn-exclude:hover:not(:disabled) {
        color: var(--color-error);
        border-color: color-mix(in srgb, var(--color-error) 40%, transparent);
        background: color-mix(in srgb, var(--color-error) 7%, transparent);
      }
      .btn-exclude:disabled { opacity: 0.45; cursor: not-allowed; }

      /* Inline confirmation / error strip */
      .card-feedback {
        font-size: 11.5px;
        margin-top: 5px;
        padding: 3px 0;
        display: none;
      }
      .card-feedback.visible { display: block; }
      .card-feedback--ok    { color: var(--color-accent); }
      .card-feedback--error { color: var(--color-error); }

      /* ── Empty / done state ───────────────────────────────────────────────── */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        min-height: 200px;
        text-align: center;
        padding: 32px 24px;
        color: var(--color-fg-muted);
      }
      .empty-state-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-fg-muted);
        font-size: 18px;
      }
      .empty-state-heading {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-secondary);
      }
      .empty-state-body {
        font-size: 12px;
        color: var(--color-fg-muted);
        max-width: 280px;
        line-height: 1.55;
      }

      /* ── Show-more pager ──────────────────────────────────────────────────── */
      .pager-row {
        display: flex;
        justify-content: center;
        padding: 16px 20px;
      }
      .btn-show-more {
        padding: 6px 16px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        background: transparent;
        transition: color 110ms ease, background 110ms ease;
      }
      .btn-show-more:hover { color: var(--color-fg-secondary); background: var(--color-surface-elevated); }

      /* ── Spinner (inline pulse) ───────────────────────────────────────────── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1.5px solid color-mix(in srgb, var(--color-fg-muted) 30%, transparent);
        border-top-color: var(--color-fg-muted);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
        vertical-align: middle;
      }

      /* ── Possible-duplicates section ─────────────────────────────────────── */
      #dedup-section {
        flex-shrink: 0;
        border-bottom: 2px solid var(--color-border);
      }
      #dedup-section.hidden { display: none; }

      .dedup-section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 20px 5px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-fg-muted);
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
      }

      .dedup-clusters {
        display: flex;
        flex-direction: column;
        max-height: 300px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 25%, transparent) transparent;
      }

      .dedup-cluster-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 20px 11px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .dedup-cluster-card:last-child { border-bottom: none; }

      .badge--dedup-contact {
        color: var(--color-info);
        background: color-mix(in srgb, var(--color-info) 12%, transparent);
      }
      .badge--dedup-heuristic {
        color: var(--color-warning);
        background: color-mix(in srgb, var(--color-warning) 12%, transparent);
      }

      .dedup-members {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: 2px;
      }

      .dedup-member-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dedup-member-radio {
        width: 14px;
        height: 14px;
        accent-color: var(--color-accent);
        cursor: pointer;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .dedup-member-radio:disabled { cursor: not-allowed; }

      .dedup-member-name {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--color-fg-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }

      .dedup-member-email {
        font-size: 11.5px;
        color: var(--color-fg-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        flex-shrink: 0;
      }

      .dedup-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }

      .btn-dedup-merge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 11px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 500;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border: none;
        transition: background 100ms ease, opacity 100ms ease;
        white-space: nowrap;
      }
      .btn-dedup-merge:hover:not(:disabled) { background: var(--color-accent-hover); }
      .btn-dedup-merge:active:not(:disabled) { background: var(--color-accent-pressed); }
      .btn-dedup-merge:disabled { opacity: 0.45; cursor: not-allowed; }

      .btn-dedup-keep {
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-fg-muted);
        border: 1px solid var(--color-border);
        background: transparent;
        transition: color 100ms ease, background 100ms ease;
        white-space: nowrap;
      }
      .btn-dedup-keep:hover:not(:disabled) { color: var(--color-fg-secondary); background: var(--color-surface-elevated); }
      .btn-dedup-keep:disabled { opacity: 0.45; cursor: not-allowed; }

      .dedup-feedback {
        font-size: 11.5px;
        margin-top: 2px;
        display: none;
      }
      .dedup-feedback.visible { display: block; }
      .dedup-feedback--ok    { color: var(--color-accent); }
      .dedup-feedback--error { color: var(--color-error); }

      /* ── Roster picker modal ─────────────────────────────────────────────── */
      #picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #picker-overlay.hidden { display: none; }

      .picker-modal {
        background: var(--color-surface-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        width: 360px;
        max-width: calc(100vw - 40px);
        max-height: 480px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      .picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 10px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }

      .picker-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-fg-primary);
      }

      .picker-subtitle {
        font-size: 11.5px;
        color: var(--color-fg-muted);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 280px;
      }

      .picker-close {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        color: var(--color-fg-muted);
        flex-shrink: 0;
        transition: color 100ms ease, background 100ms ease;
      }
      .picker-close:hover { color: var(--color-fg-secondary); background: var(--color-surface-elevated); }

      .picker-search-wrap {
        padding: 8px 12px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }

      .picker-search {
        width: 100%;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-surface-elevated);
        color: var(--color-fg-primary);
        font-size: 12.5px;
        outline: none;
        transition: border-color 100ms ease;
      }
      .picker-search:focus { border-color: var(--color-border-focus); }
      .picker-search::placeholder { color: var(--color-fg-muted); }

      .picker-list {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 25%, transparent) transparent;
      }

      .picker-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        cursor: pointer;
        transition: background 80ms ease;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
      }
      .picker-item:last-child { border-bottom: none; }
      .picker-item:hover { background: var(--color-surface-elevated); }
      .picker-item:active { background: var(--color-surface-active); }

      .picker-item-avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
        border: 1px solid transparent;
      }

      .picker-item-name {
        font-size: 12.5px;
        color: var(--color-fg-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      .picker-empty {
        padding: 24px 16px;
        text-align: center;
        font-size: 12px;
        color: var(--color-fg-muted);
      }

      .picker-status {
        padding: 10px 16px;
        font-size: 11.5px;
        color: var(--color-fg-muted);
        border-top: 1px solid var(--color-border);
        flex-shrink: 0;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .picker-status--error { color: var(--color-error); }
    </style>
  </head>
  <body>
    <div id="bridge-wait">Connecting...</div>
    <div id="root" class="hidden">

      <!-- ── Work-area header ──────────────────────────────────────────────── -->
      <div class="work-header">
        <div class="work-header-titles">
          <div class="work-header-title" id="hdr-title">Migrate clients</div>
          <div class="work-header-sub" id="hdr-sub">Loading calendar...</div>
        </div>
      </div>

      <!-- ── Toolbar ───────────────────────────────────────────────────────── -->
      <div class="toolbar">
        <span class="toolbar-status" id="toolbar-status"></span>
        <label class="toolbar-select-all hidden" id="toolbar-select-all-wrap">
          <input type="checkbox" id="chk-select-all" />
          All
        </label>
        <button id="btn-refresh" class="btn-refresh" type="button" title="Re-scan this calendar">
          <span data-codicon="refresh" data-size="13"></span>
          Refresh
        </button>
      </div>

      <!-- ── Batch action bar ──────────────────────────────────────────────── -->
      <div id="batch-bar" class="hidden">
        <span class="batch-count" id="batch-count"></span>
        <span class="batch-progress hidden" id="batch-progress"></span>
        <button id="btn-batch-promote" class="btn-batch-promote" type="button">
          <span data-codicon="person" data-size="12"></span>
          Add as clients
        </button>
        <button id="btn-batch-exclude" class="btn-batch-exclude" type="button">Exclude</button>
        <button id="btn-batch-clear" class="btn-batch-clear" type="button">Clear</button>
      </div>

      <!-- ── Possible duplicates ──────────────────────────────────────────── -->
      <div id="dedup-section" class="hidden">
        <div class="dedup-section-header">
          <span data-codicon="group-by-ref-type" data-size="11"></span>
          Possible duplicates
        </div>
        <div id="dedup-clusters" class="dedup-clusters"></div>
      </div>

      <!-- ── Candidate list ────────────────────────────────────────────────── -->
      <div id="list-area">
        <div id="list-inner" class="list-inner"></div>
      </div>

    </div>

    <!-- ── Roster picker modal ──────────────────────────────────────────────── -->
    <div id="picker-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Link to existing client">
      <div class="picker-modal">
        <div class="picker-header">
          <div>
            <div class="picker-title">Link to existing client</div>
            <div class="picker-subtitle" id="picker-subtitle"></div>
          </div>
          <button type="button" class="picker-close" id="picker-close" title="Cancel">
            <span data-codicon="close" data-size="14"></span>
          </button>
        </div>
        <div class="picker-search-wrap">
          <input
            type="text"
            class="picker-search"
            id="picker-search"
            placeholder="Search clients..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="picker-list" id="picker-list"></div>
        <div class="picker-status" id="picker-status"></div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── Avatar accent palette (5 colours, cycled by first-char code) ──────── */
      var AVATAR_COLORS = [
        { bg: '#2a3a2e', fg: '#5ac85a' },
        { bg: '#2a3040', fg: '#4ea6e0' },
        { bg: '#352a40', fg: '#9b78e0' },
        { bg: '#3a2e2a', fg: '#e07857' },
        { bg: '#2a3a3a', fg: '#4eccc4' },
      ];

      var PAGE_SIZE = 50;

      /* ── Module state ────────────────────────────────────────────────────── */
      var boot           = window.__viewBoot;
      var queryCap       = null;  /* record.migration.query */
      var cmdCap         = null;  /* record.migration */
      var patientCmd     = null;  /* record.patient (command) */
      var patientQuery   = null;  /* record.patient.query */
      var schQueryCap    = null;  /* schedule.calendar.query (cross-bundle view-bind) */
      var _calendarId    = null;
      var _scanning      = false;
      var _candidates    = [];    /* transient; re-populated on each run() */
      var _shownCount    = PAGE_SIZE;

      /* ── Dedup state ─────────────────────────────────────────────────────── */
      var _clusters          = [];           /* listDuplicates result */
      var _dismissedClusters = new Set();   /* clusterId; persists within session */

      /* ── Selection state ─────────────────────────────────────────────────── */
      var _selected      = new Set();  /* Set<participantKey> */
      var _batchRunning  = false;

      /* ── Picker state ────────────────────────────────────────────────────── */
      var _pickerCandidate    = null;  /* candidate being linked */
      var _pickerTargetClient = null;  /* client id pre-resolved for confirm-match */
      var _rosterCache        = null;  /* cached list() result */

      /* ── DOM refs ────────────────────────────────────────────────────────── */
      var elBridgeWait         = document.getElementById('bridge-wait');
      var elRoot               = document.getElementById('root');
      var elHdrTitle           = document.getElementById('hdr-title');
      var elHdrSub             = document.getElementById('hdr-sub');
      var elToolbarStatus      = document.getElementById('toolbar-status');
      var elSelectAllWrap      = document.getElementById('toolbar-select-all-wrap');
      var elChkSelectAll       = document.getElementById('chk-select-all');
      var elBtnRefresh         = document.getElementById('btn-refresh');
      var elBatchBar           = document.getElementById('batch-bar');
      var elBatchCount         = document.getElementById('batch-count');
      var elBatchProgress      = document.getElementById('batch-progress');
      var elBtnBatchPromote    = document.getElementById('btn-batch-promote');
      var elBtnBatchExclude    = document.getElementById('btn-batch-exclude');
      var elBtnBatchClear      = document.getElementById('btn-batch-clear');
      var elListInner          = document.getElementById('list-inner');
      var elDedupSection       = document.getElementById('dedup-section');
      var elDedupClusters      = document.getElementById('dedup-clusters');

      /* Picker */
      var elPickerOverlay  = document.getElementById('picker-overlay');
      var elPickerSubtitle = document.getElementById('picker-subtitle');
      var elPickerClose    = document.getElementById('picker-close');
      var elPickerSearch   = document.getElementById('picker-search');
      var elPickerList     = document.getElementById('picker-list');
      var elPickerStatus   = document.getElementById('picker-status');

      /* ── Query params ────────────────────────────────────────────────────── */
      var _params = boot.parseQuery ? boot.parseQuery(window.location.search) : (function () {
        var p = {};
        var s = window.location.search.slice(1);
        if (s) s.split('&').forEach(function (part) {
          var kv = part.split('=');
          p[decodeURIComponent(kv[0])] = decodeURIComponent(kv.slice(1).join('='));
        });
        return p;
      })();
      _calendarId = _params['calendarId'] || null;

      /* ── Avatar helpers ──────────────────────────────────────────────────── */
      function avatarInitial(name, email) {
        var src = name || email || '?';
        return (src[0] || '?').toUpperCase();
      }

      function avatarColor(initial) {
        var code = initial.charCodeAt(0) || 0;
        return AVATAR_COLORS[code % AVATAR_COLORS.length];
      }

      /* ── Status helpers ──────────────────────────────────────────────────── */
      function setStatus(text, cls) {
        elToolbarStatus.textContent = text;
        elToolbarStatus.className = 'toolbar-status' + (cls ? ' ' + cls : '');
      }

      /* Re-derive the toolbar count after optimistic row removals. */
      function updateCount() {
        var n = _candidates.length;
        if (n === 0) {
          setStatus('No unrecognised people found.', 'done');
        } else {
          setStatus(n + ' unrecognised ' + (n === 1 ? 'person' : 'people') + ' found.', 'done');
        }
        /* Show/hide select-all control */
        if (n > 0 && !_scanning) {
          elSelectAllWrap.classList.remove('hidden');
        } else {
          elSelectAllWrap.classList.add('hidden');
        }
      }

      /* ── Selection helpers ───────────────────────────────────────────────── */
      function getParticipantKey(candidate) {
        /* Use participantKey if present, else derive from email/name */
        return candidate.participantKey || (candidate.seedEmail || candidate.seedName || '');
      }

      function updateSelectionUI() {
        /* Update batch bar */
        var n = _selected.size;
        if (n > 0 && !_batchRunning) {
          elBatchBar.classList.remove('hidden');
          elBatchCount.textContent = n + ' selected';
          elBatchProgress.classList.remove('visible');
        } else if (n === 0) {
          elBatchBar.classList.add('hidden');
        }

        /* Sync select-all checkbox indeterminate/checked state */
        var total = Math.min(_candidates.length, _shownCount);
        if (n === 0) {
          elChkSelectAll.checked = false;
          elChkSelectAll.indeterminate = false;
        } else if (n >= total) {
          elChkSelectAll.checked = true;
          elChkSelectAll.indeterminate = false;
        } else {
          elChkSelectAll.checked = false;
          elChkSelectAll.indeterminate = true;
        }
      }

      function clearSelection() {
        _selected.clear();
        /* Uncheck all visible card checkboxes */
        var checkboxes = elListInner.querySelectorAll('.card-checkbox');
        for (var i = 0; i < checkboxes.length; i++) {
          checkboxes[i].checked = false;
        }
        var cards = elListInner.querySelectorAll('.candidate-card');
        for (var j = 0; j < cards.length; j++) {
          cards[j].classList.remove('is-selected');
        }
        elBatchBar.classList.add('hidden');
        elChkSelectAll.checked = false;
        elChkSelectAll.indeterminate = false;
      }

      /* ── Load calendar name for header ───────────────────────────────────── */
      function loadCalendarName() {
        if (!schQueryCap || !_calendarId) return;
        schQueryCap.call('listAddedCalendars').then(function (cals) {
          cals = cals || [];
          var cal = null;
          for (var i = 0; i < cals.length; i++) {
            if (cals[i].id === _calendarId) { cal = cals[i]; break; }
          }
          if (cal && cal.displayName) {
            elHdrSub.textContent = cal.displayName;
          } else {
            elHdrSub.textContent = _calendarId || '';
          }
        }).catch(function () {
          elHdrSub.textContent = _calendarId || '';
        });
      }

      /* ── Roster cache ────────────────────────────────────────────────────── */
      function getRoster() {
        if (_rosterCache) return Promise.resolve(_rosterCache);
        if (!patientQuery) return Promise.reject(new Error('Not ready'));
        return patientQuery.call('list').then(function (rows) {
          _rosterCache = rows || [];
          return _rosterCache;
        });
      }

      /* Invalidate roster cache after a promote (new client now in roster) */
      function invalidateRoster() {
        _rosterCache = null;
      }

      /* ── Dedup: load + render cluster cards ──────────────────────────────── */

      function loadDuplicates() {
        if (!queryCap || !_calendarId) return;
        queryCap.call('listDuplicates', _calendarId).then(function (result) {
          _clusters = (result && Array.isArray(result.clusters)) ? result.clusters : [];
          renderDedupSection();
        }).catch(function () {
          _clusters = [];
          renderDedupSection();
        });
      }

      function renderDedupSection() {
        var visible = _clusters.filter(function (c) {
          return !_dismissedClusters.has(c.clusterId);
        });
        if (visible.length === 0) {
          elDedupSection.classList.add('hidden');
          elDedupClusters.innerHTML = '';
          return;
        }
        elDedupSection.classList.remove('hidden');
        elDedupClusters.innerHTML = '';
        visible.forEach(function (cluster) {
          elDedupClusters.appendChild(buildClusterCard(cluster));
        });
        if (boot.applyCodicons) boot.applyCodicons();
      }

      function buildClusterCard(cluster) {
        var card = document.createElement('div');
        card.className = 'dedup-cluster-card';

        /* Reason badge */
        var reasonEl = document.createElement('div');
        var reasonBadge = document.createElement('span');
        reasonBadge.className = 'badge ' + (cluster.reason === 'contact' ? 'badge--dedup-contact' : 'badge--dedup-heuristic');
        reasonBadge.textContent = cluster.reason === 'contact'
          ? 'Grouped in your Google Contacts'
          : 'Similar name or shared phone';
        reasonEl.appendChild(reasonBadge);
        card.appendChild(reasonEl);

        /* Members with primary radio picker */
        var radioName = 'dedup-primary-' + cluster.clusterId;
        var membersEl = document.createElement('div');
        membersEl.className = 'dedup-members';

        cluster.members.forEach(function (member, idx) {
          var row = document.createElement('div');
          row.className = 'dedup-member-row';

          var radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = radioName;
          radio.className = 'dedup-member-radio';
          radio.value = member.participantKey;
          radio.checked = (idx === 0);

          var nameEl = document.createElement('div');
          nameEl.className = 'dedup-member-name';
          /* PHI-safe textContent */
          nameEl.textContent = member.seedName || member.seedEmail || member.participantKey;

          row.appendChild(radio);
          row.appendChild(nameEl);

          if (member.seedEmail && member.seedEmail !== (member.seedName || '')) {
            var emailEl = document.createElement('div');
            emailEl.className = 'dedup-member-email';
            /* PHI-safe textContent */
            emailEl.textContent = member.seedEmail;
            row.appendChild(emailEl);
          }

          membersEl.appendChild(row);
        });

        card.appendChild(membersEl);

        /* Feedback strip */
        var feedbackEl = document.createElement('div');
        feedbackEl.className = 'dedup-feedback';
        card.appendChild(feedbackEl);

        /* Action buttons */
        var actionsEl = document.createElement('div');
        actionsEl.className = 'dedup-actions';

        var mergeBtn = document.createElement('button');
        mergeBtn.type = 'button';
        mergeBtn.className = 'btn-dedup-merge';
        mergeBtn.textContent = 'Confirm merge';

        var keepBtn = document.createElement('button');
        keepBtn.type = 'button';
        keepBtn.className = 'btn-dedup-keep';
        keepBtn.textContent = 'Keep separate';

        actionsEl.appendChild(mergeBtn);
        actionsEl.appendChild(keepBtn);
        card.appendChild(actionsEl);

        function setClusterBusy(busy) {
          mergeBtn.disabled = busy;
          keepBtn.disabled = busy;
          var radios = card.querySelectorAll('input[type="radio"]');
          for (var i = 0; i < radios.length; i++) { radios[i].disabled = busy; }
        }

        mergeBtn.addEventListener('click', function () {
          if (mergeBtn.disabled) return;

          /* Resolve chosen primary */
          var selectedKey = null;
          var radios = card.querySelectorAll('input[name="' + radioName + '"]');
          for (var i = 0; i < radios.length; i++) {
            if (radios[i].checked) { selectedKey = radios[i].value; break; }
          }

          var primary = null;
          var others = [];
          cluster.members.forEach(function (m) {
            if (m.participantKey === selectedKey) { primary = m; }
            else { others.push(m); }
          });
          if (!primary) { primary = cluster.members[0]; others = cluster.members.slice(1); }

          setClusterBusy(true);
          feedbackEl.className = 'dedup-feedback';
          feedbackEl.textContent = '';

          doMergeCluster(primary, others).then(function () {
            feedbackEl.className = 'dedup-feedback visible dedup-feedback--ok';
            feedbackEl.textContent = 'Merged into one client.';
            /* Re-scan drops the now-promoted candidates from the cache */
            setTimeout(function () { runScan(); }, 700);
          }).catch(function (err) {
            setClusterBusy(false);
            var msg = (err && err.message) ? err.message : 'Merge failed. Try again.';
            feedbackEl.className = 'dedup-feedback visible dedup-feedback--error';
            feedbackEl.textContent = msg;
          });
        });

        keepBtn.addEventListener('click', function () {
          if (keepBtn.disabled) return;
          _dismissedClusters.add(cluster.clusterId);
          renderDedupSection();
        });

        return card;
      }

      /**
       * Merge cluster: promote primary as migrated client, alias the rest.
       * Returns a Promise.
       */
      function doMergeCluster(primary, others) {
        if (!patientCmd) return Promise.reject(new Error('Not ready — try again.'));

        var seedName  = primary.seedName  || '';
        var seedEmail = primary.seedEmail || '';
        var seedPhone = primary.seedPhone || '';

        var displaySrc = seedName || seedEmail || '';
        var parts = displaySrc.trim().split(/\s+/);
        var givenName  = parts[0] || seedEmail || 'Unknown';
        var familyName = parts.length > 1 ? parts.slice(1).join(' ') : undefined;

        var createPayload = { givenName: givenName };
        if (familyName)  createPayload.familyName    = familyName;
        if (seedEmail)   createPayload.contactEmail  = seedEmail;
        if (seedPhone)   createPayload.contactPhone  = seedPhone;

        var newId = null;

        return patientCmd.call('create', createPayload)
          .then(function (newClient) {
            newId = newClient && (newClient.id || newClient.patient_id || newClient.patientId);
            if (!newId) throw new Error('create returned no id');
            return patientCmd.call('setStage', newId, 'migrated', 'migration');
          })
          .then(function () {
            /* Alias each non-primary member (chain Promises sequentially) */
            var p = Promise.resolve();
            others.forEach(function (m) {
              p = p.then(function () {
                var aliasInput = {};
                if (m.seedEmail) aliasInput.email = m.seedEmail;
                if (m.seedPhone) aliasInput.phone = m.seedPhone;
                if (m.seedName)  aliasInput.name  = m.seedName;
                if (!aliasInput.email && !aliasInput.phone && !aliasInput.name) return;
                return patientCmd.call('addAlias', newId, aliasInput);
              });
            });
            return p;
          })
          .then(function () {
            invalidateRoster();
          });
      }

      /* ── Core single-card actions (reused by batch) ──────────────────────── */

      /**
       * Promote a candidate to a migrated client record.
       * Returns a Promise that resolves on success, rejects on failure.
       */
      function doPromote(candidate) {
        if (!patientCmd) return Promise.reject(new Error('Not ready — try again.'));

        var seedName  = candidate.seedName  || '';
        var seedEmail = candidate.seedEmail || '';

        var displaySrc = seedName || seedEmail || '';
        var parts = displaySrc.trim().split(/\s+/);
        var givenName  = parts[0] || seedEmail || 'Unknown';
        var familyName = parts.length > 1 ? parts.slice(1).join(' ') : undefined;

        var createPayload = { givenName: givenName };
        if (familyName) createPayload.familyName = familyName;
        if (seedEmail)  createPayload.contactEmail = seedEmail;

        return patientCmd.call('create', createPayload)
          .then(function (newClient) {
            var newId = newClient && (newClient.id || newClient.patient_id || newClient.patientId);
            if (!newId) throw new Error('create returned no id');
            return patientCmd.call('setStage', newId, 'migrated', 'migration');
          })
          .then(function () {
            invalidateRoster();
          });
      }

      /**
       * Exclude a candidate via suppressParticipant.
       * Returns a Promise.
       */
      function doExclude(candidate) {
        var seedEmail = candidate.seedEmail || '';
        if (!seedEmail) {
          /* No email — only remove from transient list (no hash-suppress possible) */
          return Promise.resolve();
        }
        if (!patientCmd) return Promise.reject(new Error('Not ready — try again.'));
        return patientCmd.call('suppressParticipant', { email: seedEmail, calendarId: _calendarId || '' });
      }

      /**
       * Link a candidate to an existing client by adding an alias.
       * addAlias(clientId, { email?, phone? }) — POSITIONAL.
       * Returns a Promise.
       */
      function doLink(candidate, clientId) {
        if (!patientCmd) return Promise.reject(new Error('Not ready — try again.'));
        var seedEmail = candidate.seedEmail || '';
        var seedPhone = candidate.seedPhone || '';
        if (!seedEmail && !seedPhone) {
          return Promise.reject(new Error('No email or phone to link with.'));
        }
        var aliasInput = {};
        if (seedEmail) aliasInput.email = seedEmail;
        if (seedPhone) aliasInput.phone = seedPhone;
        return patientCmd.call('addAlias', clientId, aliasInput)
          .then(function () {
            invalidateRoster();
          });
      }

      /* ── Run migration scan ──────────────────────────────────────────────── */
      function runScan() {
        if (_scanning) return;
        if (!cmdCap) { setStatus('Not ready — try again.', 'error'); return; }
        if (!_calendarId) { setStatus('No calendar selected.', 'error'); return; }

        _scanning = true;
        _candidates = [];
        _clusters = [];
        _shownCount = PAGE_SIZE;
        _selected.clear();
        elBatchBar.classList.add('hidden');
        elSelectAllWrap.classList.add('hidden');
        elBtnRefresh.disabled = true;
        setStatus('Scanning calendar...', 'scanning');
        renderDedupSection(); /* hide dedup section while scanning */
        renderList();

        cmdCap.call('run', _calendarId).then(function (result) {
          _scanning = false;
          elBtnRefresh.disabled = false;

          /* result = { candidates: [...] } */
          var list = (result && Array.isArray(result.candidates)) ? result.candidates : [];
          _candidates = list;
          if (list.length === 0) {
            setStatus('No unrecognised people found.', 'done');
          } else {
            setStatus(list.length + ' unrecognised ' + (list.length === 1 ? 'person' : 'people') + ' found.', 'done');
          }
          renderList();
          updateCount();
          loadDuplicates(); /* derive + render cluster cards above the candidate list */
        }).catch(function (err) {
          _scanning = false;
          elBtnRefresh.disabled = false;
          var msg = (err && err.message) ? err.message : 'Scan failed. Try again.';
          setStatus(msg, 'error');
          renderList();
        });
      }

      /* ── Render candidate list ───────────────────────────────────────────── */
      function renderList() {
        elListInner.innerHTML = '';

        if (_scanning) {
          var scanEl = document.createElement('div');
          scanEl.className = 'empty-state';
          var sp = document.createElement('span');
          sp.className = 'spinner';
          var msg = document.createElement('div');
          msg.className = 'empty-state-body';
          msg.textContent = 'Scanning calendar events for unrecognised participants...';
          scanEl.appendChild(sp);
          scanEl.appendChild(msg);
          elListInner.appendChild(scanEl);
          return;
        }

        var visible = _candidates.slice(0, _shownCount);

        if (_candidates.length === 0) {
          var emptyEl = document.createElement('div');
          emptyEl.className = 'empty-state';

          var iconEl = document.createElement('div');
          iconEl.className = 'empty-state-icon';
          var sp2 = document.createElement('span');
          sp2.setAttribute('data-codicon', 'check');
          sp2.setAttribute('data-size', '18');
          iconEl.appendChild(sp2);

          var headEl = document.createElement('div');
          headEl.className = 'empty-state-heading';
          headEl.textContent = 'No unrecognised people';

          var bodyEl = document.createElement('div');
          bodyEl.className = 'empty-state-body';
          bodyEl.textContent = 'No unrecognised people — this calendar is migrated.';

          emptyEl.appendChild(iconEl);
          emptyEl.appendChild(headEl);
          emptyEl.appendChild(bodyEl);
          elListInner.appendChild(emptyEl);
          return;
        }

        visible.forEach(function (candidate, idx) {
          elListInner.appendChild(buildCard(candidate, idx));
        });

        /* Show-more pager */
        if (_candidates.length > _shownCount) {
          var remaining = _candidates.length - _shownCount;
          var pagerEl = document.createElement('div');
          pagerEl.className = 'pager-row';
          var moreBtn = document.createElement('button');
          moreBtn.type = 'button';
          moreBtn.className = 'btn-show-more';
          moreBtn.textContent = 'Show ' + remaining + ' more';
          moreBtn.addEventListener('click', function () {
            _shownCount += PAGE_SIZE;
            renderList();
          });
          pagerEl.appendChild(moreBtn);
          elListInner.appendChild(pagerEl);
        }

        /* Re-apply codicons for dynamically created elements */
        if (boot.applyCodicons) boot.applyCodicons();
      }

      /* ── Build single candidate card ─────────────────────────────────────── */
      function buildCard(candidate, idx) {
        /* candidate: { participantKey, seedName, seedEmail, seedPhone?, eventRefs, outcome, candidates? } */
        var seedName  = candidate.seedName  || '';
        var seedEmail = candidate.seedEmail || '';
        var seedPhone = candidate.seedPhone || '';
        var outcome   = candidate.outcome   || 'none';
        var eventRefs = candidate.eventRefs || 0;
        var pKey      = getParticipantKey(candidate);

        var hasIdentifier = !!(seedEmail || seedPhone);
        var hasCandidates = outcome === 'candidates' && Array.isArray(candidate.candidates) && candidate.candidates.length > 0;

        var initial = avatarInitial(seedName, seedEmail);
        var ac      = avatarColor(initial);

        var card = document.createElement('div');
        card.className = 'candidate-card' + (_selected.has(pKey) ? ' is-selected' : '');
        card.setAttribute('data-idx', String(idx));
        card.setAttribute('data-pkey', pKey);

        /* ── Checkbox ──────────────────────────────────────────────────────── */
        var chkWrap = document.createElement('div');
        chkWrap.className = 'card-checkbox-wrap';
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'card-checkbox';
        chk.checked = _selected.has(pKey);
        chk.setAttribute('aria-label', 'Select ' + (seedName || seedEmail || 'this person'));
        chkWrap.appendChild(chk);
        card.appendChild(chkWrap);

        /* Avatar */
        var avatar = document.createElement('div');
        avatar.className = 'candidate-avatar';
        avatar.style.background = ac.bg;
        avatar.style.color = ac.fg;
        avatar.style.borderColor = 'transparent';
        /* textContent safe: initial letter only, not the name */
        avatar.textContent = initial;
        card.appendChild(avatar);

        /* Body */
        var body = document.createElement('div');
        body.className = 'candidate-body';

        var nameEl = document.createElement('div');
        nameEl.className = 'candidate-name';
        /* PHI-safe textContent */
        nameEl.textContent = seedName || seedEmail || 'Unknown';
        body.appendChild(nameEl);

        if (seedEmail && seedEmail !== seedName) {
          var emailEl = document.createElement('div');
          emailEl.className = 'candidate-email';
          /* PHI-safe textContent */
          emailEl.textContent = seedEmail;
          body.appendChild(emailEl);
        }

        var meta = document.createElement('div');
        meta.className = 'candidate-meta';

        /* Outcome badge */
        var badge = document.createElement('span');
        if (hasCandidates) {
          badge.className = 'badge badge--candidates';
          badge.textContent = 'Possible match';
        } else {
          badge.className = 'badge badge--none';
          badge.textContent = 'Unknown';
        }
        meta.appendChild(badge);

        /* Event count */
        if (eventRefs > 0) {
          var evEl = document.createElement('span');
          evEl.className = 'candidate-event-count';
          evEl.textContent = eventRefs + ' ' + (eventRefs === 1 ? 'meeting' : 'meetings');
          meta.appendChild(evEl);
        }

        body.appendChild(meta);

        /* ── Confirm-candidate strip (outcome === 'candidates') ────────────── */
        /* Rendered per candidate ID; names fetched async below */
        var confirmStrips = [];
        if (hasCandidates) {
          candidate.candidates.forEach(function (clientId) {
            var strip = document.createElement('div');
            strip.className = 'confirm-strip';

            var stripLabel = document.createElement('span');
            stripLabel.className = 'confirm-strip-label';
            stripLabel.textContent = 'Loading...';
            strip.appendChild(stripLabel);

            var confirmBtn = document.createElement('button');
            confirmBtn.type = 'button';
            confirmBtn.className = 'btn-confirm-match';
            confirmBtn.disabled = true;
            var confirmIcon = document.createElement('span');
            confirmIcon.setAttribute('data-codicon', 'link');
            confirmIcon.setAttribute('data-size', '11');
            confirmBtn.appendChild(confirmIcon);
            confirmBtn.appendChild(document.createTextNode('Confirm'));
            strip.appendChild(confirmBtn);

            body.appendChild(strip);
            confirmStrips.push({ strip: strip, label: stripLabel, btn: confirmBtn, clientId: clientId });

            /* Fetch display name async */
            if (patientQuery) {
              patientQuery.call('get', clientId).then(function (rec) {
                strip.classList.add('visible');
                if (rec && rec.displayName) {
                  stripLabel.textContent = 'Possible match: ' + rec.displayName;
                } else {
                  stripLabel.textContent = 'Possible match';
                }
                confirmBtn.disabled = false;
              }).catch(function () {
                strip.classList.add('visible');
                stripLabel.textContent = 'Possible match (could not load name)';
                confirmBtn.disabled = !hasIdentifier;
              });
            } else {
              strip.classList.add('visible');
              stripLabel.textContent = 'Possible match';
              confirmBtn.disabled = !hasIdentifier;
            }
          });
        }

        /* Feedback strip (hidden until action completes) */
        var feedbackEl = document.createElement('div');
        feedbackEl.className = 'card-feedback';
        body.appendChild(feedbackEl);

        card.appendChild(body);

        /* ── Action buttons ──────────────────────────────────────────────── */
        var actions = document.createElement('div');
        actions.className = 'candidate-actions';

        var promoteBtn = document.createElement('button');
        promoteBtn.type = 'button';
        promoteBtn.className = 'btn-promote';
        var promIcon = document.createElement('span');
        promIcon.setAttribute('data-codicon', 'person');
        promIcon.setAttribute('data-size', '12');
        promoteBtn.appendChild(promIcon);
        promoteBtn.appendChild(document.createTextNode('Add as client'));
        actions.appendChild(promoteBtn);

        var linkBtn = document.createElement('button');
        linkBtn.type = 'button';
        linkBtn.className = 'btn-link';
        var linkIcon = document.createElement('span');
        linkIcon.setAttribute('data-codicon', 'link');
        linkIcon.setAttribute('data-size', '12');
        linkBtn.appendChild(linkIcon);
        linkBtn.appendChild(document.createTextNode('Link to existing'));
        /* Disable if no email or phone to form an alias */
        if (!hasIdentifier) {
          linkBtn.disabled = true;
          linkBtn.title = 'No email or phone — cannot link by identity';
        }
        actions.appendChild(linkBtn);

        var excludeBtn = document.createElement('button');
        excludeBtn.type = 'button';
        excludeBtn.className = 'btn-exclude';
        excludeBtn.appendChild(document.createTextNode('Exclude'));
        actions.appendChild(excludeBtn);

        card.appendChild(actions);

        /* ── Helper: disable/enable all card interactive elements ──────────── */
        function setCardBusy(busy) {
          promoteBtn.disabled = busy;
          linkBtn.disabled    = busy || !hasIdentifier;
          excludeBtn.disabled = busy;
          chk.disabled        = busy;
          confirmStrips.forEach(function (cs) { cs.btn.disabled = busy; });
        }

        /* ── Checkbox handler ──────────────────────────────────────────────── */
        chk.addEventListener('change', function () {
          if (chk.checked) {
            _selected.add(pKey);
            card.classList.add('is-selected');
          } else {
            _selected.delete(pKey);
            card.classList.remove('is-selected');
          }
          updateSelectionUI();
        });

        /* ── Promote handler ─────────────────────────────────────────────── */
        promoteBtn.addEventListener('click', function () {
          if (promoteBtn.disabled || excludeBtn.disabled) return;
          setCardBusy(true);
          feedbackEl.className = 'card-feedback';
          feedbackEl.textContent = '';

          doPromote(candidate)
            .then(function () {
              _candidates = _candidates.filter(function (c) { return c !== candidate; });
              _selected.delete(pKey);
              feedbackEl.className = 'card-feedback visible card-feedback--ok';
              feedbackEl.textContent = 'Added as migrated client.';
              setTimeout(function () { renderList(); updateCount(); updateSelectionUI(); }, 900);
            })
            .catch(function (err) {
              setCardBusy(false);
              var msg = (err && err.message) ? err.message : 'Could not add client. Try again.';
              feedbackEl.className = 'card-feedback visible card-feedback--error';
              feedbackEl.textContent = msg;
            });
        });

        /* ── Link-to-existing handler ────────────────────────────────────── */
        linkBtn.addEventListener('click', function () {
          if (linkBtn.disabled) return;
          openPicker(candidate, null);
        });

        /* ── Confirm-match handlers ──────────────────────────────────────── */
        confirmStrips.forEach(function (cs) {
          cs.btn.addEventListener('click', function () {
            if (cs.btn.disabled) return;
            setCardBusy(true);
            feedbackEl.className = 'card-feedback';
            feedbackEl.textContent = '';

            doLink(candidate, cs.clientId)
              .then(function () {
                _candidates = _candidates.filter(function (c) { return c !== candidate; });
                _selected.delete(pKey);
                feedbackEl.className = 'card-feedback visible card-feedback--ok';
                feedbackEl.textContent = 'Linked to existing client.';
                setTimeout(function () { renderList(); updateCount(); updateSelectionUI(); }, 900);
              })
              .catch(function (err) {
                setCardBusy(false);
                var msg = (err && err.message) ? err.message : 'Could not link. Try again.';
                feedbackEl.className = 'card-feedback visible card-feedback--error';
                feedbackEl.textContent = msg;
              });
          });
        });

        /* ── Exclude handler ─────────────────────────────────────────────── */
        excludeBtn.addEventListener('click', function () {
          if (promoteBtn.disabled || excludeBtn.disabled) return;
          setCardBusy(true);
          feedbackEl.className = 'card-feedback';
          feedbackEl.textContent = '';

          doExclude(candidate)
            .then(function () {
              _candidates = _candidates.filter(function (c) { return c !== candidate; });
              _selected.delete(pKey);
              renderList();
              updateCount();
              updateSelectionUI();
            })
            .catch(function (err) {
              setCardBusy(false);
              var msg = (err && err.message) ? err.message : 'Could not exclude. Try again.';
              feedbackEl.className = 'card-feedback visible card-feedback--error';
              feedbackEl.textContent = msg;
            });
        });

        return card;
      }

      /* ── Batch actions ───────────────────────────────────────────────────── */

      function setBatchBusy(busy, progressText) {
        _batchRunning = busy;
        elBtnBatchPromote.disabled = busy;
        elBtnBatchExclude.disabled = busy;
        elBtnBatchClear.disabled   = busy;
        elBtnRefresh.disabled      = busy;
        elChkSelectAll.disabled    = busy;
        if (busy && progressText) {
          elBatchCount.style.display = 'none';
          elBatchProgress.classList.add('visible');
          elBatchProgress.textContent = progressText;
        } else {
          elBatchCount.style.display = '';
          elBatchProgress.classList.remove('visible');
        }
      }

      function runBatchOp(op) {
        /* op: 'promote' | 'exclude' */
        var keys    = Array.from(_selected);
        var total   = keys.length;
        if (total === 0) return;

        /* Gather candidate objects for selected keys */
        var toProcess = [];
        keys.forEach(function (pKey) {
          var found = null;
          for (var i = 0; i < _candidates.length; i++) {
            if (getParticipantKey(_candidates[i]) === pKey) { found = _candidates[i]; break; }
          }
          if (found) toProcess.push({ pKey: pKey, candidate: found });
        });

        setBatchBusy(true, (op === 'promote' ? 'Adding' : 'Excluding') + ' 1 of ' + total + '...');

        var succeeded = [];
        var failed    = [];

        /* Sequential processing */
        var idx = 0;
        function processNext() {
          if (idx >= toProcess.length) {
            /* Done */
            /* Remove succeeded from _candidates */
            var succeededKeys = new Set(succeeded);
            _candidates = _candidates.filter(function (c) {
              return !succeededKeys.has(getParticipantKey(c));
            });
            /* Leave failed keys in _selected */
            _selected.clear();
            failed.forEach(function (k) { _selected.add(k); });

            setBatchBusy(false, null);
            renderList();
            updateCount();
            updateSelectionUI();

            if (failed.length > 0) {
              setStatus(
                (total - failed.length) + ' done, ' + failed.length + ' failed — failed items still selected.',
                'error'
              );
            }
            return;
          }

          var item = toProcess[idx];
          idx++;
          var done = idx;

          elBatchProgress.textContent = (op === 'promote' ? 'Adding' : 'Excluding') + ' ' + done + ' of ' + total + '...';

          var p = op === 'promote' ? doPromote(item.candidate) : doExclude(item.candidate);
          p.then(function () {
            succeeded.push(item.pKey);
            processNext();
          }).catch(function () {
            failed.push(item.pKey);
            processNext();
          });
        }

        processNext();
      }

      elBtnBatchPromote.addEventListener('click', function () {
        if (_batchRunning) return;
        runBatchOp('promote');
      });

      elBtnBatchExclude.addEventListener('click', function () {
        if (_batchRunning) return;
        runBatchOp('exclude');
      });

      elBtnBatchClear.addEventListener('click', function () {
        if (_batchRunning) return;
        clearSelection();
        updateSelectionUI();
      });

      /* Select-all toolbar checkbox */
      elChkSelectAll.addEventListener('change', function () {
        if (elChkSelectAll.checked) {
          /* Select all visible candidates */
          var visible = _candidates.slice(0, _shownCount);
          visible.forEach(function (c) { _selected.add(getParticipantKey(c)); });
          /* Sync card checkboxes */
          var checkboxes = elListInner.querySelectorAll('.card-checkbox');
          var cards = elListInner.querySelectorAll('.candidate-card');
          for (var i = 0; i < checkboxes.length; i++) {
            checkboxes[i].checked = true;
          }
          for (var j = 0; j < cards.length; j++) {
            cards[j].classList.add('is-selected');
          }
        } else {
          clearSelection();
        }
        updateSelectionUI();
      });

      /* ── Roster picker ───────────────────────────────────────────────────── */

      var _pickerFilter = '';

      function openPicker(candidate, preselectedClientId) {
        _pickerCandidate    = candidate;
        _pickerTargetClient = preselectedClientId;

        /* Subtitle = PHI-safe display of seed identity */
        var sub = candidate.seedName || candidate.seedEmail || '';
        elPickerSubtitle.textContent = sub ? ('Linking: ' + sub) : '';

        elPickerSearch.value = '';
        _pickerFilter = '';
        elPickerStatus.textContent = '';
        elPickerStatus.className = 'picker-status';

        elPickerOverlay.classList.remove('hidden');
        renderPickerList('');

        /* Focus search after DOM settles */
        setTimeout(function () { elPickerSearch.focus(); }, 60);

        /* Pre-fetch roster in background */
        getRoster().catch(function () {});
      }

      function closePicker() {
        elPickerOverlay.classList.add('hidden');
        _pickerCandidate    = null;
        _pickerTargetClient = null;
      }

      function renderPickerList(filter) {
        elPickerList.innerHTML = '';

        getRoster().then(function (roster) {
          var lf = filter.trim().toLowerCase();
          var filtered = lf
            ? roster.filter(function (r) {
                var name = (r.displayName || '').toLowerCase();
                return name.indexOf(lf) !== -1;
              })
            : roster;

          if (filtered.length === 0) {
            var emptyEl = document.createElement('div');
            emptyEl.className = 'picker-empty';
            emptyEl.textContent = filter ? 'No clients match.' : 'No clients in roster.';
            elPickerList.appendChild(emptyEl);
            return;
          }

          filtered.forEach(function (client) {
            var item = document.createElement('div');
            item.className = 'picker-item';
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');

            var initial = (client.displayName && client.displayName[0]) ? client.displayName[0].toUpperCase() : '?';
            var ac = avatarColor(initial);

            var av = document.createElement('div');
            av.className = 'picker-item-avatar';
            av.style.background = ac.bg;
            av.style.color = ac.fg;
            /* PHI-safe: initial only */
            av.textContent = initial;

            var nameEl = document.createElement('div');
            nameEl.className = 'picker-item-name';
            /* PHI-safe textContent */
            nameEl.textContent = client.displayName || client.id;

            item.appendChild(av);
            item.appendChild(nameEl);

            function handlePick() {
              if (!_pickerCandidate) return;
              var candidate = _pickerCandidate;
              elPickerStatus.className = 'picker-status';
              elPickerStatus.textContent = 'Linking...';

              /* Disable all picker items during operation */
              var items = elPickerList.querySelectorAll('.picker-item');
              for (var i = 0; i < items.length; i++) {
                items[i].style.pointerEvents = 'none';
                items[i].style.opacity = '0.5';
              }

              doLink(candidate, client.id)
                .then(function () {
                  closePicker();
                  _candidates = _candidates.filter(function (c) { return c !== candidate; });
                  _selected.delete(getParticipantKey(candidate));
                  renderList();
                  updateCount();
                  updateSelectionUI();
                })
                .catch(function (err) {
                  var msg = (err && err.message) ? err.message : 'Could not link. Try again.';
                  elPickerStatus.className = 'picker-status picker-status--error';
                  elPickerStatus.textContent = msg;
                  /* Re-enable items */
                  for (var i = 0; i < items.length; i++) {
                    items[i].style.pointerEvents = '';
                    items[i].style.opacity = '';
                  }
                });
            }

            item.addEventListener('click', handlePick);
            item.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handlePick(); }
            });

            elPickerList.appendChild(item);
          });

          if (boot.applyCodicons) boot.applyCodicons();
        }).catch(function (err) {
          var emptyEl = document.createElement('div');
          emptyEl.className = 'picker-empty';
          emptyEl.textContent = 'Could not load clients.';
          elPickerList.appendChild(emptyEl);
        });
      }

      elPickerSearch.addEventListener('input', function () {
        _pickerFilter = elPickerSearch.value;
        renderPickerList(_pickerFilter);
      });

      elPickerClose.addEventListener('click', closePicker);

      elPickerOverlay.addEventListener('click', function (e) {
        if (e.target === elPickerOverlay) closePicker();
      });

      elPickerOverlay.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closePicker();
      });

      /* ── Message handler ─────────────────────────────────────────────────── */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        boot.applyTheme(d);
      });

      /* ── Refresh button ──────────────────────────────────────────────────── */
      elBtnRefresh.addEventListener('click', function () {
        runScan();
      });

      /* ── Bridge bootstrap ────────────────────────────────────────────────── */
      boot.awaitBridge().then(function (soamView) {
        window.soamView = soamView;

        /* DOMContentLoaded guard before touching body classes */
        if (document.body) {
          elBridgeWait.classList.add('hidden');
          elRoot.classList.remove('hidden');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            elBridgeWait.classList.add('hidden');
            elRoot.classList.remove('hidden');
          });
        }

        boot.applyCodicons();

        if (!_calendarId) {
          elHdrSub.textContent = 'No calendar selected';
          setStatus('Open this view from a calendar row.', 'error');
          return;
        }

        /* Bind caps in parallel; view-binds are not manifest-gated */
        Promise.all([
          soamView.bindQuery('record.migration.query', '1.0'),
          soamView.bindCommand('record.migration', '1.0'),
          soamView.bindCommand('record.patient', '1.0'),
          soamView.bindQuery('schedule.calendar.query', '1.0'),
          soamView.bindQuery('record.patient.query', '1.0'),
        ]).then(function (caps) {
          queryCap      = caps[0];
          cmdCap        = caps[1];
          patientCmd    = caps[2];
          schQueryCap   = caps[3];
          patientQuery  = caps[4];

          loadCalendarName();
          runScan();
        }).catch(function (err) {
          var msg = (err && err.message) ? err.message : 'Could not bind capabilities.';
          setStatus(msg, 'error');
        });

      }).catch(function (err) {
        elBridgeWait.textContent = 'Bridge error: ' + (err && err.message ? err.message : String(err));
      });

    })();
    </script>
  </body>
</html>
