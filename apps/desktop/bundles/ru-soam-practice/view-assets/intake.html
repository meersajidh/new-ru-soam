<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src view: 'unsafe-inline'; style-src view: 'unsafe-inline'; img-src view: data:; connect-src 'none'; font-src data:"
    />
    <title>Intake Checklist</title>
    <style>

      /* ── Reset ──────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ── Design tokens (overridden via postMessage) ─────────────── */
      :root {
        color-scheme: light dark;
        --font-sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, 'Courier New', monospace;
        --color-surface-base:     #161618;
        --color-surface-panel:    #1c1c1f;
        --color-surface-elevated: #232326;
        --color-surface-active:   #2a2d26;
        --color-fg-primary:   #f2f2f7;
        --color-fg-secondary: #aeaeb2;
        --color-fg-muted:     #636366;
        --color-border:       #3a3a3c;
        --color-border-focus: #5ac85a;
        --color-accent:         #5ac85a;
        --color-accent-fg:      #1c1c1e;
        --color-success: #5ac85a;
        --color-warning: #f4a623;
        --color-error:   #e05252;
        --radius-sm: 4px;
        --radius-md: 7px;
        --transition: 130ms ease;
      }

      /* ── Base ───────────────────────────────────────────────────── */
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-surface-base);
        color: var(--color-fg-primary);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Bridge wait overlay ────────────────────────────────────── */
      #bridge-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-base);
        z-index: 100;
        gap: 8px;
        font-size: 11px;
        color: var(--color-fg-muted);
      }
      .spinner {
        display: inline-block;
        width: 11px; height: 11px;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Root layout ────────────────────────────────────────────── */
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Status bar ─────────────────────────────────────────────── */
      #status-bar {
        font-size: 11px;
        padding: 5px 16px;
        background: color-mix(in srgb, var(--color-error) 9%, transparent);
        color: var(--color-error);
        font-weight: 500;
        display: none;
        flex-shrink: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--color-error) 25%, transparent);
      }
      #status-bar.visible { display: block; }
      #status-bar.is-locked {
        background: color-mix(in srgb, var(--color-warning) 9%, transparent);
        color: var(--color-warning);
        border-color: color-mix(in srgb, var(--color-warning) 25%, transparent);
      }

      /* ── Header strip ───────────────────────────────────────────── */
      #header-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px 11px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-panel);
        flex-shrink: 0;
      }
      .hs-icon { color: var(--color-accent); flex: 0 0 auto; }
      .hs-title { font-size: 14px; font-weight: 600; flex: 1 1 auto; }
      .hs-client {
        font-size: 11px;
        color: var(--color-fg-muted);
        font-family: var(--font-mono);
      }

      /* ── Scroll area ────────────────────────────────────────────── */
      #ic-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 28px 48px;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--color-fg-muted) 40%, transparent) transparent;
      }

      /* ── Card ───────────────────────────────────────────────────── */
      #ic-card {
        max-width: 560px;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* ── Progress header ────────────────────────────────────────── */
      #ic-progress-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--color-border);
        margin-bottom: 6px;
      }
      .ic-count {
        font-size: 22px;
        font-weight: 700;
        color: var(--color-fg-primary);
        font-family: var(--font-mono);
        flex-shrink: 0;
      }
      .ic-count-label {
        font-size: 12px;
        color: var(--color-fg-muted);
      }
      .ic-progress-bar-wrap {
        flex: 1 1 auto;
        height: 6px;
        background: color-mix(in srgb, var(--color-fg-muted) 20%, transparent);
        border-radius: 3px;
        overflow: hidden;
      }
      .ic-progress-bar-fill {
        height: 100%;
        background: var(--color-accent);
        border-radius: 3px;
        transition: width 0.25s ease;
      }

      /* ── Item row ───────────────────────────────────────────────── */
      .ic-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        transition: background var(--transition);
      }
      .ic-item:hover { background: var(--color-surface-active); }

      .ic-item-icon {
        flex-shrink: 0;
        width: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ic-item-icon.done { color: var(--color-success); }
      .ic-item-icon.missing { color: var(--color-fg-muted); }

      .ic-item-label {
        flex: 1 1 auto;
        font-size: 12.5px;
        color: var(--color-fg-secondary);
      }
      .ic-item.done-row .ic-item-label {
        color: var(--color-fg-muted);
        text-decoration: line-through;
        text-decoration-color: color-mix(in srgb, var(--color-fg-muted) 50%, transparent);
      }

      .ic-open-btn {
        flex-shrink: 0;
        font-size: 10.5px;
        font-weight: 500;
        padding: 3px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-fg-muted);
        cursor: pointer;
        transition: background var(--transition), color var(--transition), border-color var(--transition);
        font-family: var(--font-sans);
      }
      .ic-open-btn:hover {
        background: var(--color-surface-active);
        color: var(--color-fg-secondary);
        border-color: color-mix(in srgb, var(--color-border-focus) 60%, transparent);
      }

      /* ── Complete state ─────────────────────────────────────────── */
      #ic-complete-banner {
        display: none;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 10px 14px;
        background: color-mix(in srgb, var(--color-success) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-success) 30%, transparent);
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--color-success);
        font-weight: 500;
      }
      #ic-complete-banner.visible { display: flex; }

      /* ── Empty / no-data ────────────────────────────────────────── */
      #ic-empty {
        display: none;
        padding: 32px 0 0;
        text-align: center;
        color: var(--color-fg-muted);
        font-size: 12px;
      }
      #ic-empty.visible { display: block; }
    </style>
  </head>
  <body>
    <!-- Bridge wait overlay -->
    <div id="bridge-wait">
      <span class="spinner"></span>
      Loading…
    </div>

    <div id="root" style="display:none">
      <div id="status-bar" role="alert"></div>

      <!-- Header strip -->
      <div id="header-strip">
        <span class="hs-icon" data-codicon="inbox" data-size="15"></span>
        <span class="hs-title" id="hs-title">Intake</span>
        <span class="hs-client" id="hs-client"></span>
      </div>

      <div id="ic-scroll">
        <div id="ic-card" data-maturity-id="intake-checklist">
          <div id="ic-loading" style="color:var(--color-fg-muted);font-size:12px;">Loading…</div>
        </div>
        <div id="ic-empty">No data for this client.</div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';

      /* ── State ──────────────────────────────────────────────────── */
      var _proxy      = null;
      var _clientId   = null;
      var _clientTitle = null;
      var _data       = null;  // getIntakeCompleteness result or null

      /* ── Elements ───────────────────────────────────────────────── */
      var elBridgeWait = document.getElementById('bridge-wait');
      var elRoot       = document.getElementById('root');
      var elStatusBar  = document.getElementById('status-bar');
      var elHsTitle    = document.getElementById('hs-title');
      var elHsClient   = document.getElementById('hs-client');
      var elCard       = document.getElementById('ic-card');
      var elEmpty      = document.getElementById('ic-empty');
      var elLoading    = document.getElementById('ic-loading');

      /* ── Helpers ────────────────────────────────────────────────── */
      function showError(msg) {
        elStatusBar.textContent = msg;
        elStatusBar.className = 'visible';
      }
      function showLocked(msg) {
        elStatusBar.textContent = msg || 'Workspace locked — unlock to view.';
        elStatusBar.className = 'visible is-locked';
      }
      function isLockedError(err) {
        return err && (err.code === 'cap.locked' ||
          (err.message && err.message.indexOf('cap.locked') !== -1));
      }

      function applyCodeicons(root) {
        var els = (root || document).querySelectorAll('[data-codicon]');
        for (var i = 0; i < els.length; i++) {
          var e = els[i];
          var name = e.getAttribute('data-codicon');
          var size = parseInt(e.getAttribute('data-size') || '13', 10);
          if (window.codicon) {
            e.innerHTML = window.codicon(name, size);
          }
        }
      }

      /* ── Render ─────────────────────────────────────────────────── */
      function renderChecklist(data) {
        elCard.innerHTML = '';
        elEmpty.classList.remove('visible');

        if (!data) {
          elEmpty.classList.add('visible');
          return;
        }

        // Progress header
        var progressHdr = document.createElement('div');
        progressHdr.id = 'ic-progress-header';

        var countEl = document.createElement('div');
        countEl.className = 'ic-count';
        countEl.textContent = data.doneCount + '/' + data.total;

        var countLabel = document.createElement('div');
        countLabel.className = 'ic-count-label';
        countLabel.textContent = 'items complete';

        var barWrap = document.createElement('div');
        barWrap.className = 'ic-progress-bar-wrap';
        var barFill = document.createElement('div');
        barFill.className = 'ic-progress-bar-fill';
        barFill.style.width = Math.round((data.doneCount / data.total) * 100) + '%';
        barWrap.appendChild(barFill);

        progressHdr.appendChild(countEl);
        var countGroup = document.createElement('div');
        countGroup.style.display = 'flex';
        countGroup.style.flexDirection = 'column';
        countGroup.style.gap = '2px';
        countGroup.appendChild(countEl);
        countGroup.appendChild(countLabel);
        progressHdr.appendChild(countGroup);
        progressHdr.appendChild(barWrap);
        // Redo: put count+label together then bar
        progressHdr.innerHTML = '';
        var left = document.createElement('div');
        left.style.display = 'flex';
        left.style.flexDirection = 'column';
        left.style.flexShrink = '0';
        var bigCount = document.createElement('div');
        bigCount.className = 'ic-count';
        bigCount.textContent = data.doneCount + '/' + data.total;
        var lbl = document.createElement('div');
        lbl.className = 'ic-count-label';
        lbl.textContent = data.complete ? 'Complete' : 'items complete';
        left.appendChild(bigCount);
        left.appendChild(lbl);
        var bar2 = document.createElement('div');
        bar2.className = 'ic-progress-bar-wrap';
        var fill2 = document.createElement('div');
        fill2.className = 'ic-progress-bar-fill';
        fill2.style.width = Math.round((data.doneCount / data.total) * 100) + '%';
        if (data.complete) {
          fill2.style.background = 'var(--color-success)';
        }
        bar2.appendChild(fill2);
        progressHdr.appendChild(left);
        progressHdr.appendChild(bar2);
        elCard.appendChild(progressHdr);

        // Update header title
        elHsTitle.textContent = 'Intake — ' + data.doneCount + '/' + data.total + ' complete';

        // Item list
        var itemList = document.createElement('div');
        itemList.style.display = 'flex';
        itemList.style.flexDirection = 'column';
        itemList.style.gap = '2px';

        data.items.forEach(function (item) {
          var row = document.createElement('div');
          row.className = 'ic-item' + (item.done ? ' done-row' : '');

          var iconWrap = document.createElement('span');
          iconWrap.className = 'ic-item-icon ' + (item.done ? 'done' : 'missing');

          if (item.done) {
            iconWrap.setAttribute('data-codicon', 'check');
            iconWrap.setAttribute('data-size', '13');
          } else {
            iconWrap.setAttribute('data-codicon', 'circle-large-outline');
            iconWrap.setAttribute('data-size', '13');
          }

          var labelEl = document.createElement('span');
          labelEl.className = 'ic-item-label';
          labelEl.textContent = item.label;

          row.appendChild(iconWrap);
          row.appendChild(labelEl);

          if (!item.done) {
            var openBtn = document.createElement('button');
            openBtn.className = 'ic-open-btn';
            openBtn.type = 'button';
            openBtn.textContent = 'Open record';
            openBtn.addEventListener('click', function () {
              if (window.soamView) {
                window.soamView.openInEditor('overview', {
                  entityId: _clientId,
                  title: _clientTitle || _clientId,
                });
              }
            });
            row.appendChild(openBtn);
          }

          itemList.appendChild(row);
        });

        elCard.appendChild(itemList);

        // Complete banner
        if (data.complete) {
          var banner = document.createElement('div');
          banner.id = 'ic-complete-banner';
          banner.className = 'visible';
          var checkIcon = document.createElement('span');
          checkIcon.setAttribute('data-codicon', 'check-all');
          checkIcon.setAttribute('data-size', '14');
          var bannerText = document.createElement('span');
          bannerText.textContent = 'Intake checklist complete';
          banner.appendChild(checkIcon);
          banner.appendChild(bannerText);
          elCard.appendChild(banner);
        }

        applyCodeicons(elCard);
      }

      /* ── Load data ──────────────────────────────────────────────── */
      function loadAndRender() {
        if (!_proxy || !_clientId) return;
        _proxy.call('getIntakeCompleteness', _clientId).then(function (data) {
          _data = data;
          renderChecklist(_data);
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked();
          } else {
            showError('Failed to load: ' + (err && err.message));
          }
        });
      }

      /* ── Parse query string ─────────────────────────────────────── */
      function parseQuery(search) {
        var q = (search || '').replace(/^\?/, '');
        var params = {};
        q.split('&').forEach(function (pair) {
          var idx = pair.indexOf('=');
          if (idx < 0) return;
          var k = decodeURIComponent(pair.slice(0, idx));
          var v = decodeURIComponent(pair.slice(idx + 1));
          params[k] = v;
        });
        return params;
      }

      /* ── Message handler (theme) ────────────────────────────────── */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.__soamView !== true) return;
        if ((d.kind === 'init' || d.kind === 'theme') && d.theme) {
          var root = document.documentElement;
          Object.keys(d.theme).forEach(function (k) {
            root.style.setProperty(k, d.theme[k]);
          });
        }
      });

      /* ── Bridge await ───────────────────────────────────────────── */
      function awaitBridge() {
        return new Promise(function (resolve) {
          if (window.soamView) return resolve(window.soamView);
          var iv = setInterval(function () {
            if (window.soamView) { clearInterval(iv); resolve(window.soamView); }
          }, 25);
        });
      }

      var _soamView = null;

      function ensureProxyAndRender(soamView) {
        if (_proxy) {
          loadAndRender();
          return;
        }
        soamView.bindQuery('record.patient.query', '1.0').then(function (proxy) {
          _proxy = proxy;
          loadAndRender();
        }).catch(function (err) {
          if (isLockedError(err)) {
            showLocked();
          } else {
            showError('Bridge error: ' + (err && err.message));
          }
        });
      }

      awaitBridge().then(function (soamView) {
        elBridgeWait.style.display = 'none';
        elRoot.style.display = '';
        _soamView = soamView;

        // Read clientId from location.search ?id= (opened via openInEditor).
        var params = parseQuery(window.location.search);
        _clientId = params.id || null;

        if (!_clientId) {
          showError('No client id in URL — open via the intake checklist button.');
          return;
        }

        if (params.title) {
          _clientTitle = decodeURIComponent(params.title);
          elHsClient.textContent = _clientTitle;
        }

        ensureProxyAndRender(soamView);

        // Reload on any owned-table change — completeness spans all of them.
        var OWNED_TABLES = [
          'patients', 'patient_profile', 'patient_lifecycle',
          'patient_circle_member', 'patient_consent_state',
          'patient_risk_event', 'patient_safety_plan', 'patient_document',
        ];
        soamView.events.onStoreChange(function (payload) {
          if (payload && OWNED_TABLES.indexOf(payload.table) !== -1) {
            loadAndRender();
          }
        });

      });

    })();
    </script>
  </body>
</html>
