appId: ru-soam
productName: Ru-Soam
# Native modules are rebuilt to the Electron ABI by the app's
# `postinstall: node scripts/rebuild-natives.mjs` (@electron/rebuild). Disable
# the packager's own rebuild pass to avoid double work and asar-cache stalls.
npmRebuild: false

directories:
  output: release

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - dist/fp-host/**
  - changelog.json
  - package.json
  # Never ship sourcemaps. They are still emitted to dist/ (sourcemap:true in the
  # vite configs) for crash symbolication as a CI artifact, but packing them into
  # app.asar would expose the full original main/preload/fp-host source plus a
  # redundant copy of the O309c build-baked OAuth secret to anyone who unpacks the
  # app. (The secret also lives in index.mjs itself — that is the accepted
  # desktop pseudo-secret, removed only when O309a moves code-exchange server-side.)
  - "!**/*.map"

# Native bindings must live outside app.asar (V8 cannot dlopen a .node
# from inside an asar). electron-builder auto-unpacks *.node, but be
# explicit so the napi-rs platform package + better-sqlite3 ship whole.
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3-multiple-ciphers/**"
  - "node_modules/@node-rs/argon2*/**"

# First-party bundles ship under `resources/bundles/`, which is what
# `fp-host/loader.ts` reads via `path.join(process.resourcesPath, 'bundles')`
# in packaged builds.
extraResources:
  - from: bundles
    to: bundles

generateUpdatesFilesForAllChannels: true

publish:
  provider: generic
  url: https://dl.ru-soam.com

linux:
  icon: electron/assets/icon/icon-512.png
  category: Office
  # ADR-204 §1: deb only. AppImage dropped.
  target:
    - deb
  artifactName: ${name}_${version}_${arch}.${ext}
  executableName: ru-soam
  desktop:
    entry:
      Name: Ru-Soam
      Icon: ru-soam
      StartupWMClass: ru-soam
      StartupNotify: 'true'
      Categories: Office;
      Keywords: ru-soam;practitioner;workbench;

win:
  icon: electron/assets/icon/icon.ico
  target:
    - nsis

# ADR-308 §1: installer must NOT touch userData.
# One-click installer (oneClick default = true): double-click installs to
# %LocalAppData% and launches, no wizard. allowToChangeInstallationDirectory
# is intentionally omitted — it requires oneClick: false (assisted installer).
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
