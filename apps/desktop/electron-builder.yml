appId: ru-soam
productName: Ru-Soam
# Renderer/main/preload/bundle-host natives are rebuilt via the
# `postinstall: electron-builder install-app-deps` step. Disable the
# packager's own rebuild pass to avoid double work and asar-cache stalls.
npmRebuild: false

directories:
  output: release

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - dist/bundle-host/**
  - changelog.json
  - package.json

# First-party bundles ship under `resources/bundles/`, which is what
# `bundle-host/loader.ts` reads via `path.join(process.resourcesPath, 'bundles')`
# in packaged builds.
extraResources:
  - from: bundles
    to: bundles

publish:
  provider: github
  owner: meersajidh
  repo: new-ru-soam
  releaseType: release

linux:
  icon: electron/assets/icon/icon-512.png
  category: Office
  # ADR-204 §1: deb only. AppImage dropped.
  target:
    - deb
  artifactName: ${name}_${version}_${arch}.${ext}
  executableName: ru-soam
  desktop:
    entry:
      Name: Ru-Soam
      Icon: ru-soam
      StartupWMClass: ru-soam
      StartupNotify: 'true'
      Categories: Office;
      Keywords: ru-soam;practitioner;workbench;

win:
  icon: electron/assets/icon/icon.ico
  target:
    - nsis

# ADR-308 §1: installer must NOT touch userData.
# One-click installer (oneClick default = true): double-click installs to
# %LocalAppData% and launches, no wizard. allowToChangeInstallationDirectory
# is intentionally omitted — it requires oneClick: false (assisted installer).
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
