# NOTE: Both Renovate (renovate.json) and Dependabot are active.
# They may both open update PRs for the same deps. Consider scoping one
# (e.g., Dependabot) to security-only via `open-pull-requests-limit: 0`
# and adding `security-advisories-only: true` if the overlap becomes noisy.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Electron is pinned to 41.x — Electron 42's V8-14 API breaks the
      # better-sqlite3-multiple-ciphers native compile (O157). Allow 41.x
      # patch/minor; block major bumps until O157 is resolved.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
