name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'

permissions:
  contents: read

jobs:
  web:
    name: Web (Cloudflare Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: node apps/web/build.mjs
        env:
          R2_PUBLIC_URL: https://dl.ru-soam.com
          SITE_URL: https://ru-soam.pages.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy apps/web/dist --project-name=ru-soam --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
