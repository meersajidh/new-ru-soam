name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Use bash on both OSes (Git Bash on Windows). Default Windows shell is
    # pwsh, which aborts a step on any native-command stderr / non-zero exit
    # and can swallow npm output — npm ci then fails with zero diagnostics.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm bug #4828: a lockfile generated on Linux records NO win32 package
      # nodes for platform-native optional deps, and neither `npm ci` nor
      # `npm install` will synthesize them on Windows. Install every win32
      # binding explicitly, pinned to the exact version its parent declares, so
      # `vite build` (rolldown / lightningcss / @tailwindcss/oxide) finds its
      # native `.node`. These are BUILD-only and never packed. (@node-rs/argon2
      # is a *runtime* dep that must ship in app.asar, so its win32 binding is
      # declared in apps/desktop optionalDependencies → committed lockfile →
      # npm ci installs it + electron-builder packs it; not handled here.)
      # Regenerate the build-tool family list if native devDeps change:
      #   node -e 'const l=require("./package-lock.json");const s=new Set();for(const[p,i]of Object.entries(l.packages||{}))if(i&&(i.os||i.cpu))s.add(p.split("node_modules/").pop().replace(/-(win32|linux|darwin|android|freebsd|openharmony|wasm32)(-.*)?$/,""));console.log([...s].sort())'
      - name: Install Windows native bindings (npm #4828)
        if: runner.os == 'Windows'
        run: |
          specs="$(node -e '
            const l = require("./package-lock.json");
            const binds = [
              "@rolldown/binding-win32-x64-msvc",
              "lightningcss-win32-x64-msvc",
              "@tailwindcss/oxide-win32-x64-msvc",
            ];
            const out = [];
            for (const b of binds) {
              let v = null;
              for (const i of Object.values(l.packages || {}))
                if (i && i.optionalDependencies && i.optionalDependencies[b]) { v = i.optionalDependencies[b]; break; }
              if (!v) { console.error("::error::no lockfile pin for " + b); process.exit(1); }
              out.push(b + "@" + v);
            }
            process.stdout.write(out.join(" "));
          ')"
          echo "win32 native bindings: $specs"
          npm install --no-save --no-audit --no-fund $specs

      # Parse CHANGELOG.md and emit changelog.json + release-notes-<version>.md
      # before electron-builder runs so changelog.json is picked up by the
      # `files` glob in electron-builder.yml.
      - name: Build changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cd apps/desktop
          node scripts/build-changelog.mjs --release="$VERSION"

      - name: Build app
        run: npm run build -w ru-soam

      # Node's dlopen uses LOAD_WITH_ALTERED_SEARCH_PATH → a .node's dependent DLLs
      # are resolved from the .node's OWN directory, NOT the exe dir. So the VC++
      # runtime must sit NEXT TO the binding: copy it into the argon2 package dir;
      # asarUnpack (node_modules/@node-rs/argon2*/**) then ships it alongside
      # argon2.win32-x64-msvc.node in app.asar.unpacked. argon2 imports
      # vcruntime140.dll, which is NOT part of Windows (only the Universal CRT is) —
      # without this the app crashes "Failed to load native binding" on a clean
      # Windows with no VC++ redistributable. Source = the runner's installed VC++
      # runtime (System32). better-sqlite3 is statically linked → needs nothing.
      # (ADR-204 packaging amendment. *.dll is gitignored — staged, not vendored.)
      - name: Stage VC++ runtime next to the native binding (Windows)
        if: runner.os == 'Windows'
        run: |
          dest="node_modules/@node-rs/argon2-win32-x64-msvc"
          cp /c/Windows/System32/vcruntime140.dll \
             /c/Windows/System32/vcruntime140_1.dll \
             /c/Windows/System32/msvcp140.dll "$dest/"
          ls -l "$dest"/*.dll

      # Channel is derived from the tag: hyphenated semver (v0.1.1-beta.1) → beta
      # channel (writes beta.yml/alpha.yml, never latest.yml); plain tag → latest
      # (writes latest.yml + cascades to beta.yml/alpha.yml via
      # generateUpdatesFilesForAllChannels). --publish never = build only; R2 upload
      # is the next step.
      - name: Build installers
        shell: bash
        run: |
          CHANNEL=latest
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then CHANNEL=beta; fi
          echo "channel=$CHANNEL"
          cd apps/desktop && npx electron-builder --config electron-builder.yml -c.publish.channel="$CHANNEL" --publish never

      # Upload top-level distributables to R2. Globs are intentionally non-recursive
      # so *-unpacked/ app executables are excluded.
      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put() {
            echo "uploading $1 (cache-control: $2)"
            aws s3 cp "$1" "s3://${R2_BUCKET}/" --endpoint-url "$ENDPOINT" --cache-control "$2"
          }
          # Versioned installers + blockmaps never change for a given version →
          # cache hard at the edge (fast downloads, low R2 egress).
          for f in apps/desktop/release/*.exe apps/desktop/release/*.deb apps/desktop/release/*.blockmap; do
            [ -e "$f" ] || continue
            put "$f" "public, max-age=31536000, immutable"
          done
          # Update manifests change in place across releases and MUST be fresh so
          # electron-updater detects new versions → never cache them.
          for f in apps/desktop/release/*.yml; do
            [ -e "$f" ] || continue
            put "$f" "no-cache, max-age=0, must-revalidate"
          done

  web:
    name: Web (Cloudflare Pages)
    runs-on: ubuntu-latest
    # Wait for both matrix legs so all manifests are uploaded before site builds.
    needs: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: node apps/web/build.mjs
        env:
          R2_PUBLIC_URL: https://dl.ru-soam.com
          SITE_URL: https://ru-soam.pages.dev

      # Skipped when build.mjs warned-and-skipped (no stable manifest → no dist/),
      # keeping the previously deployed site live instead of failing the release.
      - name: Deploy to Cloudflare Pages
        if: hashFiles('apps/web/dist/index.html') != ''
        run: npx wrangler@4 pages deploy apps/web/dist --project-name=ru-soam --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
